<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專業投資回測與資產管理系統</title>
  
  <!-- Tailwind CSS 美化套件 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 核心套件 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel 翻譯機 -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase 雲端資料庫套件 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* 現代化捲軸與字體 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; }
    .bento-card { background: #ffffff; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; transition: all 0.2s; }
    .bento-card:hover { box-shadow: 0 8px 30px -4px rgba(0,0,0,0.06); }
    .glass-effect { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 1. Firebase 初始化 ---
    const firebaseConfig = {
      apiKey: "AIzaSyBrLbe2Qx_k-icTv61SQNBw7n4hIcYBCiE",
      authDomain: "my-stock-tracker-f3065.firebaseapp.com",
      projectId: "my-stock-tracker-f3065",
      storageBucket: "my-stock-tracker-f3065.firebasestorage.app",
      messagingSenderId: "802802972309",
      appId: "1:802802972309:web:70c2eadc6b040689834d9c"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // --- 2. 輔助字典與選項 ---
    const CATEGORIES = [
      { id: 'TW_STOCK', label: '台股' }, { id: 'TW_ETF', label: '台股ETF' },
      { id: 'US_STOCK', label: '美股' }, { id: 'FUND', label: '基金' },
    ];
    const BUY_REASONS = ['技術面突破', '基本面財報', '籌碼面優勢', '消息/題材', '定期定額', '情緒衝動/FOMO'];
    const SELL_REASONS = ['達停利點', '觸停損點', '基本面惡化', '換股操作', '恐慌拋售'];
    const STRATEGY_TAGS = ['長線存股', '波段操作', '短線當沖', '實驗策略'];
    
    const STOCK_DICTIONARY = {
      '2330': { name: '台積電', category: 'TW_STOCK' }, '2317': { name: '鴻海', category: 'TW_STOCK' },
      '0050': { name: '元大台灣50', category: 'TW_ETF' }, '00878': { name: '國泰永續高股息', category: 'TW_ETF' },
      'AAPL': { name: 'Apple', category: 'US_STOCK' }, 'NVDA': { name: 'NVIDIA', category: 'US_STOCK' },
      'QQQ': { name: 'Invesco QQQ', category: 'US_STOCK' }
    };

    // --- 3. 系統主元件 ---
    function App() {
      const [user, setUser] = useState(null);
      const [transactions, setTransactions] = useState([]);
      const [cashFlows, setCashFlows] = useState([]); // 新增：現金流水帳 (入金/出金/股息)
      const [marketPrices, setMarketPrices] = useState({});
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [historyFilter, setHistoryFilter] = useState('all');

      // 表單狀態 - 交易紀錄
      const [isTradeModalOpen, setIsTradeModalOpen] = useState(false);
      const [editingTradeId, setEditingTradeId] = useState(null);
      const initialTradeForm = {
        date: new Date().toISOString().split('T')[0],
        symbol: '', name: '', category: 'TW_STOCK', type: 'buy',
        price: '', shares: '', fee: '', tax: '', netAmount: '',
        strategy: '波段操作', reason: '', confidence: '3', planFollowed: 'yes', notes: ''
      };
      const [tradeForm, setTradeForm] = useState(initialTradeForm);

      // 表單狀態 - 現金出入金
      const [isCashModalOpen, setIsCashModalOpen] = useState(false);
      const initialCashForm = {
        date: new Date().toISOString().split('T')[0],
        type: 'deposit', // deposit, withdraw, dividend
        amount: '', notes: ''
      };
      const [cashForm, setCashForm] = useState(initialCashForm);

      // --- 資料抓取 ---
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        setLoading(true);
        
        // 抓交易
        const unsubTx = db.collection('users').doc(user.uid).collection('transactions').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a, b) => new Date(a.date) - new Date(b.date)); // 必須舊到新算成本
          setTransactions(data);
        });

        // 抓出入金
        const unsubCash = db.collection('users').doc(user.uid).collection('cashFlows').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setCashFlows(data);
          setLoading(false);
        });

        // 抓現價
        const unsubPrice = db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').onSnapshot((doc) => {
          if (doc.exists) setMarketPrices(doc.data());
        });

        return () => { unsubTx(); unsubCash(); unsubPrice(); };
      }, [user]);

      // --- 核心帳務與績效引擎 (雙軌制：現金帳 + 證券帳) ---
      const portfolio = useMemo(() => {
        let holdings = {};
        let sys = {
          totalDeposits: 0, totalWithdrawals: 0, totalDividends: 0,
          availableCash: 0, // 購買力
          totalRealized: 0, totalUnrealized: 0, totalMarketValue: 0, totalInvested: 0,
          // KPI 統計
          winTrades: 0, loseTrades: 0, totalWinAmount: 0, totalLoseAmount: 0, maxDrawdown: 0
        };

        // 1. 計算純現金流 (入金 - 出金 + 股息)
        cashFlows.forEach(cf => {
          const amt = parseFloat(cf.amount) || 0;
          if (cf.type === 'deposit') { sys.totalDeposits += amt; sys.availableCash += amt; }
          else if (cf.type === 'withdraw') { sys.totalWithdrawals += amt; sys.availableCash -= amt; }
          else if (cf.type === 'dividend') { sys.totalDividends += amt; sys.availableCash += amt; }
        });

        // 2. 結算證券交易
        transactions.forEach(tx => {
          if (!holdings[tx.symbol]) {
            holdings[tx.symbol] = { symbol: tx.symbol, name: tx.name, category: tx.category, shares: 0, totalCost: 0, avgCost: 0, realizedProfit: 0 };
          }
          let h = holdings[tx.symbol];
          let shares = parseFloat(tx.shares) || 0;
          let netAmount = parseFloat(tx.netAmount) || 0;

          if (tx.type === 'buy') {
            h.shares += shares;
            h.totalCost += netAmount;
            h.avgCost = h.shares > 0 ? h.totalCost / h.shares : 0;
            sys.availableCash -= netAmount; // 買股扣款
          } else if (tx.type === 'sell') {
            let costOfSoldShares = h.avgCost * shares;
            let profit = netAmount - costOfSoldShares; // 單筆已實現損益
            
            h.realizedProfit += profit;
            sys.totalRealized += profit;
            sys.availableCash += netAmount; // 賣股變現入帳
            
            h.shares -= shares;
            h.totalCost -= costOfSoldShares;
            if (h.shares <= 0.0001) { h.shares = 0; h.totalCost = 0; h.avgCost = 0; }

            // KPI 計算
            if (profit > 0) { sys.winTrades++; sys.totalWinAmount += profit; }
            else { sys.loseTrades++; sys.totalLoseAmount += Math.abs(profit); }
          }
        });

        // 3. 計算未實現與現值
        const activeHoldings = Object.values(holdings).filter(h => h.shares > 0);
        activeHoldings.forEach(h => {
          let currentPrice = marketPrices[h.symbol] || h.avgCost;
          let marketValue = h.shares * currentPrice;
          let unrealized = marketValue - h.totalCost;
          
          h.currentPrice = currentPrice; h.marketValue = marketValue; h.unrealized = unrealized;
          h.roi = h.totalCost > 0 ? (unrealized / h.totalCost) * 100 : 0;

          sys.totalInvested += h.totalCost;
          sys.totalMarketValue += marketValue;
          sys.totalUnrealized += unrealized;
        });

        // 衍生 KPI 指標
        sys.netWorth = sys.availableCash + sys.totalMarketValue; // 淨資產 = 現金 + 庫存市值
        sys.totalROI = sys.totalDeposits > 0 ? ((sys.netWorth + sys.totalWithdrawals - sys.totalDeposits) / sys.totalDeposits) * 100 : 0;
        sys.winRate = (sys.winTrades + sys.loseTrades) > 0 ? (sys.winTrades / (sys.winTrades + sys.loseTrades)) * 100 : 0;
        sys.profitLossRatio = (sys.loseTrades > 0 && sys.totalLoseAmount > 0) ? (sys.totalWinAmount / sys.winTrades) / (sys.totalLoseAmount / sys.loseTrades) : (sys.winTrades > 0 ? 999 : 0);

        return { holdings: Object.values(holdings), activeHoldings, sys };
      }, [transactions, cashFlows, marketPrices]);


      // --- 表單與事件 ---
      
      // 修復：補回遺失的 handleLogin 函式
      const handleLogin = async () => {
        try {
          await auth.signInWithPopup(googleProvider);
        } catch (error) {
          console.error(error);
          alert("登入失敗，請重試");
        }
      };

      const handleTradeChange = (e) => {
        const { name, value } = e.target;
        let newData = { ...tradeForm, [name]: value };
        if (name === 'symbol' && STOCK_DICTIONARY[value.toUpperCase()]) {
          newData.name = STOCK_DICTIONARY[value.toUpperCase()].name;
          newData.category = STOCK_DICTIONARY[value.toUpperCase()].category;
        }
        // 自動算淨收付
        const price = parseFloat(newData.price) || 0, shares = parseFloat(newData.shares) || 0;
        const fee = parseFloat(newData.fee) || 0, tax = parseFloat(newData.tax) || 0;
        if (price > 0 && shares > 0) {
          newData.netAmount = newData.type === 'buy' ? (price * shares + fee + tax).toFixed(2) : (price * shares - fee - tax).toFixed(2);
        } else { newData.netAmount = ''; }
        setTradeForm(newData);
      };

      const handleTradeSubmit = async (e) => {
        e.preventDefault();
        const payload = { ...tradeForm, symbol: tradeForm.symbol.toUpperCase(), price: parseFloat(tradeForm.price)||0, shares: parseFloat(tradeForm.shares)||0, fee: parseFloat(tradeForm.fee)||0, tax: parseFloat(tradeForm.tax)||0, netAmount: parseFloat(tradeForm.netAmount)||0, updatedAt: new Date().toISOString() };
        if (editingTradeId) await db.collection('users').doc(user.uid).collection('transactions').doc(editingTradeId).update(payload);
        else { payload.createdAt = new Date().toISOString(); await db.collection('users').doc(user.uid).collection('transactions').add(payload); }
        setIsTradeModalOpen(false);
      };

      const handleCashSubmit = async (e) => {
        e.preventDefault();
        const payload = { ...cashForm, amount: parseFloat(cashForm.amount)||0, createdAt: new Date().toISOString() };
        await db.collection('users').doc(user.uid).collection('cashFlows').add(payload);
        setIsCashModalOpen(false); setCashForm(initialCashForm);
      };

      const openTradeModal = (tx = null) => {
        if (tx) { setEditingTradeId(tx.id); setTradeForm({...tx, netAmount: tx.netAmount?.toString()||''}); }
        else { setEditingTradeId(null); setTradeForm(initialTradeForm); }
        setIsTradeModalOpen(true);
      };

      // 格式化工具
      const fmtM = (num) => Number(num).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
      const fmtColor = (num) => num > 0 ? 'text-rose-500' : num < 0 ? 'text-emerald-500' : 'text-slate-500';

      // --- AI 教練建議產生器 ---
      const generateAITips = () => {
        if (portfolio.sys.winTrades + portfolio.sys.loseTrades < 3) return "累積更多交易紀錄後，我能為您提供更精準的數據分析！目前請專注於紀律執行。";
        if (portfolio.sys.profitLossRatio > 2 && portfolio.sys.winRate > 40) return "🔥 優秀！您的賺賠比極佳，大賺小賠的策略執行得很完美，請繼續保持目前的交易節奏！";
        if (portfolio.sys.winRate < 40 && portfolio.sys.profitLossRatio < 1) return "⚠️ 警訊：勝率偏低且虧損金額大於獲利。建議暫停交易，回顧近期虧損單是否忘記執行「停損紀律」，或受 FOMO 情緒影響。";
        if (portfolio.sys.winRate > 70 && portfolio.sys.profitLossRatio < 0.8) return "💡 您的勝率很高，但賺賠比小於 1。代表您常常「小賺就跑，虧損卻死抱」。試著在有獲利時，將停利點拉大，讓利潤奔跑！";
        return "📊 目前資產穩定發展中。記得定期利用「交易明細」覆盤，看看賠錢的單子是否都貼著「情緒衝動」的標籤。";
      };

      // --- UI 渲染 ---
      if (loading) return <div className="flex h-screen items-center justify-center bg-slate-50 text-slate-400 font-bold">載入核心引擎中...</div>;
      if (!user) {
        return (
          <div className="flex h-screen items-center justify-center p-4 relative overflow-hidden">
            <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-rose-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            <div className="bento-card p-10 text-center max-w-md w-full relative z-10">
              <div className="text-6xl mb-6 drop-shadow-sm">📈</div>
              <h1 className="text-3xl font-extrabold mb-3 text-slate-800 tracking-tight">資產回測系統</h1>
              <p className="text-slate-500 text-sm mb-8 font-medium">Bento Grid 架構 • 雙軌損益 • 策略覆盤</p>
              <button onClick={handleLogin} className="w-full bg-slate-900 hover:bg-slate-800 text-white px-6 py-4 rounded-2xl font-bold transition-all shadow-lg flex items-center justify-center gap-3">
                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google 安全登入
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header (Glassmorphism) */}
          <header className="glass-effect sticky top-0 z-20 border-b border-slate-200/60">
            <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="bg-slate-900 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-md">📈</div>
                <h1 className="text-xl font-extrabold text-slate-800 tracking-tight hidden sm:block">Asset<span className="text-blue-600">Dash</span></h1>
              </div>
              <div className="flex gap-2">
                <button onClick={() => setIsCashModalOpen(true)} className="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition-all">💰 出入金</button>
                <button onClick={()=>openTradeModal()} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md shadow-slate-900/20 transition-all">➕ 記一筆</button>
                <button onClick={() => auth.signOut()} className="bg-slate-100 hover:bg-slate-200 text-slate-600 w-10 h-10 flex items-center justify-center rounded-xl transition-colors">🚪</button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-6xl mx-auto w-full p-4 md:p-6 space-y-6">
            
            {/* 分頁器 */}
            <div className="flex p-1 bg-slate-200/60 rounded-2xl w-full sm:w-fit backdrop-blur-sm">
              {['dashboard', 'history'].map(tab => (
                <button key={tab} onClick={() => setActiveTab(tab)} 
                  className={`flex-1 sm:px-6 py-2 rounded-xl text-sm font-bold transition-all ${activeTab === tab ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                  {tab === 'dashboard' ? '📊 總覽儀表板' : '📝 交易與日誌'}
                </button>
              ))}
            </div>

            {/* --- 總覽儀表板 (Bento Grid) --- */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                
                {/* 頂部 Bento 區塊 */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* 主卡片：淨資產 */}
                  <div className="bento-card p-6 md:col-span-2 relative overflow-hidden bg-gradient-to-br from-slate-900 to-slate-800 text-white">
                    <div className="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full filter blur-2xl transform translate-x-1/3 -translate-y-1/3"></div>
                    <p className="text-slate-400 text-sm font-bold tracking-wider mb-2 uppercase">Net Asset Value (淨資產水位)</p>
                    <div className="flex items-end gap-4 mb-6">
                      <h2 className="text-5xl font-extrabold tracking-tight">${fmtM(portfolio.sys.netWorth)}</h2>
                      <span className={`mb-1.5 font-bold px-2.5 py-1 rounded-lg text-sm ${portfolio.sys.totalROI >= 0 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                        {portfolio.sys.totalROI >= 0 ? '▲' : '▼'} {Math.abs(portfolio.sys.totalROI).toFixed(2)}%
                      </span>
                    </div>
                    <div className="grid grid-cols-2 gap-4 border-t border-slate-700/50 pt-5 mt-auto">
                      <div>
                        <p className="text-slate-400 text-xs mb-1">庫存總市值 (浮動)</p>
                        <p className="text-xl font-bold">${fmtM(portfolio.sys.totalMarketValue)}</p>
                      </div>
                      <div>
                        <p className="text-slate-400 text-xs mb-1">可用購買力 (現金)</p>
                        <p className="text-xl font-bold text-blue-300">${fmtM(portfolio.sys.availableCash)}</p>
                      </div>
                    </div>
                  </div>

                  {/* 損益雙軌制 */}
                  <div className="bento-card p-6 flex flex-col justify-between">
                    <div>
                      <p className="text-slate-400 text-xs font-bold tracking-wider mb-4 uppercase">Profit & Loss (損益雙軌)</p>
                      <div className="mb-5">
                        <p className="text-slate-500 text-sm mb-1 font-medium">已實現損益 (入袋)</p>
                        <h3 className={`text-3xl font-extrabold ${fmtColor(portfolio.sys.totalRealized)}`}>
                          {portfolio.sys.totalRealized > 0 ? '+' : ''}{fmtM(portfolio.sys.totalRealized)}
                        </h3>
                      </div>
                      <div>
                        <p className="text-slate-500 text-sm mb-1 font-medium">未實現損益 (帳面)</p>
                        <h3 className={`text-3xl font-extrabold ${fmtColor(portfolio.sys.totalUnrealized)}`}>
                          {portfolio.sys.totalUnrealized > 0 ? '+' : ''}{fmtM(portfolio.sys.totalUnrealized)}
                        </h3>
                      </div>
                    </div>
                    <div className="mt-4 pt-4 border-t border-slate-100 flex justify-between text-xs text-slate-400 font-medium">
                      <span>累計投入本金:</span>
                      <span className="text-slate-700">${fmtM(portfolio.sys.totalDeposits - portfolio.sys.totalWithdrawals)}</span>
                    </div>
                  </div>
                </div>

                {/* 數據與 AI 分析列 */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* KPI 指標 */}
                  <div className="bento-card p-6 flex flex-col justify-center">
                    <p className="text-slate-400 text-xs font-bold tracking-wider mb-5 uppercase flex items-center gap-2">🎯 核心 KPI 指標</p>
                    <div className="flex justify-between items-end mb-4 pb-4 border-b border-slate-100">
                      <div><p className="text-slate-500 text-sm mb-1">勝率 (Win Rate)</p><p className="text-2xl font-bold text-slate-800">{portfolio.sys.winRate.toFixed(1)}<span className="text-lg text-slate-400">%</span></p></div>
                      <div className="text-right"><p className="text-slate-500 text-sm mb-1">獲利單數</p><p className="font-bold text-emerald-500">{portfolio.sys.winTrades} 筆</p></div>
                    </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 mb-1.5 uppercase">金額</label>
                    <input type="number" step="1" required placeholder="輸入金額..." value={cashForm.amount} onChange={(e)=>setCashForm({...cashForm, amount: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800 font-mono shadow-sm text-xl" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 mb-1.5 uppercase">備註 (選填)</label>
                    <input type="text" placeholder="如: 薪水轉入、0050配息..." value={cashForm.notes} onChange={(e)=>setCashForm({...cashForm, notes: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800 shadow-sm text-sm" />
                  </div>
                  <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 transition-all mt-2">
                    新增資金紀錄
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
