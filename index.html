<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>專業資產管理系統</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 核心 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      /* 冷色系/文青風色板 (參考國泰/質感金融App) */
      --bg-color: #F4F7F9;
      --card-bg: #FFFFFF;
      --text-main: #2C3E50;
      --text-muted: #7F8C8D;
      --up-color: #E53935; /* 台股紅漲 */
      --down-color: #059669; /* 台股綠跌 */
      
      /* 資產類別顏色 */
      --color-tw-stock: #1E3A8A; /* 深藍 */
      --color-us-stock: #3B82F6; /* 亮藍 */
      --color-tw-etf:   #0D9488; /* 深海綠 */
      --color-fund:     #6366F1; /* 莫蘭迪紫 */
      --color-cash:     #94A3B8; /* 質感灰 */
    }
    body { font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); color: var(--text-main); -webkit-font-smoothing: antialiased; }
    
    /* 隱藏捲軸但保持可滑動 */
    ::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 圓角柔和卡片 */
    .bento-card { background: var(--card-bg); border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03); border: 1px solid rgba(0,0,0,0.02); transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .bento-card:hover { box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.05); }

    .nav-btn { transition: all 0.2s; border-radius: 12px; }
    .nav-btn.active { background-color: var(--text-main); color: white; box-shadow: 0 4px 12px rgba(44, 62, 80, 0.15); }
  </style>
</head>
<body class="pb-24 md:pb-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Firebase 初始化 ---
    const firebaseConfig = {
      apiKey: "AIzaSyBrLbe2Qx_k-icTv61SQNBw7n4hIcYBCiE",
      authDomain: "my-stock-tracker-f3065.firebaseapp.com",
      projectId: "my-stock-tracker-f3065",
      storageBucket: "my-stock-tracker-f3065.firebasestorage.app",
      messagingSenderId: "802802972309",
      appId: "1:802802972309:web:70c2eadc6b040689834d9c"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // --- 輔助資料 ---
    const STOCK_DICTIONARY = {
      '2330': { name: '台積電', category: 'TW_STOCK' }, '2317': { name: '鴻海', category: 'TW_STOCK' },
      '2454': { name: '聯發科', category: 'TW_STOCK' }, '2308': { name: '台達電', category: 'TW_STOCK' },
      '0050': { name: '元大台灣50', category: 'TW_ETF' }, '00878': { name: '國泰永續高股息', category: 'TW_ETF' },
      '006208': { name: '富邦台50', category: 'TW_ETF' }, 'AAPL': { name: 'Apple', category: 'US_STOCK' }, 
      'NVDA': { name: 'NVIDIA', category: 'US_STOCK' }, 'QQQ': { name: 'Invesco QQQ', category: 'US_STOCK' },
      'VOO': { name: 'Vanguard S&P 500', category: 'US_STOCK' }
    };
    const BUY_REASONS = ['技術面突破', '基本面財報', '籌碼面優勢', '攤平/向下建倉', '定期定額', '情緒衝動/FOMO'];
    const STRATEGY_TAGS = ['長線存股', '波段操作', '短線當沖', '實驗策略'];
    
    // 冷色系資產顏色配置
    const ASSET_COLORS = {
      TW_STOCK: '#1E3A8A', // 深藍
      US_STOCK: '#3B82F6', // 亮藍
      TW_ETF:   '#0D9488', // 深海綠
      FUND:     '#6366F1', // 莫蘭迪紫
      CASH:     '#94A3B8'  // 質感灰
    };
    const ASSET_LABELS = { TW_STOCK: '台股', US_STOCK: '海外股', TW_ETF: 'ETF', FUND: '基金', CASH: '現金' };

    // 格式化工具 (台灣標準：紅漲綠跌)
    const fmtM = (num) => Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    const fmtDec = (num) => Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const getColorClass = (num) => num > 0 ? 'text-[#E53935]' : num < 0 ? 'text-[#059669]' : 'text-slate-500';

    // --- 主元件 ---
    function App() {
      const [user, setUser] = useState(null);
      const [transactions, setTransactions] = useState([]);
      const [cashFlows, setCashFlows] = useState([]);
      const [marketPrices, setMarketPrices] = useState({});
      const [loading, setLoading] = useState(true);
      
      const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, history
      
      // 表單與 Modal 狀態
      const [isTradeModalOpen, setIsTradeModalOpen] = useState(false);
      const [editingTradeId, setEditingTradeId] = useState(null);
      const [tradeForm, setTradeForm] = useState({});
      
      const [isCashModalOpen, setIsCashModalOpen] = useState(false);
      const [cashForm, setCashForm] = useState({});

      // 個股詳細分析 Modal
      const [selectedAsset, setSelectedAsset] = useState(null);

      // --- 資料抓取 ---
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        setLoading(true);
        const unsubTx = db.collection('users').doc(user.uid).collection('transactions').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a, b) => new Date(a.date) - new Date(b.date)); // 必須舊到新算成本
          setTransactions(data);
        });
        const unsubCash = db.collection('users').doc(user.uid).collection('cashFlows').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setCashFlows(data);
          setLoading(false);
        });
        const unsubPrice = db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').onSnapshot((doc) => {
          if (doc.exists) setMarketPrices(doc.data());
        });
        return () => { unsubTx(); unsubCash(); unsubPrice(); };
      }, [user]);

      // --- 核心財務引擎 (三水桶 + 分類統計) ---
      const portfolio = useMemo(() => {
        let holdings = {};
        let sys = { totalDeposits: 0, totalWithdrawals: 0, availableCash: 0, totalRealized: 0, totalUnrealized: 0, totalMarketValue: 0 };
        
        // 分類統計初始化
        let categoryStats = {
          TW_STOCK: { value: 0, color: ASSET_COLORS.TW_STOCK, label: ASSET_LABELS.TW_STOCK },
          US_STOCK: { value: 0, color: ASSET_COLORS.US_STOCK, label: ASSET_LABELS.US_STOCK },
          TW_ETF: { value: 0, color: ASSET_COLORS.TW_ETF, label: ASSET_LABELS.TW_ETF },
          FUND: { value: 0, color: ASSET_COLORS.FUND, label: ASSET_LABELS.FUND },
          CASH: { value: 0, color: ASSET_COLORS.CASH, label: ASSET_LABELS.CASH }
        };

        // 現金流水
        cashFlows.forEach(cf => {
          const amt = parseFloat(cf.amount) || 0;
          if (cf.type === 'deposit') { sys.totalDeposits += amt; sys.availableCash += amt; }
          else if (cf.type === 'withdraw') { sys.totalWithdrawals += amt; sys.availableCash -= amt; }
          else if (cf.type === 'dividend') { sys.availableCash += amt; sys.totalRealized += amt; }
        });
        sys.netPrincipal = sys.totalDeposits - sys.totalWithdrawals;
        categoryStats.CASH.value = sys.availableCash;

        // 交易明細
        transactions.forEach(tx => {
          let sym = tx.symbol || tx.name;
          if (!holdings[sym]) { holdings[sym] = { symbol: sym, name: tx.name, assetType: tx.assetType || 'TW_STOCK', qty: 0, totalCost: 0, avgCost: 0, realizedProfit: 0, buyQueue: [] }; }
          let h = holdings[sym];
          let qty = parseFloat(tx.shares) || 0;
          let netAmount = parseFloat(tx.netAmount) || 0;

          if (tx.type === 'buy') {
            h.qty += qty; h.totalCost += netAmount; h.avgCost = h.totalCost / h.qty;
            sys.availableCash -= netAmount;
            categoryStats.CASH.value = sys.availableCash; // 同步更新現金分類
            h.buyQueue.push({ qty, netAmount });
          } else if (tx.type === 'dividend_reinvest') {
            h.qty += qty; h.avgCost = h.totalCost / h.qty;
            h.buyQueue.push({ qty, netAmount: 0 }); 
          } else if (tx.type === 'sell') {
            let remainingToSell = qty; let realizedCost = 0;
            while (remainingToSell > 0 && h.buyQueue.length > 0) {
              let b = h.buyQueue[0];
              if (b.qty <= remainingToSell) { realizedCost += b.netAmount; remainingToSell -= b.qty; h.buyQueue.shift(); } 
              else { realizedCost += (b.netAmount / b.qty) * remainingToSell; b.qty -= remainingToSell; b.netAmount -= (b.netAmount / (b.qty + remainingToSell)) * remainingToSell; remainingToSell = 0; }
            }
            let profit = netAmount - realizedCost;
            h.realizedProfit += profit; sys.totalRealized += profit; sys.availableCash += netAmount;
            categoryStats.CASH.value = sys.availableCash;
            h.qty -= qty; h.totalCost -= realizedCost;
            if (h.qty <= 0.0001) { h.qty = 0; h.totalCost = 0; h.avgCost = 0; h.buyQueue = []; }
          }
        });

        // 包含所有曾經持有過 (有戰績) 的標的，用以顯示歷史戰績
        const allAssets = Object.values(holdings).filter(h => h.qty > 0 || h.realizedProfit !== 0); 
        
        // 結算未實現與各類別佔比
        allAssets.forEach(h => {
          if (h.qty > 0) {
            let currentPrice = marketPrices[h.symbol] || h.avgCost;
            let marketValue = h.qty * currentPrice;
            let unrealized = marketValue - h.totalCost;
            
            h.currentPrice = currentPrice; h.marketValue = marketValue; h.unrealized = unrealized;
            h.roi = h.totalCost > 0 ? (unrealized / h.totalCost) * 100 : 0;
            
            sys.totalMarketValue += marketValue; 
            sys.totalUnrealized += unrealized;

            if(categoryStats[h.assetType]) {
              categoryStats[h.assetType].value += marketValue;
            }
          } else {
            h.currentPrice = 0; h.marketValue = 0; h.unrealized = 0; h.roi = 0;
          }
        });

        sys.totalAssets = sys.availableCash + sys.totalMarketValue;
        sys.totalPnl = sys.totalRealized + sys.totalUnrealized;
        
        // 過濾出目前真的有庫存的項目，並按市值排序
        const currentHoldings = allAssets.filter(h => h.qty > 0).sort((a,b)=>b.marketValue - a.marketValue);

        return { holdings: currentHoldings, allAssets: allAssets, sys, categoryStats };
      }, [transactions, cashFlows, marketPrices]);

      // --- 圖表元件：Doughnut (圓餅圖) ---
      const DonutChart = ({ categoryStats, totalAssets }) => {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);
        useEffect(() => {
          if (!canvasRef.current || totalAssets === 0) return;
          if (chartInstance.current) chartInstance.current.destroy();
          
          const validCats = Object.values(categoryStats).filter(c => c.value > 0);
          
          const ctx = canvasRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: { 
              labels: validCats.map(c => c.label), 
              datasets: [{ data: validCats.map(c => c.value), backgroundColor: validCats.map(c => c.color), borderWidth: 0 }] 
            },
            options: { cutout: '75%', plugins: { legend: { display: false }, tooltip: { enabled: true } }, animation: { duration: 500 } }
          });
          return () => chartInstance.current?.destroy();
        }, [categoryStats, totalAssets]);
        
        if(totalAssets === 0) return <div className="w-32 h-32 rounded-full border-[10px] border-slate-100 mx-auto"></div>;

        return (
          <div className="relative w-40 h-40 mx-auto flex-shrink-0">
            <canvas ref={canvasRef}></canvas>
            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
              <span className="text-[10px] text-slate-400 font-bold mb-0.5 tracking-widest">總資產</span>
              <span className="text-lg font-bold text-slate-800 leading-none">{fmtM(totalAssets)}</span>
            </div>
          </div>
        );
      };

      // --- 圖表元件：近30日走勢圖 (修復版 API) ---
      const StockTrendChart = ({ asset }) => {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);
        const [chartData, setChartData] = useState(null);
        const [loadingChart, setLoadingChart] = useState(true);

        useEffect(() => {
          const fetchHistory = async () => {
            if (asset.assetType === 'FUND' || asset.assetType === 'CASH') { setLoadingChart(false); return; }
            try {
              let yfSymbol = asset.symbol;
              if (['TW_STOCK', 'TW_ETF'].includes(asset.assetType) && /^\d+$/.test(yfSymbol)) yfSymbol += '.TW';
              // 修復：使用 /raw 取得原始 JSON 避免外層包裝造成的解析錯誤
              const url = `https://query2.finance.yahoo.com/v8/finance/chart/${yfSymbol}?interval=1d&range=1mo`;
              const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
              
              const res = await fetch(proxy);
              if (!res.ok) throw new Error('API failed');
              const data = await res.json();
              
              const timestamps = data.chart?.result?.[0]?.timestamp;
              const closes = data.chart?.result?.[0]?.indicators?.quote?.[0]?.close;
              
              if (timestamps && closes) {
                // 過濾掉 null 的交易日
                let validData = [];
                for(let i=0; i<timestamps.length; i++) {
                  if(closes[i] !== null) validData.push({ t: timestamps[i], p: closes[i] });
                }
                const dates = validData.map(d => { const dt = new Date(d.t * 1000); return `${dt.getMonth()+1}/${dt.getDate()}`; });
                const prices = validData.map(d => d.p);
                setChartData({ labels: dates, prices: prices });
              }
            } catch (e) { console.log('Chart API Error', e); }
            setLoadingChart(false);
          };
          fetchHistory();
        }, [asset.symbol]);

        useEffect(() => {
          if (!canvasRef.current || !chartData) return;
          if (chartInstance.current) chartInstance.current.destroy();
          const ctx = canvasRef.current.getContext('2d');
          
          const isUp = chartData.prices[chartData.prices.length-1] >= chartData.prices[0];
          const color = isUp ? '#E53935' : '#059669'; // 台股紅漲綠跌

          chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: { labels: chartData.labels, datasets: [{ data: chartData.prices, borderColor: color, borderWidth: 2.5, pointRadius: 0, tension: 0.2 }] },
            options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } }, responsive: true, maintainAspectRatio: false }
          });
          return () => chartInstance.current?.destroy();
        }, [chartData]);

        if (loadingChart) return <div className="h-32 flex items-center justify-center text-sm text-slate-400">正在抓取近30日走勢...</div>;
        if (!chartData) return <div className="h-32 flex items-center justify-center text-sm text-slate-400 bg-slate-50/50 rounded-xl border border-slate-100">API 限制或不支援此標的線圖</div>;
        return <div className="h-32 w-full"><canvas ref={canvasRef}></canvas></div>;
      };


      // --- 表單與操作 ---
      const handleLogin = async () => { try { await auth.signInWithPopup(googleProvider); } catch (e) { alert("登入失敗"); } };
      
      const openTradeModal = (tx = null) => {
        if (tx) {
          setEditingTradeId(tx.id);
          setTradeForm({...tx, isFundMode: tx.assetType === 'FUND'});
        } else {
          setEditingTradeId(null);
          setTradeForm({ date: new Date().toISOString().split('T')[0], isFundMode: false, assetType: 'TW_STOCK', type: 'buy', symbol: '', name: '', price: '', shares: '', amount: '', fee: '0', tax: '0', strategy: '波段操作', confidence: '3', reason: '' });
        }
        setIsTradeModalOpen(true);
      };

      const handleTradeChange = (e) => {
        const { name, value } = e.target;
        let newData = { ...tradeForm, [name]: value };
        
        if (name === 'symbol' && !newData.isFundMode && STOCK_DICTIONARY[value.toUpperCase()]) {
          newData.name = STOCK_DICTIONARY[value.toUpperCase()].name;
          newData.assetType = STOCK_DICTIONARY[value.toUpperCase()].category;
        }

        if (newData.isFundMode) {
          const amount = parseFloat(newData.amount) || 0; const price = parseFloat(newData.price) || 0;
          if (amount > 0 && price > 0) { newData.shares = (amount / price).toFixed(5); newData.netAmount = amount.toFixed(2); } 
          else { newData.shares = ''; newData.netAmount = ''; }
        } else {
          const price = parseFloat(newData.price) || 0; const shares = parseFloat(newData.shares) || 0;
          const fee = parseFloat(newData.fee) || 0; const tax = parseFloat(newData.tax) || 0;
          if (price > 0 && shares > 0) { newData.netAmount = newData.type === 'buy' ? (price * shares + fee + tax).toFixed(2) : (price * shares - fee - tax).toFixed(2); } 
          else { newData.netAmount = ''; }
        }
        setTradeForm(newData);
      };

      const handleTradeSubmit = async (e) => {
        e.preventDefault();
        let payload = { 
          ...tradeForm, symbol: tradeForm.symbol?.toUpperCase() || tradeForm.name, 
          price: parseFloat(tradeForm.price)||0, shares: parseFloat(tradeForm.shares)||0, 
          fee: parseFloat(tradeForm.fee)||0, tax: parseFloat(tradeForm.tax)||0, netAmount: parseFloat(tradeForm.netAmount)||0 
        };
        if (payload.isFundMode) payload.assetType = 'FUND';

        if (editingTradeId) await db.collection('users').doc(user.uid).collection('transactions').doc(editingTradeId).update(payload);
        else { payload.createdAt = new Date().toISOString(); await db.collection('users').doc(user.uid).collection('transactions').add(payload); }
        setIsTradeModalOpen(false);
      };

      // --- 渲染畫面 ---
      if (loading) return <div className="flex h-screen items-center justify-center bg-[#F4F7F9] text-slate-400 font-bold">載入中...</div>;
      if (!user) {
        return (
          <div className="flex h-screen items-center justify-center bg-[#F4F7F9] p-6">
            <div className="w-full max-w-sm text-center bento-card p-10 shadow-xl">
              <div className="w-20 h-20 bg-[#2C3E50] text-white rounded-[1.5rem] mx-auto flex items-center justify-center mb-6 shadow-lg text-4xl">🏦</div>
              <h1 className="text-3xl font-extrabold mb-2 text-[#2C3E50] tracking-tight">個人資產大台</h1>
              <p className="text-[#7F8C8D] mb-8 font-medium">冷色系文青風，結構化資金流</p>
              <button onClick={handleLogin} className="w-full bg-[#2C3E50] text-white px-6 py-4 rounded-xl font-bold shadow-md hover:bg-[#1a252f] transition-all">安全登入系統</button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen max-w-5xl mx-auto md:pt-6">
          
          {/* 頂部導航列 */}
          <nav className="bg-white/90 backdrop-blur-md sticky top-0 z-20 md:rounded-2xl md:mb-6 border-b md:border border-slate-100 shadow-sm px-5 py-3 flex justify-between items-center">
            <div className="flex items-center gap-2">
              <span className="text-2xl drop-shadow-sm">🏦</span>
              <h1 className="font-extrabold text-xl text-[#2C3E50] tracking-tight hidden sm:block">Asset<span className="text-[#0D9488]">Track</span></h1>
            </div>
            <div className="flex bg-slate-100/80 p-1 rounded-xl">
              <button onClick={()=>setActiveTab('dashboard')} className={`nav-btn px-4 py-2 text-sm font-bold ${activeTab==='dashboard'?'active':'text-[#7F8C8D]'}`}>📊 總覽</button>
              <button onClick={()=>setActiveTab('history')} className={`nav-btn px-4 py-2 text-sm font-bold ${activeTab==='history'?'active':'text-[#7F8C8D]'}`}>📝 交易明細</button>
            </div>
            <div className="flex gap-2">
              <button onClick={()=>{setCashForm({type:'deposit', date:new Date().toISOString().split('T')[0], amount:''}); setIsCashModalOpen(true);}} className="hidden md:block bg-white border border-slate-200 text-[#2C3E50] px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-slate-50 transition-colors">💰 資金池</button>
              <button onClick={()=>auth.signOut()} className="bg-slate-100 text-[#7F8C8D] w-10 h-10 rounded-xl flex items-center justify-center font-bold hover:bg-slate-200 transition-colors">登出</button>
            </div>
          </nav>

          <main className="p-4 space-y-6">
            
            {/* 視圖：帳務總覽 */}
            {activeTab === 'dashboard' && (
              <>
                {/* 頂部：資產分配條狀圖 (Progress Bar) */}
                <div className="bento-card p-6">
                  <div className="flex justify-between items-end mb-4">
                    <div>
                      <p className="text-xs font-bold text-[#7F8C8D] uppercase tracking-wider mb-1">Total Assets</p>

                      ) : (
                        <>
                          <div><label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">成交單價</label><input required type="number" step="0.0001" name="price" placeholder="0.00" value={tradeForm.price||''} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-mono text-[#2C3E50]"/></div>
                          <div><label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">成交股數</label><input required type="number" step="0.0001" name="shares" placeholder="0" value={tradeForm.shares||''} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-mono text-[#2C3E50]"/></div>
                          {tradeForm.type !== 'dividend_reinvest' && (
                            <>
                              <div><label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">手續費</label><input type="number" step="1" name="fee" value={tradeForm.fee||'0'} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-[#2C3E50]"/></div>
                              <div><label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">交易稅</label><input type="number" step="1" name="tax" value={tradeForm.tax||'0'} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-[#2C3E50]"/></div>
                            </>
                          )}
                          <div className="col-span-2 bg-blue-50/50 border border-blue-100 p-3 rounded-xl flex justify-between items-center mt-2">
                            <span className="text-sm font-bold text-blue-700">帳戶淨收付金額 (試算)</span>
                            <span className="font-extrabold text-lg text-blue-800">${fmtM(tradeForm.netAmount)}</span>
                          </div>
                        </>
                      )}
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                    <h4 className="font-bold text-[#2C3E50] text-sm">🧠 交易覆盤筆記</h4>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">策略歸屬</label>
                        <select name="strategy" value={tradeForm.strategy||''} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-bold text-[#2C3E50]">
                          {STRATEGY_TAGS.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                      </div>
                      {tradeForm.type === 'buy' && (
                        <div>
                          <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">進場理由</label>
                          <select name="reason" value={tradeForm.reason||''} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm text-[#2C3E50]">
                            <option value="">選擇主要理由...</option>{BUY_REASONS.map(r => <option key={r} value={r}>{r}</option>)}
                          </select>
                        </div>
                      )}
                      {tradeForm.type === 'buy' && (
                         <div className="col-span-2">
                           <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">交易信心度: {tradeForm.confidence||3} 星</label>
                           <input type="range" name="confidence" min="1" max="5" value={tradeForm.confidence||3} onChange={handleTradeChange} className="w-full accent-[#3B82F6]" />
                         </div>
                      )}
                      <div className="col-span-2">
                        <textarea name="notes" placeholder="寫下當時的情緒或備註..." value={tradeForm.notes||''} onChange={handleTradeChange} rows="2" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none resize-none text-sm text-[#2C3E50]"></textarea>
                      </div>
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-[#2C3E50] hover:bg-black text-white font-bold py-4 rounded-xl shadow-lg transition-all text-lg mt-2">
                    💾 儲存紀錄
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* --- Modal：資金出入金 --- */}
          {isCashModalOpen && (
            <div className="fixed inset-0 bg-[#2C3E50]/60 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-4">
              <div className="bg-white w-full max-w-sm rounded-[2rem] overflow-hidden flex flex-col shadow-2xl">
                <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center">
                  <h3 className="font-extrabold text-lg text-[#2C3E50]">💰 資金流水帳</h3>
                  <button onClick={() => setIsCashModalOpen(false)} className="bg-slate-100 text-[#7F8C8D] hover:bg-slate-200 w-8 h-8 rounded-full font-bold flex items-center justify-center transition-colors">✕</button>
                </div>
                <form onSubmit={async(e)=>{
                  e.preventDefault();
                  await db.collection('users').doc(user.uid).collection('cashFlows').add({...cashForm, amount: parseFloat(cashForm.amount)||0});
                  setIsCashModalOpen(false);
                }} className="p-6 space-y-5 bg-slate-50/50">
                  <div className="flex bg-slate-200/60 p-1.5 rounded-xl">
                    <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer ${cashForm.type==='deposit'?'bg-white shadow-sm text-blue-600':'text-[#7F8C8D]'}`}><input type="radio" checked={cashForm.type==='deposit'} onChange={()=>setCashForm({...cashForm, type:'deposit'})} className="hidden"/>入金</label>
                    <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer ${cashForm.type==='withdraw'?'bg-white shadow-sm text-[#2C3E50]':'text-[#7F8C8D]'}`}><input type="radio" checked={cashForm.type==='withdraw'} onChange={()=>setCashForm({...cashForm, type:'withdraw'})} className="hidden"/>出金</label>
                    <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer ${cashForm.type==='dividend'?'bg-white shadow-sm text-emerald-600':'text-[#7F8C8D]'}`}><input type="radio" checked={cashForm.type==='dividend'} onChange={()=>setCashForm({...cashForm, type:'dividend'})} className="hidden"/>領股息</label>
                  </div>
                  <input required type="date" value={cashForm.date||''} onChange={e=>setCashForm({...cashForm, date: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl outline-none font-mono text-[#2C3E50]"/>
                  <input required type="number" step="1" placeholder="金額 (TWD)" value={cashForm.amount||''} onChange={e=>setCashForm({...cashForm, amount: e.target.value})} className="w-full p-3 bg-white border border-blue-300 rounded-xl outline-none font-mono text-2xl font-bold text-blue-600 focus:ring-1 focus:ring-blue-500 shadow-inner"/>
                  <input type="text" placeholder="備註 (如: 0050配息)" value={cashForm.notes||''} onChange={e=>setCashForm({...cashForm, notes: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl outline-none text-sm text-[#2C3E50]"/>
                  <button type="submit" className="w-full bg-[#2C3E50] text-white font-bold py-4 rounded-xl shadow-lg mt-2 text-lg hover:bg-black transition-colors">新增資金紀錄</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
