<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專業投資回測與資產管理系統</title>
  
  <!-- Tailwind CSS 美化套件 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 核心套件 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel 翻譯機 -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase 雲端資料庫套件 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* 自訂捲軸樣式 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 1. Firebase 初始化 ---
    const firebaseConfig = {
      apiKey: "AIzaSyBrLbe2Qx_k-icTv61SQNBw7n4hIcYBCiE",
      authDomain: "my-stock-tracker-f3065.firebaseapp.com",
      projectId: "my-stock-tracker-f3065",
      storageBucket: "my-stock-tracker-f3065.firebasestorage.app",
      messagingSenderId: "802802972309",
      appId: "1:802802972309:web:70c2eadc6b040689834d9c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // --- 2. 輔助資料 (股票字典與分類) ---
    const CATEGORIES = [
      { id: 'TW_STOCK', label: '台股' },
      { id: 'TW_ETF', label: '台股ETF' },
      { id: 'US_STOCK', label: '美股' },
      { id: 'FUND', label: '基金' },
    ];

    const STOCK_DICTIONARY = {
      '2330': { name: '台積電', category: 'TW_STOCK' },
      '2317': { name: '鴻海', category: 'TW_STOCK' },
      '2454': { name: '聯發科', category: 'TW_STOCK' },
      '0050': { name: '元大台灣50', category: 'TW_ETF' },
      '0056': { name: '元大高股息', category: 'TW_ETF' },
      '00878': { name: '國泰永續高股息', category: 'TW_ETF' },
      '006208': { name: '富邦台50', category: 'TW_ETF' },
      'AAPL': { name: 'Apple', category: 'US_STOCK' },
      'MSFT': { name: 'Microsoft', category: 'US_STOCK' },
      'TSLA': { name: 'Tesla', category: 'US_STOCK' },
      'NVDA': { name: 'NVIDIA', category: 'US_STOCK' },
      'VOO': { name: 'Vanguard S&P 500 ETF', category: 'US_STOCK' },
      'QQQ': { name: 'Invesco QQQ Trust', category: 'US_STOCK' },
    };

    // --- 3. 系統主元件 ---
    function App() {
      const [user, setUser] = useState(null);
      const [transactions, setTransactions] = useState([]);
      const [marketPrices, setMarketPrices] = useState({}); // 儲存使用者手動更新的現價
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      
      // 交易紀錄的篩選器
      const [historyFilter, setHistoryFilter] = useState('all'); // all, buy, sell

      // 表單狀態
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null); // 紀錄目前正在編輯哪一筆
      const initialForm = {
        date: new Date().toISOString().split('T')[0],
        symbol: '',
        name: '',
        category: 'TW_STOCK',
        type: 'buy', // buy | sell
        price: '',
        shares: '',
        fee: '',
        tax: '',
        netAmount: '',
        notes: ''
      };
      const [formData, setFormData] = useState(initialForm);

      // --- 認證與資料抓取 ---
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        setLoading(true);
        
        // 抓取交易紀錄
        const txRef = db.collection('users').doc(user.uid).collection('transactions');
        const unsubTx = txRef.onSnapshot((snapshot) => {
          const txData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          txData.sort((a, b) => new Date(b.date) - new Date(a.date));
          setTransactions(txData);
          setLoading(false);
        });

        // 抓取自訂現價紀錄
        const priceRef = db.collection('users').doc(user.uid).collection('settings').doc('marketPrices');
        const unsubPrice = priceRef.onSnapshot((doc) => {
          if (doc.exists) {
            setMarketPrices(doc.data());
          }
        });

        return () => { unsubTx(); unsubPrice(); };
      }, [user]);

      // --- 核心財務計算 (移動平均成本法) ---
      const portfolio = useMemo(() => {
        let holdings = {};
        let summary = {
          totalRealized: 0,   // 已實現損益
          totalInvested: 0,   // 持有總成本
          totalMarketValue: 0,// 持有總市值
          totalUnrealized: 0  // 未實現損益
        };

        // 按時間由舊到新計算
        const chronologicalTx = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));

        chronologicalTx.forEach(tx => {
          if (!holdings[tx.symbol]) {
            holdings[tx.symbol] = { 
              symbol: tx.symbol, name: tx.name, category: tx.category,
              shares: 0, totalCost: 0, avgCost: 0, realizedProfit: 0 
            };
          }
          let h = holdings[tx.symbol];
          let shares = parseFloat(tx.shares) || 0;
          let netAmount = parseFloat(tx.netAmount) || 0; // 淨收付金額

          if (tx.type === 'buy') {
            h.shares += shares;
            h.totalCost += netAmount; // 買進成本為淨付出總額
            h.avgCost = h.shares > 0 ? h.totalCost / h.shares : 0;
          } else if (tx.type === 'sell') {
            // 賣出利潤 = 淨收回金額 - (平均成本 * 賣出股數)
            let costOfSoldShares = h.avgCost * shares;
            let profit = netAmount - costOfSoldShares;
            
            h.realizedProfit += profit;
            summary.totalRealized += profit;
            
            h.shares -= shares;
            h.totalCost -= costOfSoldShares;
            
            if (h.shares <= 0.0001) { 
              h.shares = 0; 
              h.totalCost = 0;
              h.avgCost = 0; 
            }
          }
        });

        // 整理目前仍有庫存的標的
        const activeHoldings = Object.values(holdings).filter(h => h.shares > 0);
        
        activeHoldings.forEach(h => {
          let currentPrice = marketPrices[h.symbol] || h.avgCost; // 如果沒有輸入現價，預設用成本價算
          let marketValue = h.shares * currentPrice;
          let unrealized = marketValue - h.totalCost;
          
          h.currentPrice = currentPrice;
          h.marketValue = marketValue;
          h.unrealized = unrealized;
          h.roi = h.totalCost > 0 ? (unrealized / h.totalCost) * 100 : 0;

          summary.totalInvested += h.totalCost;
          summary.totalMarketValue += marketValue;
          summary.totalUnrealized += unrealized;
        });

        return { holdings: Object.values(holdings), activeHoldings, summary };
      }, [transactions, marketPrices]);


      // --- 事件處理 ---
      const handleLogin = async () => {
        try { await auth.signInWithPopup(googleProvider); } 
        catch (error) { alert("登入失敗，請重試"); }
      };

      // 更新現價
      const handleUpdatePrice = async (symbol, priceStr) => {
        if (!user) return;
        const newPrice = parseFloat(priceStr);
        if (isNaN(newPrice)) return;

        const priceRef = db.collection('users').doc(user.uid).collection('settings').doc('marketPrices');
        await priceRef.set({ [symbol]: newPrice }, { merge: true });
      };

      // 表單輸入處理 (包含自動帶入與試算)
      const handleFormChange = (e) => {
        const { name, value } = e.target;
        let newData = { ...formData, [name]: value };

        // 自動帶入標的名稱與類別
        if (name === 'symbol' && STOCK_DICTIONARY[value.toUpperCase()]) {
          newData.name = STOCK_DICTIONARY[value.toUpperCase()].name;
          newData.category = STOCK_DICTIONARY[value.toUpperCase()].category;
        }

        // 自動試算淨收付金額 (買入：價*量+費+稅。賣出：價*量-費-稅)
        const price = parseFloat(newData.price) || 0;
        const shares = parseFloat(newData.shares) || 0;
        const fee = parseFloat(newData.fee) || 0;
        const tax = parseFloat(newData.tax) || 0;
        
        if (price > 0 && shares > 0) {
          const baseAmount = price * shares;
          if (newData.type === 'buy') {
            newData.netAmount = (baseAmount + fee + tax).toFixed(2);
          } else {
            newData.netAmount = (baseAmount - fee - tax).toFixed(2);
          }
        } else {
          newData.netAmount = '';
        }

        setFormData(newData);
      };

      // 開啟新增表單
      const openAddModal = () => {
        setEditingId(null);
        setFormData(initialForm);
        setIsModalOpen(true);
      };

      // 開啟編輯表單
      const openEditModal = (tx) => {
        setEditingId(tx.id);
        setFormData({
          ...tx,
          netAmount: tx.netAmount ? tx.netAmount.toString() : ''
        });
        setIsModalOpen(true);
      };

      // 儲存表單 (新增/修改)
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!user) return;
        
        const payload = {
          ...formData,
          symbol: formData.symbol.toUpperCase(),
          price: parseFloat(formData.price) || 0,
          shares: parseFloat(formData.shares) || 0,
          fee: parseFloat(formData.fee) || 0,
          tax: parseFloat(formData.tax) || 0,
          netAmount: parseFloat(formData.netAmount) || 0,
          updatedAt: new Date().toISOString()
        };

        if (editingId) {
          // 修改模式
          await db.collection('users').doc(user.uid).collection('transactions').doc(editingId).update(payload);
        } else {
          // 新增模式
          payload.createdAt = new Date().toISOString();
          await db.collection('users').doc(user.uid).collection('transactions').add(payload);
        }
        
        setIsModalOpen(false);
      };

      const handleDelete = async (id) => {
        if (!user) return;
        if(window.confirm('確定要刪除這筆紀錄嗎？這會影響庫存與損益的計算喔。')) {
            await db.collection('users').doc(user.uid).collection('transactions').doc(id).delete();
        }
      };

      const formatMoney = (num) => {
        return Number(num).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
      };

      // --- UI 渲染 ---
      if (loading) return <div className="flex h-screen items-center justify-center bg-slate-50 text-slate-500 font-bold">載入資料中...</div>;

      if (!user) {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-100 p-4">
            <div className="bg-white p-8 rounded-3xl shadow-xl text-center max-w-sm w-full border border-slate-100">
              <div className="text-6xl mx-auto mb-6 drop-shadow-md">💼</div>
              <h1 className="text-2xl font-bold mb-2 text-slate-800">個人資產管理系統</h1>
              <p className="text-slate-500 text-sm mb-8">紀錄交易明細、自動試算庫存損益</p>
              <button onClick={handleLogin} className="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3.5 rounded-2xl font-medium transition-all shadow-md shadow-blue-200 flex items-center justify-center gap-2">
                <span>🔐</span> 使用 Google 帳號登入
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col font-sans pb-24">
          {/* Header */}
          <header className="bg-white shadow-sm sticky top-0 z-10 border-b border-slate-200">
            <div className="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="bg-slate-900 text-white p-2 rounded-xl text-lg">💼</div>
                <h1 className="text-xl font-bold text-slate-800 tracking-wide">資產回測紀錄</h1>
              </div>
              <div className="flex gap-2">
                <button onClick={openAddModal} className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-xl flex items-center gap-2 text-sm font-medium transition-all shadow-sm shadow-emerald-200">
                  <span>➕</span> <span className="hidden sm:inline">新增交易</span>
                </button>
                <button onClick={() => auth.signOut()} className="bg-slate-100 hover:bg-slate-200 text-slate-600 p-2 rounded-xl transition-colors">
                  🚪
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-5xl mx-auto w-full p-4 mt-4">
            {/* 分頁按鈕 */}
            <div className="flex space-x-2 mb-6 bg-slate-200/50 p-1.5 rounded-2xl overflow-x-auto border border-slate-200">
              <button onClick={() => setActiveTab('dashboard')} className={`flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl text-sm font-bold transition-all whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200'}`}>📊 總覽與庫存</button>
              <button onClick={() => setActiveTab('history')} className={`flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl text-sm font-bold transition-all whitespace-nowrap ${activeTab === 'history' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200'}`}>🧾 交易明細</button>
            </div>

            {/* --- 總覽與庫存 --- */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                {/* 數據儀表板 */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                    <p className="text-xs text-slate-500 font-medium mb-1">未實現損益 (帳面)</p>
                    <h2 className={`text-2xl font-bold ${portfolio.summary.totalUnrealized >= 0 ? 'text-rose-500' : 'text-emerald-500'}`}>
                      {portfolio.summary.totalUnrealized > 0 ? '+' : ''}{formatMoney(portfolio.summary.totalUnrealized)}
                    </h2>
                  </div>
                  <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                    <p className="text-xs text-slate-500 font-medium mb-1">已實現損益 (落袋)</p>
                    <h2 className={`text-2xl font-bold ${portfolio.summary.totalRealized >= 0 ? 'text-rose-500' : 'text-emerald-500'}`}>
                      {portfolio.summary.totalRealized > 0 ? '+' : ''}{formatMoney(portfolio.summary.totalRealized)}
                    </h2>
                  </div>
                  <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                    <p className="text-xs text-slate-500 font-medium mb-1">庫存總市值</p>
                    <h2 className="text-2xl font-bold text-slate-800">{formatMoney(portfolio.summary.totalMarketValue)}</h2>
                  </div>
                  <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                    <p className="text-xs text-slate-500 font-medium mb-1">總投入成本</p>
                    <h2 className="text-2xl font-bold text-slate-800">{formatMoney(portfolio.summary.totalInvested)}</h2>
                  </div>
                </div>

                {/* 庫存清單 */}
                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                  <div className="p-5 border-b border-slate-100 flex justify-between items-center">
                    <h3 className="font-bold text-slate-800 text-lg">📈 現有庫存</h3>
                    <span className="text-xs text-slate-400">系統自動計算均價</span>
                  </div>
                  <div className="divide-y divide-slate-50">
                    {portfolio.activeHoldings.length === 0 ? ( 
                      <div className="p-12 text-center text-slate-400 flex flex-col items-center">
                        <span className="text-4xl mb-3">👻</span>
                        目前沒有庫存，去「新增交易」建倉吧！
                      </div> 
                    ) : (
                      portfolio.activeHoldings.map((h, i) => (
                        <div key={i} className="p-5 hover:bg-slate-50 flex flex-col md:flex-row justify-between gap-4 transition-colors">
                          {/* 標的資訊 */}
                          <div className="flex-1">
                            <div className="flex items-center gap-2 mb-1">
                              <span className="text-xs font-bold px-2 py-0.5 rounded-md bg-blue-50 text-blue-600">{CATEGORIES.find(c=>c.id===h.category)?.label || '其他'}</span>
                              <span className="font-bold text-lg text-slate-900">{h.name || h.symbol}</span>
                              <span className="text-sm text-slate-500">({h.symbol})</span>
                            </div>
                            <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-sm text-slate-600 mt-2">
                              <div>均價: <span className="font-medium">{h.avgCost.toFixed(2)}</span></div>
                              <div>股數: <span className="font-medium">{h.shares.toFixed(2)}</span></div>
                              <div>成本: <span className="font-medium">{formatMoney(h.totalCost)}</span></div>
                              <div>市值: <span className="font-medium">{formatMoney(h.marketValue)}</span></div>
                            </div>
                          </div>
                          
                          {/* 損益與現價輸入 */}
                          <div className="flex flex-col items-end justify-center bg-slate-50 md:bg-transparent p-3 md:p-0 rounded-xl">
                            <div className="flex items-center gap-2 mb-2 w-full md:w-auto justify-between md:justify-end">
                              <label className="text-xs text-slate-500 font-medium">前日收盤現價:</label>
                              <input 
                                type="number" 
                                value={h.currentPrice || ''} 
                                onChange={(e) => handleUpdatePrice(h.symbol, e.target.value)}
                                className="w-24 px-2 py-1 text-right text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                placeholder="輸入現價"
                              />
                            </div>
                            <div className="text-right w-full">
                              <p className="text-xs text-slate-500 mb-0.5">未實現損益 (報酬率)</p>
                              <div className="flex items-center justify-end gap-2">
                                <span className={`text-lg font-bold ${h.unrealized >= 0 ? 'text-rose-500' : 'text-emerald-500'}`}>
                                  {h.unrealized > 0 ? '+' : ''}{formatMoney(h.unrealized)}
                                </span>
                                <span className={`text-sm font-bold px-2 py-0.5 rounded-lg ${h.roi >= 0 ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'}`}>
                                  {h.roi > 0 ? '+' : ''}{h.roi.toFixed(2)}%
                                </span>
                              </div>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* --- 交易明細 --- */}
            {activeTab === 'history' && (
              <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden flex flex-col min-h-[60vh]">
                <div className="p-4 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-50/50">
                  <div className="flex gap-2 p-1 bg-slate-200/50 rounded-xl">
                    <button onClick={()=>setHistoryFilter('all')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${historyFilter==='all' ? 'bg-white shadow-sm':'text-slate-500'}`}>全部紀錄</button>
                    <button onClick={()=>setHistoryFilter('buy')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${historyFilter==='buy' ? 'bg-white shadow-sm':'text-slate-500'}`}>買進 (建倉)</button>
                    <button onClick={()=>setHistoryFilter('sell')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${historyFilter==='sell' ? 'bg-white shadow-sm':'text-slate-500'}`}>賣出 (平倉)</button>
                  </div>
                  <span className="text-xs text-slate-500 bg-white px-3 py-1.5 rounded-full border border-slate-200">共 {transactions.length} 筆資料</span>
                </div>

                <div className="divide-y divide-slate-100 flex-1">
                  {transactions.filter(t => historyFilter === 'all' ? true : t.type === historyFilter).length === 0 ? (
                    <div className="p-12 text-center text-slate-400 mt-10">目前沒有符合的交易紀錄</div>
                  ) : (
                    transactions.filter(t => historyFilter === 'all' ? true : t.type === historyFilter).map((tx) => (
                      <div key={tx.id} className="p-4 sm:p-5 flex flex-col sm:flex-row justify-between hover:bg-slate-50 transition-colors group">
                        
                        <div className="flex items-start gap-4 mb-3 sm:mb-0">
                          <div className={`mt-1 text-xl p-2.5 rounded-2xl shadow-sm ${tx.type === 'buy' ? 'bg-rose-50 border border-rose-100' : 'bg-emerald-50 border border-emerald-100'}`}>
                            {tx.type === 'buy' ? '📥' : '📤'}
                          </div>
                          <div>
                            <div className="flex items-center gap-2 mb-1">
                              <span className={`text-xs font-bold px-2 py-0.5 rounded-md ${tx.type === 'buy' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                {tx.type === 'buy' ? '買進' : '賣出'}
                              </span>
                              <span className="font-bold text-slate-900">{tx.name || tx.symbol}</span>
                              <span className="text-sm text-slate-500">({tx.symbol})</span>
                            </div>
                            <div className="text-sm text-slate-500 flex items-center gap-2">
                              <span>📅 {tx.date}</span>
                            </div>
                            {tx.notes && <div className="text-xs text-slate-400 mt-1.5 bg-white border border-slate-100 p-1.5 rounded-lg inline-block">📝 {tx.notes}</div>}
                          </div>
                        </div>

                        <div className="flex items-center justify-between sm:justify-end gap-6 sm:w-1/2">
                           <div className="grid grid-cols-2 gap-x-6 gap-y-1 text-sm flex-1 text-right sm:max-w-xs">
                              <div className="text-slate-500">成交價: <span className="font-medium text-slate-800">{tx.price}</span></div>
                              <div className="text-slate-500">股數: <span className="font-medium text-slate-800">{tx.shares}</span></div>
                              <div className="text-slate-500 text-xs mt-1">費/稅: <span className="text-slate-600">{tx.fee}/{tx.tax}</span></div>
                              <div className="text-slate-700 font-bold mt-1">淨額: <span className="text-slate-900">{formatMoney(tx.netAmount)}</span></div>
                           </div>
                           
                           <div className="flex flex-col gap-1 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                             <button onClick={() => openEditModal(tx)} className="p-2 text-blue-500 hover:bg-blue-50 rounded-xl transition-colors" title="編輯紀錄">✏️</button>
                             <button onClick={() => handleDelete(tx.id)} className="p-2 text-red-400 hover:bg-red-50 rounded-xl transition-colors" title="刪除紀錄">🗑️</button>
                           </div>
                        </div>

                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

          </main>

          {/* --- 新增/編輯 表單 Modal --- */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[95vh]">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white">
                  <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                    {editingId ? '✏️ 編輯交易紀錄' : '➕ 新增交易紀錄'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 bg-slate-50 hover:bg-slate-100 p-2 rounded-full transition-colors leading-none">✕</button>
                </div>
                
                <form onSubmit={handleSubmit} className="p-6 space-y-5 overflow-y-auto bg-slate-50/50">
                  
                  {/* 第一排：日期與類型 */}
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">交易日期</label>
                      <input type="date" name="date" required value={formData.date} onChange={handleFormChange} className="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800 shadow-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">買賣別</label>
                      <div className="flex bg-slate-200/50 p-1 rounded-xl">
                        <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-colors ${formData.type === 'buy' ? 'bg-rose-500 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                          <input type="radio" name="type" value="buy" checked={formData.type === 'buy'} onChange={handleFormChange} className="hidden" /> 買進
                        </label>
                        <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-colors ${formData.type === 'sell' ? 'bg-emerald-500 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                          <input type="radio" name="type" value="sell" checked={formData.type === 'sell'} onChange={handleFormChange} className="hidden" /> 賣出
                        </label>
                      </div>
                    </div>
                  </div>

                  {/* 第二排：標的與分類 */}
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">標的代號</label>
                      <input type="text" name="symbol" required placeholder="如: 2330, AAPL" value={formData.symbol} onChange={handleFormChange} className="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none uppercase text-slate-800 shadow-sm font-medium" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">資產類別</label>
                      <select name="category" value={formData.category} onChange={handleFormChange} className="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800 shadow-sm">
                        {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                      </select>
                    </div>
                  </div>
                  
                  {/* 第三排：標的名稱 (輔助顯示) */}
                  <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">標的名稱 (選填/可自動帶入)</label>
                      <input type="text" name="name" placeholder="如: 台積電" value={formData.name} onChange={handleFormChange} className="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800 shadow-sm" />
                  </div>

                  <hr className="border-slate-200 my-2" />

                  {/* 第四排：價與量 */}
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">成交價</label>
                      <input type="number" step="0.0001" name="price" required placeholder="0.00" value={formData.price} onChange={handleFormChange} className="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800 shadow-sm font-mono text-lg" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">成交股數/單位</label>
                      <input type="number" step="0.0001" name="shares" required placeholder="0" value={formData.shares} onChange={handleFormChange} className="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800 shadow-sm font-mono text-lg" />
                    </div>
                  </div>

                  {/* 第五排：稅費與淨額 */}
                  <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div className="grid grid-cols-2 gap-4 mb-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-1">手續費</label>
                        <input type="number" step="1" name="fee" placeholder="0" value={formData.fee} onChange={handleFormChange} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-800" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 mb-1">交易稅</label>
                        <input type="number" step="1" name="tax" placeholder="0" value={formData.tax} onChange={handleFormChange} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-800" />
                      </div>
                    </div>
                    <div className="flex justify-between items-center bg-blue-50 p-3 rounded-xl border border-blue-100">
                      <span className="text-sm font-bold text-blue-800">淨收付金額 (系統試算)</span>
                      <input type="number" step="0.01" name="netAmount" required placeholder="自動計算或手動修改" value={formData.netAmount} onChange={handleFormChange} className="w-32 p-1.5 bg-white border border-blue-200 rounded-md text-right text-blue-900 font-bold outline-none" />
                    </div>
                    <p className="text-[10px] text-slate-400 mt-2 text-center">買進: (價×量)+費+稅。 賣出: (價×量)-費-稅。若與對帳單有落差可直接修改上方淨額。</p>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">備註</label>
                    <textarea name="notes" placeholder="交易理由、策略紀錄..." value={formData.notes} onChange={handleFormChange} rows="2" className="w-full p-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none resize-none text-sm text-slate-800 shadow-sm"></textarea>
                  </div>

                  <div className="pt-2">
                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-4 px-4 rounded-2xl shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2">
                      💾 儲存紀錄
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
