<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡資產管理系統</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 核心 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js (用於圓餅圖) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Percento 風格極簡設定 */
    :root {
      --bg-color: #F7F9FC;
      --card-bg: #FFFFFF;
      --text-main: #1D1D1F;
      --text-muted: #86868B;
      --accent-red: #FF3B30; /* 台股習慣：紅漲 */
      --accent-green: #34C759; /* 台股習慣：綠跌 */
      --accent-blue: #007AFF;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #D1D1D6; border-radius: 4px; }
    
    .glass-card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.04);
      transition: all 0.3s ease;
    }
    .glass-card:hover { box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06); }
    
    .nav-item { transition: all 0.2s ease; border-radius: 12px; }
    .nav-item.active { background-color: var(--text-main); color: #FFF; font-weight: 600; }
    .nav-item:not(.active):hover { background-color: #E5E5EA; color: var(--text-main); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 1. Firebase 初始化 ---
    const firebaseConfig = {
      apiKey: "AIzaSyBrLbe2Qx_k-icTv61SQNBw7n4hIcYBCiE",
      authDomain: "my-stock-tracker-f3065.firebaseapp.com",
      projectId: "my-stock-tracker-f3065",
      storageBucket: "my-stock-tracker-f3065.firebasestorage.app",
      messagingSenderId: "802802972309",
      appId: "1:802802972309:web:70c2eadc6b040689834d9c"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // --- 2. 基礎資料設定 ---
    const BUY_REASONS = ['技術面突破', '基本面財報', '籌碼面優勢', '攤平/向下建倉', '定期定額', '情緒衝動/FOMO'];
    const CATEGORIES = { 'TW': '台股', 'US': '美股', 'ETF': 'ETF', 'FUND': '基金' };
    
    // 內建常用圖示 (SVG Inline 以確保絕對不報錯)
    const Icons = {
      Dashboard: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>,
      Trade: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 20V10m0 0l-3 3m3-3l3 3M12 4v2"/></svg>,
      Analytics: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 20V10m-6 10V4M6 20v-4"/></svg>,
      Wallet: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2v-5zm0 0h-4a2 2 0 010-4h4"/></svg>,
      ArrowUp: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>,
      ArrowDown: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 5v14m0 0l-6-6m6 6l6-6"/></svg>,
      Refresh: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    };

    // --- 3. 系統主元件 ---
    function App() {
      const [user, setUser] = useState(null);
      const [transactions, setTransactions] = useState([]);
      const [cashFlows, setCashFlows] = useState([]);
      const [marketPrices, setMarketPrices] = useState({});
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedStock, setSelectedStock] = useState(null); // 個股詳情視圖
      const [isUpdatingPrice, setIsUpdatingPrice] = useState(false);

      // 表單狀態
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalType, setModalType] = useState('trade'); // 'trade' | 'cash'
      const [formData, setFormData] = useState({});

      // --- 資料抓取與認證 ---
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        setLoading(true);
        const unsubTx = db.collection('users').doc(user.uid).collection('transactions').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a, b) => new Date(a.date) - new Date(b.date));
          setTransactions(data);
        });
        const unsubCash = db.collection('users').doc(user.uid).collection('cashFlows').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setCashFlows(data);
          setLoading(false);
        });
        const unsubPrice = db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').onSnapshot((doc) => {
          if (doc.exists) setMarketPrices(doc.data());
        });
        return () => { unsubTx(); unsubCash(); unsubPrice(); };
      }, [user]);

      // --- 核心財務引擎 (FIFO 邏輯與高階統計) ---
      const portfolio = useMemo(() => {
        let holdings = {};
        let sys = {
          totalDeposits: 0, totalWithdrawals: 0, availableCash: 0,
          totalRealized: 0, totalUnrealized: 0, totalMarketValue: 0, totalInvested: 0,
          winTrades: 0, loseTrades: 0, totalWinAmt: 0, totalLoseAmt: 0,
          maxSingleWin: 0, maxSingleLose: 0, totalHoldingDays: 0, closedPositionsCount: 0,
          monthlyPnl: 0
        };

        const currentMonth = new Date().toISOString().substring(0, 7);

        // 1. 計算現金池
        cashFlows.forEach(cf => {
          const amt = parseFloat(cf.amount) || 0;
          if (cf.type === 'deposit') { sys.totalDeposits += amt; sys.availableCash += amt; }
          else if (cf.type === 'withdraw') { sys.totalWithdrawals += amt; sys.availableCash -= amt; }
          else if (cf.type === 'dividend') { sys.availableCash += amt; sys.totalRealized += amt; }
        });

        // 2. 結算股票 (FIFO 計算成本與持有天數)
        transactions.forEach(tx => {
          if (!holdings[tx.symbol]) {
            holdings[tx.symbol] = { symbol: tx.symbol, name: tx.name, category: tx.category, shares: 0, totalCost: 0, avgCost: 0, realizedProfit: 0, buyQueue: [], trades: [] };
          }
          let h = holdings[tx.symbol];
          let shares = parseFloat(tx.shares) || 0;
          let netAmount = parseFloat(tx.netAmount) || 0;
          let txDate = new Date(tx.date);

          h.trades.push(tx); // 存入個股歷史

          if (tx.type === 'buy') {
            h.shares += shares;
            h.totalCost += netAmount;
            h.avgCost = h.totalCost / h.shares;
            sys.availableCash -= netAmount;
            h.buyQueue.push({ shares, price: tx.price, date: txDate, netAmount });
          } else if (tx.type === 'sell') {
            // FIFO 計算單筆利潤與天數
            let remainingToSell = shares;
            let realizedCost = 0;
            let holdingDaysSum = 0;

            while (remainingToSell > 0 && h.buyQueue.length > 0) {
              let b = h.buyQueue[0];
              if (b.shares <= remainingToSell) {
                realizedCost += (b.netAmount / b.shares) * b.shares;
                holdingDaysSum += ((txDate - b.date) / (1000 * 60 * 60 * 24)) * b.shares;
                remainingToSell -= b.shares;
                h.buyQueue.shift();
              } else {
                realizedCost += (b.netAmount / b.shares) * remainingToSell;
                holdingDaysSum += ((txDate - b.date) / (1000 * 60 * 60 * 24)) * remainingToSell;
                b.shares -= remainingToSell;
                b.netAmount -= (b.netAmount / (b.shares + remainingToSell)) * remainingToSell;
                remainingToSell = 0;
              }
            }

            let profit = netAmount - realizedCost;
            h.realizedProfit += profit;
            sys.totalRealized += profit;
            sys.availableCash += netAmount;

            h.shares -= shares;
            h.totalCost -= realizedCost;
            if (h.shares <= 0.0001) { h.shares = 0; h.totalCost = 0; h.avgCost = 0; h.buyQueue = []; }

            // KPI 更新
            if (profit > 0) {
              sys.winTrades++; sys.totalWinAmt += profit;
              if (profit > sys.maxSingleWin) sys.maxSingleWin = profit;
            } else {
              sys.loseTrades++; sys.totalLoseAmt += Math.abs(profit);
              if (Math.abs(profit) > sys.maxSingleLose) sys.maxSingleLose = Math.abs(profit);
            }
            
            if (shares > 0) {
              sys.totalHoldingDays += (holdingDaysSum / shares);
              sys.closedPositionsCount++;
            }

            // 本月損益
            if (tx.date.startsWith(currentMonth)) { sys.monthlyPnl += profit; }
          }
        });

        // 3. 計算未實現 (以手動更新或API的現價為主)
        const activeHoldings = Object.values(holdings).filter(h => h.shares > 0 || h.trades.length > 0);
        let currentDayPnl = 0; // 模擬今日損益

        activeHoldings.forEach(h => {
          if (h.shares > 0) {
            let currentPrice = marketPrices[h.symbol] || h.avgCost;
            let marketValue = h.shares * currentPrice;
            let unrealized = marketValue - h.totalCost;
            
            h.currentPrice = currentPrice;
            h.marketValue = marketValue;
            h.unrealized = unrealized;
            h.roi = h.totalCost > 0 ? (unrealized / h.totalCost) * 100 : 0;

            sys.totalInvested += h.totalCost;
            sys.totalMarketValue += marketValue;
            sys.totalUnrealized += unrealized;
            
            // 簡化版今日損益：若現價與成本有差，則計算微小波動 (真實需抓昨日收盤，此處為示意)
            currentDayPnl += (unrealized * 0.05); // 僅作視覺展示
          } else {
            h.marketValue = 0; h.unrealized = 0; h.roi = 0; h.currentPrice = 0;
          }
        });

        sys.netWorth = sys.availableCash + sys.totalMarketValue;
        sys.totalPrincipal = sys.totalDeposits - sys.totalWithdrawals;
        sys.totalROI = sys.totalPrincipal > 0 ? ((sys.netWorth - sys.totalPrincipal) / sys.totalPrincipal) * 100 : 0;
        sys.winRate = (sys.winTrades + sys.loseTrades) > 0 ? (sys.winTrades / (sys.winTrades + sys.loseTrades)) * 100 : 0;
        sys.avgWin = sys.winTrades > 0 ? sys.totalWinAmt / sys.winTrades : 0;
        sys.avgLose = sys.loseTrades > 0 ? sys.totalLoseAmt / sys.loseTrades : 0;
        sys.avgHoldingDays = sys.closedPositionsCount > 0 ? sys.totalHoldingDays / sys.closedPositionsCount : 0;
        sys.todayPnl = currentDayPnl; // Mock

        // 產生圓餅圖資料
        sys.allocation = {
          labels: ['現金', ...activeHoldings.filter(h=>h.shares>0).map(h=>h.name||h.symbol)],
          data: [sys.availableCash, ...activeHoldings.filter(h=>h.shares>0).map(h=>h.marketValue)]
        };

        return { holdings: activeHoldings, sys };
      }, [transactions, cashFlows, marketPrices]);

      // --- Yahoo 自動更新現價 (透過 AllOrigins 代理) ---
      const fetchLivePrices = async () => {
        setIsUpdatingPrice(true);
        let newPrices = { ...marketPrices };
        let updatedCount = 0;

        for (let h of portfolio.holdings.filter(h => h.shares > 0)) {
          try {
            // 自動判斷台股加後綴
            let querySymbol = h.symbol;
            if (/^\d{4}$/.test(querySymbol)) querySymbol += '.TW';
            
            // 使用公開代理抓取 Yahoo API
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${querySymbol}`)}`);
            if (response.ok) {
              const data = await response.json();
              const parsed = JSON.parse(data.contents);
              if (parsed.chart.result && parsed.chart.result.length > 0) {
                const price = parsed.chart.result[0].meta.regularMarketPrice;
                if (price) {
                  newPrices[h.symbol] = price;
                  updatedCount++;
                }
              }
            }
          } catch (e) { console.error("Fetch failed for", h.symbol, e); }
        }

        if (updatedCount > 0) {
          await db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').set(newPrices);
        }
        setIsUpdatingPrice(false);
      };

      // --- 自動補全股票名稱 (雅虎搜不到就用本地字典) ---
      const autoFillStockName = async (symbol) => {
        if (!symbol) return '';
        const upperSym = symbol.toUpperCase();
        if (STOCK_DICTIONARY[upperSym]) return STOCK_DICTIONARY[upperSym].name;
        // 可選：實作線上搜尋，但為確保速度與穩定，返回空由用戶自填
        return '';
      };

      // --- UI Helper ---
      const formatMoney = (num) => Number(num).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
      // 台股紅漲綠跌邏輯
      const ColorRed = '#FF3B30';
      const ColorGreen = '#34C759';
      const getColorClass = (num) => num > 0 ? 'text-[#FF3B30]' : num < 0 ? 'text-[#34C759]' : 'text-gray-500';
      const getBgColorClass = (num) => num > 0 ? 'bg-[#FF3B30]/10 text-[#FF3B30]' : num < 0 ? 'bg-[#34C759]/10 text-[#34C759]' : 'bg-gray-100 text-gray-500';

      // --- 元件：圓餅圖 ---
      const PieChart = ({ allocation }) => {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);
        useEffect(() => {
          if (!canvasRef.current || !allocation.data.length) return;
          if (chartInstance.current) chartInstance.current.destroy();
          
          const ctx = canvasRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: allocation.labels,
              datasets: [{
                data: allocation.data,
                backgroundColor: ['#007AFF', '#34C759', '#FF9500', '#FF3B30', '#5856D6', '#AF52DE', '#FF2D55'],
                borderWidth: 0,
                hoverOffset: 4
              }]
            },
            options: { cutout: '75%', plugins: { legend: { display: false } }, animation: { animateScale: true } }
          });
          return () => chartInstance.current?.destroy();
        }, [allocation]);

        return <canvas ref={canvasRef} className="max-h-[200px] mx-auto"></canvas>;
      };

      // --- 元件：AI 分析器 ---
      const AICoach = () => {
        const sys = portfolio.sys;
        let tips = [];
        if (sys.winRate === 0 && sys.loseTrades === 0) tips.push("歡迎使用！請先記錄幾筆交易，AI 教練才能為您提供精準分析。");
        else {
          if (sys.winRate > 60) tips.push("🔥 您的勝率極高，代表選股眼光精準。");
          else if (sys.winRate < 40) tips.push("⚠️ 勝率偏低。建議回顧「交易日誌」，檢查是否經常因為「情緒衝動」而追高殺低。");
          
          let plRatio = (sys.avgWin / (sys.avgLose || 1));
          if (plRatio > 2) tips.push("⭐ 賺賠比優異！您貫徹了「大賺小賠」的鐵則，請繼續保持。");
          else if (plRatio < 1 && sys.loseTrades > 0) tips.push("💡 警訊：您的平均虧損大於平均獲利。可能患有「套牢死抱、微利早跑」的散戶通病，請嚴格設定停損點。");

          if (sys.avgHoldingDays < 5 && sys.winRate < 50) tips.push("📉 持股天數極短且勝率不佳，頻繁的短線進出可能正在侵蝕您的本金（手續費與摩擦成本）。");
        }

        return (
          <div className="space-y-3">
            {tips.map((tip, i) => (
              <div key={i} className="flex gap-3 items-start bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                <span className="text-xl">🤖</span>
                <p className="text-sm text-[#1D1D1F] leading-relaxed font-medium">{tip}</p>
              </div>
            ))}
          </div>
        );
      };

      // --- 個股詳情視圖 (Drill-down) ---
      if (selectedStock) {
        const h = portfolio.holdings.find(h => h.symbol === selectedStock);
        if (!h) return null;
        return (
          <div className="min-h-screen bg-[#F7F9FC] pb-24">
            <header className="bg-white sticky top-0 z-20 border-b border-gray-100 px-6 py-4 flex items-center justify-between">
              <button onClick={()=>setSelectedStock(null)} className="text-[#007AFF] font-medium flex items-center gap-1">← 返回</button>
              <h2 className="font-bold text-lg">{h.name || h.symbol} ({h.symbol})</h2>
              <div className="w-10"></div>
            </header>
            
            <main className="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="glass-card p-5">
                  <p className="text-xs text-[#86868B] font-bold uppercase mb-1">庫存股數</p>
                  <p className="text-2xl font-bold">{h.shares}</p>
                </div>
                <div className="glass-card p-5">
                  <p className="text-xs text-[#86868B] font-bold uppercase mb-1">平均成本</p>
                  <p className="text-2xl font-bold">${h.avgCost.toFixed(2)}</p>
                </div>
                <div className="glass-card p-5">
                  <p className="text-xs text-[#86868B] font-bold uppercase mb-1">未實現損益</p>
                  <p className={`text-2xl font-bold ${getColorClass(h.unrealized)}`}>{h.unrealized > 0 ? '+' : ''}{fmtM(h.unrealized)}</p>
                  <p className={`text-xs mt-1 font-bold ${getColorClass(h.roi)}`}>({h.roi > 0 ? '+' : ''}{h.roi.toFixed(2)}%)</p>
                </div>
                <div className="glass-card p-5">
                  <p className="text-xs text-[#86868B] font-bold uppercase mb-1">已實現獲利</p>
                  <p className={`text-2xl font-bold ${getColorClass(h.realizedProfit)}`}>{h.realizedProfit > 0 ? '+' : ''}{fmtM(h.realizedProfit)}</p>
                </div>
              </div>

              <div className="glass-card p-6">
                <h3 className="font-bold text-lg mb-4">操作歷史</h3>
                <div className="divide-y divide-gray-100">
                  {h.trades.slice().reverse().map(tx => (
                    <div key={tx.id} className="py-3 flex justify-between items-center">
                      <div className="flex items-center gap-3">
                        <span className={`px-2 py-1 rounded text-xs font-bold ${tx.type === 'buy' ? 'bg-[#FF3B30]/10 text-[#FF3B30]' : 'bg-[#34C759]/10 text-[#34C759]'}`}>{tx.type === 'buy' ? '買' : '賣'}</span>
                        <div>
                          <p className="font-bold text-sm">{tx.date}</p>
                          <p className="text-xs text-[#86868B]">{tx.reason || '無備註'}</p>
                        </div>
                      </div>
                      <div className="text-right">
                        <p className="font-bold text-sm">${tx.price} × {tx.shares}</p>
                        <p className="text-xs text-[#86868B]">淨額: ${fmtM(tx.netAmount)}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          </div>
        );
      }

      // --- 主畫面渲染 ---
      if (loading) return <div className="flex h-screen items-center justify-center bg-[#F7F9FC] font-bold text-gray-400">Loading...</div>;
      
      if (!user) {
        return (
          <div className="flex h-screen items-center justify-center bg-[#F7F9FC]">
            <div className="glass-card p-10 text-center max-w-sm w-full mx-4">
              <div className="w-16 h-16 bg-[#007AFF] text-white rounded-2xl mx-auto flex items-center justify-center mb-6 shadow-lg"><Icons.Dashboard /></div>
              <h1 className="text-2xl font-extrabold mb-2 tracking-tight">資產管理中心</h1>
              <p className="text-[#86868B] text-sm mb-8">極簡設計・精準回測・AI 覆盤</p>
              <button onClick={() => auth.signInWithPopup(googleProvider).catch(()=>alert("登入失敗"))} 
                className="w-full bg-[#1D1D1F] hover:bg-[#000000] text-white px-6 py-3.5 rounded-xl font-bold transition-all flex items-center justify-center gap-2">
                開始使用
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-[#F7F9FC]">
          
          {/* 左側導航 (Desktop) / 底部導航 (Mobile) */}
          <nav className="w-full md:w-64 bg-white border-r border-gray-100 flex-shrink-0 flex flex-col justify-between fixed bottom-0 md:relative z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] md:shadow-none">
            <div className="p-4 md:p-6 flex flex-row md:flex-col gap-2 md:gap-4 overflow-x-auto md:overflow-visible">
              <div className="hidden md:flex items-center gap-3 mb-8 px-2">
                <div className="w-8 h-8 bg-[#007AFF] text-white rounded-lg flex items-center justify-center"><Icons.Dashboard /></div>
                <span className="font-extrabold text-lg tracking-tight">AssetDash</span>
              </div>
              
              <button onClick={() => setActiveTab('dashboard')} className={`nav-item flex items-center gap-3 px-4 py-3 min-w-[100px] justify-center md:justify-start ${activeTab === 'dashboard' ? 'active' : 'text-[#86868B]'}`}>
                <Icons.Dashboard /> <span className="text-sm">首頁</span>
              </button>
              <button onClick={() => setActiveTab('trade')} className={`nav-item flex items-center gap-3 px-4 py-3 min-w-[100px] justify-center md:justify-start ${activeTab === 'trade' ? 'active' : 'text-[#86868B]'}`}>
                <Icons.Trade /> <span className="text-sm">交易</span>
              </button>
              <button onClick={() => setActiveTab('analytics')} className={`nav-item flex items-center gap-3 px-4 py-3 min-w-[100px] justify-center md:justify-start ${activeTab === 'analytics' ? 'active' : 'text-[#86868B]'}`}>
                <Icons.Analytics /> <span className="text-sm">分析</span>
              </button>
            </div>
            
            <div className="hidden md:block p-6 border-t border-gray-100">
              <button onClick={() => auth.signOut()} className="text-sm text-[#86868B] hover:text-[#1D1D1F] font-bold w-full text-left px-2">登出帳號</button>
            </div>
          </nav>

          {/* 右側主內容區 */}
          <main className="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8">
            <header className="flex justify-between items-center mb-8">
              <h2 className="text-2xl font-extrabold tracking-tight">
                {activeTab === 'dashboard' ? '總覽 Dashboard' : activeTab === 'trade' ? '交易紀錄與日誌' : '操作分析中心'}
              </h2>
              <div className="flex gap-2">
                <button onClick={() => {setModalType('cash'); setFormData({type:'deposit', date:new Date().toISOString().split('T')[0], amount:''}); setIsModalOpen(true);}} className="bg-white border border-gray-200 text-[#1D1D1F] px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-gray-50 transition-all flex items-center gap-2">
                  <Icons.Wallet /> 出入金
                </button>
                <button onClick={() => {setModalType('trade'); setFormData({type:'buy', date:new Date().toISOString().split('T')[0], category:'TW', reason:'', planFollowed:'yes', symbol:'', shares:'', price:'', fee:'0', tax:'0'}); setIsModalOpen(true);}} className="bg-[#1D1D1F] text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md hover:bg-black transition-all flex items-center gap-2">
                  + 記一筆
                </button>
              </div>
            </header>

            {/* --- 分頁：首頁 Dashboard --- */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6 max-w-5xl">
                {/* 頂部四宮格核心數據 */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="glass-card p-5 flex flex-col justify-between">
                    <p className="text-xs text-[#86868B] font-bold uppercase mb-2">總資產</p>
                    <h3 className="text-2xl md:text-3xl font-extrabold tracking-tight">${fmtM(portfolio.sys.netWorth)}</h3>
                  </div>
                  <div className="glass-card p-5 flex flex-col justify-between">
                    <p className="text-xs text-[#86868B] font-bold uppercase mb-2">總投入本金</p>
                    <h3 className="text-xl md:text-2xl font-bold tracking-tight">${fmtM(portfolio.sys.totalPrincipal)}</h3>
                  </div>
                  <div className="glass-card p-5 flex flex-col justify-between">
                    <p className="text-xs text-[#86868B] font-bold uppercase mb-2">累積損益 (已+未)</p>
                    <div>
                      <h3 className={`text-xl md:text-2xl font-bold tracking-tight ${getColorClass(portfolio.sys.totalRealized + portfolio.sys.totalUnrealized)}`}>
                        {portfolio.sys.totalRealized + portfolio.sys.totalUnrealized > 0 ? '+' : ''}{fmtM(portfolio.sys.totalRealized + portfolio.sys.totalUnrealized)}
                      </h3>
                    </div>
                  </div>
                  <div className="glass-card p-5 flex flex-col justify-between">
                    <p className="text-xs text-[#86868B] font-bold uppercase mb-2">總報酬率</p>
                    <div className={`inline-flex items-center gap-1 ${getBgColorClass(portfolio.sys.totalROI)} px-3 py-1.5 rounded-lg w-fit mt-1`}>
                      {portfolio.sys.totalROI > 0 ? <Icons.ArrowUp /> : portfolio.sys.totalROI < 0 ? <Icons.ArrowDown /> : null}
                      <span className="font-extrabold text-lg">{Math.abs(portfolio.sys.totalROI).toFixed(2)}%</span>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* 左側：資產配置圓餅圖與現金 */}
                  <div className="glass-card p-6 md:col-span-1 flex flex-col">
                    <h3 className="font-bold text-lg mb-6">資產配置</h3>
                    <div className="flex-1 flex items-center justify-center mb-6">
                      <PieChart allocation={portfolio.sys.allocation} />
                    </div>
                    <div className="border-t border-gray-100 pt-4 flex justify-between items-center">
                      <span className="text-[#86868B] text-sm font-bold">現金餘額</span>
                      <span className="text-lg font-extrabold">${fmtM(portfolio.sys.availableCash)}</span>
                    </div>
                  </div>

                  {/* 右側：持股庫存 */}
                  <div className="glass-card p-0 md:col-span-2 overflow-hidden flex flex-col">
                    <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-[#F8F9FA]">
                      <h3 className="font-bold text-lg">目前持股</h3>
                      <button onClick={fetchLivePrices} disabled={isUpdatingPrice} className="text-sm text-[#007AFF] hover:text-[#0056b3] font-bold flex items-center gap-1 bg-blue-50 px-3 py-1.5 rounded-full transition-colors">
                        {isUpdatingPrice ? '更新中...' : <><Icons.Refresh /> 抓取收盤價</>}
                      </button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto">
                      <table className="w-full text-left text-sm whitespace-nowrap">
                        <thead className="text-[11px] text-[#86868B] uppercase tracking-wider sticky top-0 bg-white shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
                          <tr>
                            <th className="px-6 py-3 font-bold">標的</th>
                            <th className="px-6 py-3 font-bold text-right">均價 / 數量</th>
                            <th className="px-6 py-3 font-bold text-right">現價 (可手改)</th>
                            <th className="px-6 py-3 font-bold text-right">未實現損益</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-50">
                          {portfolio.holdings.length === 0 ? <tr><td colSpan="4" className="text-center py-10 text-[#86868B]">尚無庫存</td></tr> : null}
                          {portfolio.holdings.map((h, i) => (
                            <tr key={i} onClick={()=>setSelectedStock(h.symbol)} className="hover:bg-[#F8F9FA] cursor-pointer transition-colors group">
                              <td className="px-6 py-4">
                                <div className="font-extrabold text-base group-hover:text-[#007AFF] transition-colors">{h.name || h.symbol}</div>
                                <div className="text-xs text-[#86868B] mt-0.5">{h.symbol}</div>
                              </td>
                              <td className="px-6 py-4 text-right">
                                <div className="font-bold text-[#1D1D1F]">${h.avgCost.toFixed(2)}</div>
                                <div className="text-xs text-[#86868B] mt-0.5">{h.shares} 股</div>
                              </td>
                              <td className="px-6 py-4 text-right" onClick={e=>e.stopPropagation()}>
                                <input type="number" value={h.currentPrice||''} onChange={(e) => {
                                    const val = parseFloat(e.target.value);
                                    if(!isNaN(val)) db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').set({[h.symbol]: val}, {merge:true});
                                  }} 
                                  className="w-20 px-2 py-1 text-right bg-gray-50 border border-gray-200 rounded-md focus:ring-2 focus:ring-[#007AFF] outline-none font-mono text-sm transition-all hover:bg-white" placeholder="現價"/>
                              </td>
                              <td className="px-6 py-4 text-right">
                                <div className={`font-extrabold text-base ${getColorClass(h.unrealized)}`}>{h.unrealized > 0 ? '+' : ''}{fmtM(h.unrealized)}</div>
                                <div className={`text-[11px] font-bold mt-1 inline-block px-1.5 py-0.5 rounded ${getBgColorClass(h.roi)}`}>
                                  {h.roi > 0 ? '+' : ''}{h.roi.toFixed(2)}%
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* --- 分頁：分析中心 --- */}
            {activeTab === 'analytics' && (
              <div className="space-y-6 max-w-5xl">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="glass-card p-6">
                    <p className="text-xs text-[#86868B] font-bold uppercase mb-2">勝率 (Win Rate)</p>
                    <h3 className="text-3xl font-extrabold">{portfolio.sys.winRate.toFixed(1)}%</h3>
                    <p className="text-xs text-[#86868B] mt-2">勝 {portfolio.sys.winTrades} / 敗 {portfolio.sys.loseTrades}</p>
                  </div>
                  <div className="glass-card p-6">
                    <p className="text-xs text-[#86868B] font-bold uppercase mb-2">平均獲利</p>
                    <h3 className="text-2xl font-extrabold text-[#FF3B30]">${fmtM(portfolio.sys.avgWin)}</h3>
                  </div>
                  <div className="glass-card p-6">
                    <p className="text-xs text-[#86868B] font-bold uppercase mb-2">平均虧損</p>
                    <h3 className="text-2xl font-extrabold text-[#34C759]">${fmtM(portfolio.sys.avgLose)}</h3>
                  </div>
                  <div className="glass-card p-6">
                    <p className="text-xs text-[#86868B] font-bold uppercase mb-2">持股平均天數</p>
                    <h3 className="text-3xl font-extrabold">{portfolio.sys.avgHoldingDays.toFixed(0)} <span className="text-base text-[#86868B] font-normal">天</span></h3>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="glass-card p-6">
                    <h3 className="font-bold text-lg mb-6 flex items-center gap-2">🤖 AI 私人教練建議</h3>
                    <AICoach />
                  </div>
                  <div className="glass-card p-6">
                    <h3 className="font-bold text-lg mb-6">極端值分析</h3>
                    <div className="space-y-4">
                      <div className="flex justify-between items-center p-4 bg-[#FF3B30]/5 rounded-xl border border-[#FF3B30]/10">
                        <span className="font-bold text-sm text-[#FF3B30]">最大單筆獲利</span>
                        <span className="font-extrabold text-xl text-[#FF3B30]">${fmtM(portfolio.sys.maxSingleWin)}</span>
                      </div>
                      <div className="flex justify-between items-center p-4 bg-[#34C759]/5 rounded-xl border border-[#34C759]/10">
                        <span className="font-bold text-sm text-[#34C759]">最大單筆虧損</span>
                        <span className="font-extrabold text-xl text-[#34C759]">${fmtM(portfolio.sys.maxSingleLose)}</span>
                      </div>
                      <div className="flex justify-between items-center p-4 bg-gray-50 rounded-xl border border-gray-100">
                        <span className="font-bold text-sm text-[#1D1D1F]">本月累積損益</span>
                        <span className={`font-extrabold text-xl ${getColorClass(portfolio.sys.monthlyPnl)}`}>{portfolio.sys.monthlyPnl > 0 ? '+' : ''}${fmtM(portfolio.sys.monthlyPnl)}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* --- 分頁：交易日誌 --- */}
            {activeTab === 'trade' && (
              <div className="glass-card overflow-hidden max-w-5xl">
                <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-[#F8F9FA]">
                  <h3 className="font-bold text-lg">歷史交易流水</h3>
                </div>
                <div className="divide-y divide-gray-50">
                  {transactions.slice().reverse().map(tx => (
                    <div key={tx.id} className="p-6 hover:bg-[#F8F9FA] transition-colors flex flex-col md:flex-row gap-6 items-start md:items-center group">
                      
                      {/* Icon & Basic Info */}
                      <div className="flex items-center gap-4 min-w-[200px]">
                        <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold text-sm ${tx.type === 'buy' ? 'bg-[#FF3B30]/10 text-[#FF3B30]' : 'bg-[#34C759]/10 text-[#34C759]'}`}>
                          {tx.type === 'buy' ? '買' : '賣'}
                        </div>
                        <div>
                          <div className="font-extrabold text-lg">{tx.name || tx.symbol} <span className="text-xs text-[#86868B] font-normal ml-1">({tx.symbol})</span></div>
                          <div className="text-xs text-[#86868B]">{tx.date}</div>
                        </div>
                      </div>

                      {/* Math Info */}
                      <div className="grid grid-cols-2 gap-4 text-sm flex-1">
                        <div><span className="text-[#86868B]">單價:</span> <span className="font-bold text-mono">${tx.price}</span></div>
                        <div><span className="text-[#86868B]">數量:</span> <span className="font-bold text-mono">{tx.shares}</span></div>
                        <div className="col-span-2 pt-2 border-t border-gray-100"><span className="text-[#86868B]">淨收付:</span> <span className="font-extrabold text-lg">${fmtM(tx.netAmount)}</span></div>
                      </div>

                      {/* Tags & Delete */}
                      <div className="flex flex-col items-end gap-2 min-w-[150px]">
                        <div className="flex gap-2 flex-wrap justify-end">
                          {tx.reason && <span className="text-[10px] font-bold px-2 py-1 bg-gray-100 rounded text-gray-600">{tx.reason}</span>}
                          {tx.type === 'sell' && tx.planFollowed === 'yes' && <span className="text-[10px] font-bold px-2 py-1 bg-[#34C759]/10 text-[#34C759] rounded">守紀律</span>}
                        </div>
                        <button onClick={()=>{ if(window.confirm('確定刪除？庫存將重新計算。')) db.collection('users').doc(user.uid).collection('transactions').doc(tx.id).delete(); }} 
                          className="text-[#86868B] hover:text-[#FF3B30] text-sm opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1 mt-2">
                          刪除紀錄
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* --- Modal：共用輸入表單 --- */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-[#1D1D1F]/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="glass-card w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-[#F8F9FA]">
                  <h3 className="font-extrabold text-lg">{modalType === 'trade' ? '新增交易紀錄' : '新增資金流水'}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-[#86868B] hover:text-[#1D1D1F] text-xl font-bold leading-none">✕</button>
                </div>
                
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  if(modalType === 'trade') {
                    let price = parseFloat(formData.price)||0, shares = parseFloat(formData.shares)||0;
                    let fee = parseFloat(formData.fee)||0, tax = parseFloat(formData.tax)||0;
                    let net = formData.type === 'buy' ? (price*shares + fee + tax) : (price*shares - fee - tax);
                    let payload = { ...formData, price, shares, fee, tax, netAmount: net, symbol: formData.symbol.toUpperCase() };
                    await db.collection('users').doc(user.uid).collection('transactions').add(payload);
                  } else {
                    await db.collection('users').doc(user.uid).collection('cashFlows').add({...formData, amount: parseFloat(formData.amount)||0});
                  }
                  setIsModalOpen(false);
                }} className="p-6 space-y-4 overflow-y-auto">

                  {modalType === 'trade' ? (
                    <>
                      <div className="flex bg-gray-100 p-1 rounded-xl">
                        <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-colors ${formData.type === 'buy' ? 'bg-white shadow-sm text-[#FF3B30]' : 'text-[#86868B]'}`}>
                          <input type="radio" name="type" checked={formData.type === 'buy'} onChange={()=>setFormData({...formData, type:'buy'})} className="hidden"/> 買進
                        </label>
                        <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-colors ${formData.type === 'sell' ? 'bg-white shadow-sm text-[#34C759]' : 'text-[#86868B]'}`}>
                          <input type="radio" name="type" checked={formData.type === 'sell'} onChange={()=>setFormData({...formData, type:'sell'})} className="hidden"/> 賣出
                        </label>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-[#86868B] mb-1">代號</label>
                          <input required type="text" placeholder="2330" value={formData.symbol} onChange={async (e)=>{
                            let sym = e.target.value.toUpperCase();
                            let name = formData.name;
                            if(STOCK_DICTIONARY[sym]) name = STOCK_DICTIONARY[sym].name;
                            setFormData({...formData, symbol: sym, name});
                          }} className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#007AFF] outline-none font-bold uppercase"/>
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-[#86868B] mb-1">名稱 (自動帶入)</label>
                          <input type="text" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#007AFF] outline-none"/>
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-[#86868B] mb-1">單價</label>
                          <input required type="number" step="0.001" value={formData.price} onChange={e=>setFormData({...formData, price: e.target.value})} className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#007AFF] outline-none font-mono"/>
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-[#86868B] mb-1">股數</label>
                          <input required type="number" step="0.001" value={formData.shares} onChange={e=>setFormData({...formData, shares: e.target.value})} className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#007AFF] outline-none font-mono"/>
                        </div>
                      </div>
                      {formData.type === 'buy' && (
                        <div>
                          <label className="block text-xs font-bold text-[#86868B] mb-1">進場理由</label>
                          <select value={formData.reason} onChange={e=>setFormData({...formData, reason: e.target.value})} className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg outline-none text-sm font-bold">
                            <option value="">選擇理由...</option>
                            {BUY_REASONS.map(r => <option key={r} value={r}>{r}</option>)}
                          </select>
                        </div>
                      )}
                    </>
                  ) : (
                    <>
                      <div className="flex bg-gray-100 p-1 rounded-xl">
                        <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-colors ${formData.type === 'deposit' ? 'bg-white shadow-sm text-[#007AFF]' : 'text-[#86868B]'}`}>
                          <input type="radio" checked={formData.type === 'deposit'} onChange={()=>setFormData({...formData, type:'deposit'})} className="hidden"/> 儲值入金
                        </label>
                        <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-colors ${formData.type === 'withdraw' ? 'bg-white shadow-sm text-[#1D1D1F]' : 'text-[#86868B]'}`}>
                          <input type="radio" checked={formData.type === 'withdraw'} onChange={()=>setFormData({...formData, type:'withdraw'})} className="hidden"/> 提領出金
                        </label>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-[#86868B] mb-1">日期</label>
                        <input required type="date" value={formData.date} onChange={e=>setFormData({...formData, date: e.target.value})} className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg outline-none font-mono"/>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-[#86868B] mb-1">金額</label>
                        <input required type="number" step="1" value={formData.amount} onChange={e=>setFormData({...formData, amount: e.target.value})} className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg outline-none font-mono text-xl font-bold"/>
                      </div>
                    </>
                  )}
                  
                  <button type="submit" className="w-full bg-[#1D1D1F] hover:bg-[#000000] text-white font-bold py-3.5 rounded-xl transition-all mt-4">
                    儲存紀錄
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
