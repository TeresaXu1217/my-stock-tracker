    // --- 極簡單線 SVG 圖示庫 ---

    const IconTrash = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
    const IconX = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconSettings = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>;
    const IconImage = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;

    // --- 輔助資料 ---
    const ASSET_COLORS = { TW_STOCK: '#1E3A8A', US_STOCK: '#3B82F6', TW_ETF: '#0D9488', FUND: '#6366F1', CASH: '#94A3B8' };
    const ASSET_LABELS = { TW_STOCK: '台股', US_STOCK: '海外股', TW_ETF: 'ETF', FUND: '基金', CASH: '現金' };

    const fmtM = (num) => Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    const fmtDec = (num) => Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const getColorClass = (num) => num > 0 ? 'text-[#E53935]' : num < 0 ? 'text-[#059669]' : 'text-slate-500';
    const getTxHash = (tx) => `${tx.date}_${tx.name||tx.symbol}_${tx.type}_${tx.shares}`;

    // --- CSV 解析器 (處理引號與逗號) ---
    const parseCSVLine = (text) => {
        let ret = [], p = '', quote = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            if (c === '"' && quote && text[i+1] === '"') { p += '"'; i++; }
            else if (c === '"') { quote = !quote; }
            else if (c === ',' && !quote) { ret.push(p); p = ''; }
            else { p += c; }
        }
        ret.push(p);
        return ret.map(s => s.trim());
    };

    // --- AI API 呼叫 (支援 Vercel) ---
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const callGeminiWithRetry = async (base64Image, mimeType) => {
        let apiKey = localStorage.getItem('gemini_api_key') || ""; 
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        
        const payload = {
            contents: [{
                role: "user",
                parts: [
                    { text: "請分析這張證券交易截圖，擷取「所有」交易資訊。請以嚴格的 JSON 陣列 (Array) 格式輸出，不要包含任何 Markdown 標記或反白字元：\n[\n  {\n    \"date\": \"YYYY-MM-DD\",\n    \"name\": \"股票或基金名稱\",\n    \"symbol\": \"股票代號(若無則填空字串)\",\n    \"type\": \"buy 或 sell\",\n    \"price\": 單價(數字),\n    \"shares\": 股數或單位數(數字),\n    \"fee\": 手續費(數字),\n    \"tax\": 交易稅(數字),\n    \"netAmount\": 淨收付金額(正數的絕對值)\n  }\n]" },
                    { inlineData: { mimeType: mimeType, data: base64Image } }
                ]
            }],
            generationConfig: { responseMimeType: "application/json" }
        };
        
        let delays = [1000, 2000, 4000];
        for (let i = 0; i < delays.length; i++) {
            try {
                const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                if (!res.ok) throw new Error("API status " + res.status);
                const data = await res.json();
                let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                const parsed = JSON.parse(text);
                return Array.isArray(parsed) ? parsed : [parsed];
            } catch (e) {
                if (i === delays.length - 1) throw e;
                await sleep(delays[i]);
            }
        }
    };

    // --- 主元件 ---
    function App() {
      const [user, setUser] = useState(null);
      const [transactions, setTransactions] = useState([]);
      const [cashFlows, setCashFlows] = useState([]);
      const [marketPrices, setMarketPrices] = useState({});
      const [loading, setLoading] = useState(true);
      
      const [activeTab, setActiveTab] = useState('dashboard');
      
      const [isTradeModalOpen, setIsTradeModalOpen] = useState(false);
      const [editingTradeId, setEditingTradeId] = useState(null);
      const [tradeForm, setTradeForm] = useState({});
      const [isCashModalOpen, setIsCashModalOpen] = useState(false);
      const [cashForm, setCashForm] = useState({});

      // 設定 Modal (儲存 API Key)
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [apiKeyInput, setApiKeyInput] = useState(localStorage.getItem('gemini_api_key') || '');

      // 對帳與智能匯入 Modal
      const [isImportModalOpen, setIsImportModalOpen] = useState(false);
      const [importState, setImportState] = useState({ status: 'idle', message: '' }); 
      const [reconData, setReconData] = useState({ toAdd: [], duplicates: [], orphans: [] });

      const [selectedAsset, setSelectedAsset] = useState(null);

      // --- 資料抓取 ---
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        setLoading(true);
        const unsubTx = db.collection('users').doc(user.uid).collection('transactions').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a, b) => new Date(a.date) - new Date(b.date));
          setTransactions(data);
        });
        const unsubCash = db.collection('users').doc(user.uid).collection('cashFlows').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setCashFlows(data);
          setLoading(false);
        });
        const unsubPrice = db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').onSnapshot((doc) => {
          if (doc.exists) setMarketPrices(doc.data());
        });
        return () => { unsubTx(); unsubCash(); unsubPrice(); };
      }, [user]);

      // --- 核心財務引擎 (修正淨投入本金與損益邏輯) ---
      const portfolio = useMemo(() => {
        let holdings = {};
        let sys = { 
            totalDeposits: 0, 
            totalWithdrawals: 0, 
            availableCash: 0, 
            totalRealized: 0, 
            totalUnrealized: 0, 
            totalMarketValue: 0,
            totalInventoryCost: 0 // 新增：帳面庫存總成本
        };
        
        let categoryStats = {
          TW_STOCK: { value: 0, color: ASSET_COLORS.TW_STOCK, label: ASSET_LABELS.TW_STOCK },
          US_STOCK: { value: 0, color: ASSET_COLORS.US_STOCK, label: ASSET_LABELS.US_STOCK },
          TW_ETF: { value: 0, color: ASSET_COLORS.TW_ETF, label: ASSET_LABELS.TW_ETF },
          FUND: { value: 0, color: ASSET_COLORS.FUND, label: ASSET_LABELS.FUND },
          CASH: { value: 0, color: ASSET_COLORS.CASH, label: ASSET_LABELS.CASH }
        };

        cashFlows.forEach(cf => {
          const amt = parseFloat(cf.amount) || 0;
          if (cf.type === 'deposit') { sys.totalDeposits += amt; sys.availableCash += amt; }
          else if (cf.type === 'withdraw') { sys.totalWithdrawals += amt; sys.availableCash -= amt; }
          else if (cf.type === 'dividend') { sys.availableCash += amt; sys.totalRealized += amt; }
        });
        // 嚴格定義淨投入本金：基本投入的資金 (總入金 - 總出金)
        sys.netPrincipal = sys.totalDeposits - sys.totalWithdrawals;
        categoryStats.CASH.value = sys.availableCash;

        transactions.forEach(tx => {
          let sym = tx.symbol || tx.name;
          if (!holdings[sym]) { holdings[sym] = { symbol: sym, name: tx.name, assetType: tx.assetType || 'TW_STOCK', qty: 0, totalCost: 0, avgCost: 0, realizedProfit: 0, buyQueue: [] }; }
          let h = holdings[sym];
          let qty = parseFloat(tx.shares) || 0;
          let netAmount = parseFloat(tx.netAmount) || 0;

          if (tx.type === 'buy') {
            h.qty += qty; h.totalCost += netAmount; h.avgCost = h.totalCost / h.qty;
            sys.availableCash -= netAmount;
            categoryStats.CASH.value = sys.availableCash; 
            h.buyQueue.push({ qty, netAmount });
          } else if (tx.type === 'dividend_reinvest') {
            h.qty += qty; h.avgCost = h.totalCost / h.qty;
            h.buyQueue.push({ qty, netAmount: 0 }); 
          } else if (tx.type === 'sell') {
            let remainingToSell = qty; let realizedCost = 0;
            while (remainingToSell > 0 && h.buyQueue.length > 0) {
              let b = h.buyQueue[0];
              if (b.qty <= remainingToSell) { realizedCost += b.netAmount; remainingToSell -= b.qty; h.buyQueue.shift(); } 
              else { realizedCost += (b.netAmount / b.qty) * remainingToSell; b.qty -= remainingToSell; b.netAmount -= (b.netAmount / (b.qty + remainingToSell)) * remainingToSell; remainingToSell = 0; }
            }
            let profit = netAmount - realizedCost;
            h.realizedProfit += profit; sys.totalRealized += profit; sys.availableCash += netAmount;
            categoryStats.CASH.value = sys.availableCash;
            h.qty -= qty; h.totalCost -= realizedCost;
            if (h.qty <= 0.0001) { h.qty = 0; h.totalCost = 0; h.avgCost = 0; h.buyQueue = []; }
          }
        });

        const allAssets = Object.values(holdings).filter(h => h.qty > 0 || h.realizedProfit !== 0); 
        
        allAssets.forEach(h => {
          if (h.qty > 0) {
            let currentPrice = marketPrices[h.symbol] || h.avgCost;
            let marketValue = h.qty * currentPrice;
            let unrealized = marketValue - h.totalCost;
            h.currentPrice = currentPrice; h.marketValue = marketValue; h.unrealized = unrealized;
            h.roi = h.totalCost > 0 ? (unrealized / h.totalCost) * 100 : 0;
            
            sys.totalMarketValue += marketValue; 
            sys.totalUnrealized += unrealized;
            sys.totalInventoryCost += h.totalCost; // 計算目前庫存的本金
            
            if(categoryStats[h.assetType]) categoryStats[h.assetType].value += marketValue;
          } else { h.currentPrice = 0; h.marketValue = 0; h.unrealized = 0; h.roi = 0; }
        });

        sys.totalAssets = sys.availableCash + sys.totalMarketValue;
        sys.totalPnl = sys.totalRealized + sys.totalUnrealized;
        const currentHoldings = allAssets.filter(h => h.qty > 0).sort((a,b)=>b.marketValue - a.marketValue);

        return { holdings: currentHoldings, allAssets: allAssets, sys, categoryStats };
      }, [transactions, cashFlows, marketPrices]);

      // --- 圖表元件 ---
      const DonutChart = ({ categoryStats, totalAssets }) => {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);
        useEffect(() => {
          if (!canvasRef.current || totalAssets === 0) return;
          if (chartInstance.current) chartInstance.current.destroy();
          const validCats = Object.values(categoryStats).filter(c => c.value > 0);
          const ctx = canvasRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: validCats.map(c => c.label), datasets: [{ data: validCats.map(c => c.value), backgroundColor: validCats.map(c => c.color), borderWidth: 0 }] },
            options: { cutout: '75%', plugins: { legend: { display: false }, tooltip: { enabled: true } }, animation: { duration: 500 } }
          });
          return () => chartInstance.current?.destroy();
        }, [categoryStats, totalAssets]);
        
        if(totalAssets === 0) return <div className="w-32 h-32 rounded-full border-[10px] border-slate-100 mx-auto"></div>;
        return (
          <div className="relative w-40 h-40 mx-auto flex-shrink-0">
            <canvas ref={canvasRef}></canvas>
            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
              <span className="text-[10px] text-slate-400 font-bold mb-0.5 tracking-widest">總資產</span>
              <span className="text-lg font-bold text-slate-800 leading-none">{fmtM(totalAssets)}</span>
            </div>
          </div>
        );
      };

      const StockTrendChart = ({ asset }) => {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);
        const [chartData, setChartData] = useState(null);
        const [loadingChart, setLoadingChart] = useState(true);

        useEffect(() => {
          const fetchHistory = async () => {
            if (asset.assetType === 'FUND' || asset.assetType === 'CASH') { setLoadingChart(false); return; }
            try {
              let yfSymbol = asset.symbol;
              if (['TW_STOCK', 'TW_ETF'].includes(asset.assetType) && /^\d+$/.test(yfSymbol)) yfSymbol += '.TW';
              const url = `https://query2.finance.yahoo.com/v8/finance/chart/${yfSymbol}?interval=1d&range=1mo`;
              const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
              
              const res = await fetch(proxy);
              if (!res.ok) throw new Error('API failed');
              const data = await res.json();
              const timestamps = data.chart?.result?.[0]?.timestamp;
              const closes = data.chart?.result?.[0]?.indicators?.quote?.[0]?.close;
              
              if (timestamps && closes) {
                let validData = [];
                for(let i=0; i<timestamps.length; i++) { if(closes[i] !== null) validData.push({ t: timestamps[i], p: closes[i] }); }
                const dates = validData.map(d => { const dt = new Date(d.t * 1000); return `${dt.getMonth()+1}/${dt.getDate()}`; });
                const prices = validData.map(d => d.p);
                setChartData({ labels: dates, prices: prices });
              }
            } catch (e) { console.log('Chart API Error', e); }
            setLoadingChart(false);
          };
          fetchHistory();
        }, [asset.symbol]);

        useEffect(() => {
          if (!canvasRef.current || !chartData) return;
          if (chartInstance.current) chartInstance.current.destroy();
          const ctx = canvasRef.current.getContext('2d');
          const isUp = chartData.prices[chartData.prices.length-1] >= chartData.prices[0];
          const color = isUp ? '#E53935' : '#059669'; 

          chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: { labels: chartData.labels, datasets: [{ data: chartData.prices, borderColor: color, borderWidth: 2.5, pointRadius: 0, tension: 0.2 }] },
            options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } }, responsive: true, maintainAspectRatio: false }
          });
          return () => chartInstance.current?.destroy();
        }, [chartData]);

        if (loadingChart) return <div className="h-32 flex items-center justify-center text-sm text-slate-400">正在抓取近30日走勢...</div>;
        if (!chartData) return <div className="h-32 flex items-center justify-center text-sm text-slate-400 bg-slate-50 rounded-xl">API 限制或不支援此標的線圖</div>;
        return <div className="h-32 w-full"><canvas ref={canvasRef}></canvas></div>;
      };

      // --- 智慧匯入與對帳引擎 ---
      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setImportState({ status: 'processing', message: '正在分析檔案...' });

        try {
          let parsedTxs = [];
          if (file.type.startsWith('image/')) {
            setImportState({ status: 'processing', message: '啟動 AI 智能圖片識別...' });
            if(!localStorage.getItem('gemini_api_key')) {
                throw new Error("請先點擊右上角「設定」填寫 Gemini API Key，才能在外部網站使用圖片識別！");
            }
            const reader = new FileReader();
            reader.readAsDataURL(file);
            await new Promise((resolve, reject) => {
              reader.onload = async (ev) => {
                try {
                  const dataUrl = ev.target.result;
                  const mimeType = dataUrl.split(';')[0].split(':')[1];
                  const base64Data = dataUrl.split(',')[1];
                  const results = await callGeminiWithRetry(base64Data, mimeType);
                  
                  results.forEach(res => {
                    if (res && (res.name || res.symbol) && res.date) {
                      let assetType = 'TW_STOCK';
                      if (res.name && res.name.includes('基金')) assetType = 'FUND';
                      else if (res.symbol && ['0050','0056','00878','006208'].includes(res.symbol)) assetType = 'TW_ETF';
                      parsedTxs.push({ ...res, assetType, strategy: '智能圖片匯入', confidence: 3, reason: '' });
                    }
                  });
                  resolve();
                } catch(err) { reject(err); }
              };
            });
          } else if (file.name.endsWith('.csv')) {
            setImportState({ status: 'processing', message: '正在解析 CSV 對帳單...' });
            const text = await file.text();
            const lines = text.split('\n').filter(l => l.trim());
            const headerIdx = lines.findIndex(l => l.includes('股名') && l.includes('日期'));
            if (headerIdx === -1) throw new Error('找不到正確的標題列 (股名,日期...)');
            
            for (let i = headerIdx + 1; i < lines.length; i++) {
                const cols = parseCSVLine(lines[i]);
                if (cols.length >= 9 && cols[0]) {
                    const type = cols[4].includes('買') ? 'buy' : 'sell';
                    const date = cols[1].replace(/\//g, '-');
                    const name = cols[0];
                    let assetType = name.includes('基金') ? 'FUND' : 'TW_STOCK';
                    
                    parsedTxs.push({
                        name: name, symbol: '', date: date,
                        shares: parseFloat(cols[2]) || 0,
                        netAmount: Math.abs(parseFloat(cols[3].replace(/,/g,''))) || 0,
                        type: type, price: parseFloat(cols[5]) || 0,
                        fee: parseFloat(cols[7]) || 0, tax: parseFloat(cols[8]) || 0,
                        assetType: assetType, strategy: 'CSV 對帳單匯入'
                    });
                }
            }
          } else { throw new Error('不支援的檔案格式。'); }

          if(parsedTxs.length === 0) throw new Error('檔案中未能解析出任何交易紀錄。');

          const dbHashes = transactions.map(getTxHash);
          let minDate = '9999-99-99', maxDate = '0000-00-00';
          parsedTxs.forEach(tx => {
             if(tx.date < minDate) minDate = tx.date;
             if(tx.date > maxDate) maxDate = tx.date;
          });

          let toAdd = [], duplicates = [];
          parsedTxs.forEach(tx => {
             if(dbHashes.includes(getTxHash(tx))) duplicates.push(tx);
             else toAdd.push(tx);
          });

          const fileHashes = parsedTxs.map(getTxHash);
          const orphans = transactions.filter(tx => {
             if (tx.date >= minDate && tx.date <= maxDate) return !fileHashes.includes(getTxHash(tx));
             return false;
          });

          setReconData({ toAdd, duplicates, orphans });
          setImportState({ status: 'review', message: '比對完成，請確認匯入結果。' });

        } catch (error) {
          console.error(error);
          setImportState({ status: 'error', message: error.message || '檔案解析過程中發生錯誤。' });
        }
      };

      const confirmImport = async () => {
        setImportState({ status: 'processing', message: `正在寫入 ${reconData.toAdd.length} 筆資料...` });
        for (let tx of reconData.toAdd) {
            tx.createdAt = new Date().toISOString();
            await db.collection('users').doc(user.uid).collection('transactions').add(tx);
        }
        setImportState({ status: 'success', message: `匯入成功！已安全加入庫存。` });

      // --- 表單與操作 ---

      const openTradeModal = (tx = null) => {

                      </div>

                      {/* 準備新增 */}
                      <div className="border border-[#10b981] rounded-xl overflow-hidden">
                        <div className="bg-[#10b981]/10 px-4 py-2 font-bold text-[#059669] flex justify-between">
                          <span>🟢 準備新增 (新紀錄)</span><span>{reconData.toAdd.length} 筆</span>
                        </div>
                        {reconData.toAdd.length > 0 && (
                          <div className="max-h-40 overflow-y-auto p-2 bg-white text-xs divide-y divide-slate-50">
                            {reconData.toAdd.map((tx, idx) => (
                              <div key={idx} className="py-2 px-2 flex justify-between text-slate-600">
                                <span>{tx.date} | {tx.type==='buy'?'買':'賣'} {tx.name||tx.symbol}</span>
                                <span className="font-mono">{tx.shares}股 @ ${tx.price}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* 幽靈警示 */}
                      {reconData.orphans.length > 0 && (
                        <div className="border border-[#f59e0b] rounded-xl overflow-hidden">
                          <div className="bg-[#f59e0b]/10 px-4 py-2 font-bold text-[#d97706] flex justify-between">
                            <span>🟡 幽靈提醒 (對帳單沒寫，但資料庫有)</span><span>{reconData.orphans.length} 筆</span>
                          </div>
                          <div className="max-h-40 overflow-y-auto p-2 bg-white text-xs divide-y divide-slate-50">
                            <p className="px-2 py-1 text-slate-400 italic mb-1">注意：這些是你過去「手動記的帳」，但在這次匯入的日期範圍內，對帳單上找不到它們！請在匯入後自行至明細中確認是否刪除。</p>
                            {reconData.orphans.map((tx, idx) => (
                              <div key={idx} className="py-2 px-2 flex justify-between text-slate-600">
                                <span>{tx.date} | {tx.type==='buy'?'買':'賣'} {tx.name||tx.symbol}</span>
                                <span className="font-mono text-amber-600">可能為手滑多記</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* 略過重複 */}
                      {reconData.duplicates.length > 0 && (
                        <div className="border border-slate-200 rounded-xl overflow-hidden">
                          <div className="bg-slate-100 px-4 py-2 font-bold text-slate-500 flex justify-between">
                            <span>⚪ 略過重複 (資料庫已存在)</span><span>{reconData.duplicates.length} 筆</span>
                          </div>
                        </div>
                      )}

                      <div className="flex gap-2 pt-4">
                        <button onClick={()=>setImportState({status:'idle',message:''})} className="flex-1 bg-slate-100 text-[#2C3E50] font-bold py-3.5 rounded-xl hover:bg-slate-200">取消重來</button>
                        <button onClick={confirmImport} disabled={reconData.toAdd.length === 0} className={`flex-1 font-bold py-3.5 rounded-xl text-white ${reconData.toAdd.length > 0 ? 'bg-[#3B82F6] hover:bg-blue-600 shadow-md' : 'bg-blue-300 cursor-not-allowed'}`}>
                          {reconData.toAdd.length > 0 ? '確認匯入' : '無新資料可匯入'}
                        </button>
                      </div>
                    </div>
                  )}

                  {(importState.status === 'success' || importState.status === 'error') && (
                    <div className="py-8 flex flex-col items-center text-center">
                      <div className={`w-12 h-12 rounded-full flex items-center justify-center mb-4 text-white ${importState.status === 'success' ? 'bg-[#10b981]' : 'bg-[#ef4444]'}`}>
                        {importState.status === 'success' ? <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 6L9 17l-5-5"/></svg> : <IconX />}
                      </div>
                      <p className="font-bold text-lg text-[#2C3E50] mb-2">{importState.status === 'success' ? '匯入完成' : '發生錯誤'}</p>
                      <p className="text-sm text-[#7F8C8D] mb-6">{importState.message}</p>
                      <button onClick={()=>{setImportState({status:'idle', message:''}); setIsImportModalOpen(false);}} className="w-full bg-slate-100 text-[#2C3E50] font-bold py-3.5 rounded-xl hover:bg-slate-200 transition-colors">關閉視窗</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
