<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投資回測紀錄 App</title>
  
  <!-- Tailwind CSS 美化套件 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 核心套件 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel 翻譯機 (讓瀏覽器看得懂 React) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase 雲端資料庫套件 (使用相容版以便單檔運行) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

</head>
<body>
  <!-- APP 會渲染在這個 div 裡面 -->
  <div id="root"></div>

  <!-- 這裡開始是你的 APP 程式碼 (必須標明 type="text/babel") -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 1. 初始化你的 Firebase (使用你截圖中的專屬設定)
    const firebaseConfig = {
      apiKey: "AIzaSyBrLbe2Qx_k-icTv61SQNBw7n4hIcYBCiE",
      authDomain: "my-stock-tracker-f3065.firebaseapp.com",
      projectId: "my-stock-tracker-f3065",
      storageBucket: "my-stock-tracker-f3065.firebasestorage.app",
      messagingSenderId: "802802972309",
      appId: "1:802802972309:web:70c2eadc6b040689834d9c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // 2. APP 主程式
    function App() {
      const [user, setUser] = useState(null);
      const [transactions, setTransactions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        symbol: '',
        type: 'buy',
        price: '',
        amount: '',
        notes: ''
      });

      // 監聽登入狀態
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      // 抓取雲端資料
      useEffect(() => {
        if (!user) return;
        setLoading(true);
        // 路徑: users / [使用者ID] / transactions
        const txRef = db.collection('users').doc(user.uid).collection('transactions');
        const unsubscribe = txRef.onSnapshot((snapshot) => {
          const txData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          // 依照日期由新到舊排序
          txData.sort((a, b) => new Date(b.date) - new Date(a.date));
          setTransactions(txData);
          setLoading(false);
        });
        return () => unsubscribe();
      }, [user]);

      // 計算庫存與損益
      const portfolio = useMemo(() => {
        let holdings = {};
        let totalRealizedProfit = 0;
        let totalInvested = 0;

        // 計算成本必須由舊到新
        const chronologicalTx = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));

        chronologicalTx.forEach(tx => {
          if (!holdings[tx.symbol]) {
            holdings[tx.symbol] = { symbol: tx.symbol, units: 0, avgCost: 0, realizedProfit: 0 };
          }
          let h = holdings[tx.symbol];
          let units = parseFloat(tx.units) || 0;
          let price = parseFloat(tx.price) || 0;
          let amount = parseFloat(tx.amount) || 0;

          if (tx.type === 'buy') {
            let newTotalCost = (h.units * h.avgCost) + amount;
            h.units += units;
            h.avgCost = h.units > 0 ? newTotalCost / h.units : 0;
          } else if (tx.type === 'sell') {
            let profitFromTrade = (price - h.avgCost) * units;
            h.realizedProfit += profitFromTrade;
            totalRealizedProfit += profitFromTrade;
            h.units -= units;
            if (h.units <= 0.0001) { h.units = 0; h.avgCost = 0; }
          }
        });

        const activeHoldings = Object.values(holdings).filter(h => h.units > 0 || h.realizedProfit !== 0);
        activeHoldings.forEach(h => { totalInvested += (h.units * h.avgCost); });

        return { activeHoldings, totalRealizedProfit, totalInvested };
      }, [transactions]);

      // 登入登出功能
      const handleLogin = async () => {
        try { await auth.signInWithPopup(googleProvider); } 
        catch (error) { alert("登入失敗，請重試"); console.error(error); }
      };

      const handleLogout = () => auth.signOut();

      // 表單功能
      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!user) return;
        const price = parseFloat(formData.price);
        const amount = parseFloat(formData.amount);
        if (isNaN(price) || isNaN(amount) || price <= 0 || amount <= 0) {
          alert("請輸入有效的價格和金額"); return;
        }
        
        const units = amount / price;
        const txRef = db.collection('users').doc(user.uid).collection('transactions').doc(); // 自動產生 ID
        await txRef.set({ ...formData, price, amount, units, createdAt: new Date().toISOString() });
        
        setIsModalOpen(false);
        setFormData({ ...formData, symbol: '', price: '', amount: '', notes: '' });
      };

      const handleDelete = async (id) => {
        if (!user) return;
        await db.collection('users').doc(user.uid).collection('transactions').doc(id).delete();
      };

      // 匯出 CSV
      const handleExportCSV = () => {
        const headers = ["日期", "標的代號", "操作", "單價", "單位數", "總金額", "備註"];
        const rows = transactions.map(tx => [
          tx.date, tx.symbol, tx.type === 'buy' ? '買入' : '賣出',
          tx.price.toFixed(2), tx.units.toFixed(4), tx.amount.toFixed(2), tx.notes || ''
        ]);
        const csvContent = [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `投資紀錄_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 畫面渲染 --- 載入中
      if (loading) return <div className="flex h-screen items-center justify-center bg-gray-50 text-gray-500 font-bold">載入中...</div>;

      // 畫面渲染 --- 未登入
      if (!user) {
        return (
          <div className="flex h-screen items-center justify-center bg-gray-100">
            <div className="bg-white p-8 rounded-2xl shadow-md text-center max-w-sm w-full mx-4">
              <div className="text-5xl mx-auto mb-4">📈</div>
              <h1 className="text-2xl font-bold mb-6 text-slate-800">投資回測紀錄 App</h1>
              <button onClick={handleLogin} className="w-full bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-full font-medium transition-colors shadow-sm">
                使用 Google 帳號登入
              </button>
            </div>
          </div>
        );
      }

      // 畫面渲染 --- 已登入
      return (
        <div className="min-h-screen bg-gray-100 flex flex-col font-sans">
          <header className="bg-slate-900 text-white shadow-md sticky top-0 z-10">
            <div className="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
              <div className="flex items-center gap-2">
                <span className="text-xl">📈</span>
                <h1 className="text-xl font-bold tracking-wider">投資回測紀錄</h1>
              </div>
              <div className="flex gap-2">
                <button onClick={() => setIsModalOpen(true)} className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-full flex items-center gap-2 text-sm font-medium transition-colors">
                  <span>➕</span>
                  <span className="hidden sm:inline">新增紀錄</span>
                </button>
                <button onClick={handleLogout} className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-full flex items-center transition-colors">
                  登出
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-4xl mx-auto w-full p-4 pb-24">
            {/* 分頁按鈕 */}
            <div className="flex space-x-2 mb-6 bg-white p-1 rounded-xl shadow-sm overflow-x-auto">
              <button onClick={() => setActiveTab('dashboard')} className={`flex-1 flex items-center justify-center gap-2 py-2 px-4 rounded-lg text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-slate-100 text-slate-900 shadow-sm' : 'text-gray-500 hover:text-slate-700 hover:bg-gray-50'}`}>📊 總覽與庫存</button>
              <button onClick={() => setActiveTab('history')} className={`flex-1 flex items-center justify-center gap-2 py-2 px-4 rounded-lg text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'history' ? 'bg-slate-100 text-slate-900 shadow-sm' : 'text-gray-500 hover:text-slate-700 hover:bg-gray-50'}`}>🕒 交易明細</button>
              <button onClick={() => setActiveTab('analysis')} className={`flex-1 flex items-center justify-center gap-2 py-2 px-4 rounded-lg text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'analysis' ? 'bg-slate-100 text-slate-900 shadow-sm' : 'text-gray-500 hover:text-slate-700 hover:bg-gray-50'}`}>📋 匯出與結算</button>
            </div>

            {/* 總覽頁面 */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                    <p className="text-sm text-gray-500 mb-1">累計已實現損益</p>
                    <h2 className={`text-3xl font-bold ${portfolio.totalRealizedProfit >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                      {portfolio.totalRealizedProfit >= 0 ? '+' : ''}{portfolio.totalRealizedProfit.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}
                    </h2>
                  </div>
                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                    <p className="text-sm text-gray-500 mb-1">目前投入總本金</p>
                    <h2 className="text-3xl font-bold text-slate-800">{portfolio.totalInvested.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</h2>
                  </div>
                </div>
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                  <div className="p-4 border-b border-gray-100 bg-slate-50"><h3 className="font-semibold text-slate-800">各標的績效與庫存</h3></div>
                  <div className="divide-y divide-gray-100">
                    {portfolio.activeHoldings.length === 0 ? ( <div className="p-8 text-center text-gray-400">目前無庫存紀錄</div> ) : (
                      portfolio.activeHoldings.map((h, i) => (
                        <div key={i} className="p-4 hover:bg-gray-50 flex flex-col sm:flex-row justify-between gap-4">
                          <div>
                            <div className="flex items-center gap-2"><span className="font-bold text-lg text-slate-900">{h.symbol}</span>{h.units > 0 && <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">持有中</span>}</div>
                            <div className="text-sm text-gray-500 mt-1">平均成本: {h.avgCost.toFixed(2)} | 庫存單位: {h.units.toFixed(2)}</div>
                          </div>
                          <div className="text-right">
                            <p className="text-sm text-gray-500">已實現獲利</p>
                            <p className={`font-semibold ${h.realizedProfit >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>{h.realizedProfit > 0 ? '+' : ''}{h.realizedProfit.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</p>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* 歷史紀錄 */}
            {activeTab === 'history' && (
              <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="p-4 border-b border-gray-100 bg-slate-50 flex justify-between items-center"><h3 className="font-semibold text-slate-800">所有交易紀錄</h3><span className="text-xs text-gray-500">共 {transactions.length} 筆</span></div>
                <div className="divide-y divide-gray-100">
                  {transactions.length === 0 ? ( <div className="p-8 text-center text-gray-400">無交易紀錄，點擊右上角新增</div> ) : (
                    transactions.map((tx) => (
                      <div key={tx.id} className="p-4 flex items-center justify-between hover:bg-gray-50 group">
                        <div className="flex items-start gap-4">
                          <div className={`mt-1 text-xl p-2 rounded-full ${tx.type === 'buy' ? 'bg-red-100' : 'bg-emerald-100'}`}>
                            {tx.type === 'buy' ? '📉' : '📈'}
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <span className={`text-sm font-bold px-2 py-0.5 rounded ${tx.type === 'buy' ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'}`}>{tx.type === 'buy' ? '買入' : '賣出'}</span>
                              <span className="font-bold text-slate-800">{tx.symbol}</span>
                            </div>
                            <div className="text-sm text-gray-500 mt-1 flex items-center gap-1">📅 {tx.date}</div>
                            {tx.notes && <div className="text-sm text-gray-400 mt-1">備註: {tx.notes}</div>}
                          </div>
                        </div>
                        <div className="text-right flex items-center gap-4">
                          <div>
                            <div className="font-semibold text-slate-900">總額: {tx.amount.toLocaleString()}</div>
                            <div className="text-xs text-gray-500">單價: {tx.price} | 單位: {tx.units.toFixed(2)}</div>
                          </div>
                          <button onClick={() => handleDelete(tx.id)} className="text-gray-300 hover:text-red-500 p-2 md:opacity-0 group-hover:opacity-100" title="刪除">🗑️</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* 匯出頁面 */}
            {activeTab === 'analysis' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                  <h3 className="text-lg font-semibold text-slate-800 mb-2">資料匯出</h3>
                  <p className="text-gray-500 text-sm mb-6">將交易紀錄匯出為 CSV 試算表，方便在 Excel 或 Google Sheets 進行分析。</p>
                  <button onClick={handleExportCSV} className="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white px-6 py-3 rounded-xl flex items-center justify-center gap-2 font-medium transition-colors">📥 匯出試算表 (.csv)</button>
                </div>
              </div>
            )}
          </main>

          {/* 新增紀錄的彈出視窗 */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl w-full max-w-md shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-slate-50">
                  <h3 className="font-bold text-lg text-slate-800">新增紀錄</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
                </div>
                <form onSubmit={handleSubmit} className="p-6 space-y-4 overflow-y-auto">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">交易日期</label>
                    <input type="date" name="date" required value={formData.date} onChange={handleInputChange} className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">操作類型</label>
                      <select name="type" value={formData.type} onChange={handleInputChange} className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                        <option value="buy">買入 (扣款)</option><option value="sell">賣出 (贖回)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">標的代號</label>
                      <input type="text" name="symbol" required placeholder="例如: 006208" value={formData.symbol} onChange={handleInputChange} className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none uppercase" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">成交單價</label>
                      <input type="number" step="0.01" name="price" required placeholder="例如: 150.5" value={formData.price} onChange={handleInputChange} className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">總金額</label>
                      <input type="number" step="1" name="amount" required placeholder="例如: 10000" value={formData.amount} onChange={handleInputChange} className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">備註</label>
                    <textarea name="notes" placeholder="例如: 定期定額扣款..." value={formData.notes} onChange={handleInputChange} rows="2" className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none resize-none"></textarea>
                  </div>
                  <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-colors mt-4">儲存紀錄</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 將 App 渲染到畫面上
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
