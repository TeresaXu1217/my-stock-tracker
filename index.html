    const IconPieChart = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;
    const IconDownload = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;

    const ASSET_COLORS = { TW_STOCK: '#1E3A8A', US_STOCK: '#3B82F6', TW_ETF: '#0D9488', FUND: '#6366F1', CASH: '#94A3B8' };
    const ASSET_LABELS = { TW_STOCK: '台股', US_STOCK: '美股', TW_ETF: 'ETF', FUND: '基金', CASH: '現金' };

    const fmtM = (num) => Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    const fmtDec = (num) => Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const getColorClass = (num) => num > 0 ? 'text-[#E53935]' : num < 0 ? 'text-[#059669]' : 'text-slate-500';
    const getTxHash = (tx) => `${tx.date}_${tx.name||tx.symbol}_${tx.type}_${tx.shares}`;

    const parseCSVLine = (text) => {
        let ret = [], p = '', quote = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            if (c === '"' && quote && text[i+1] === '"') { p += '"'; i++; }
            else if (c === '"') { quote = !quote; }
            else if (c === ',' && !quote) { ret.push(p); p = ''; }
            else { p += c; }
        }
        ret.push(p);
        return ret.map(s => s.trim());
    };

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    function App() {
      const [user, setUser] = useState(null);
      const [transactions, setTransactions] = useState([]);
      const [cashFlows, setCashFlows] = useState([]);
      const [marketPrices, setMarketPrices] = useState({});
      const [loading, setLoading] = useState(true);
      
      const [activeTab, setActiveTab] = useState('dashboard');
      
      const [isTradeModalOpen, setIsTradeModalOpen] = useState(false);
      const [editingTradeId, setEditingTradeId] = useState(null);
      const [tradeForm, setTradeForm] = useState({});
      const [isCashModalOpen, setIsCashModalOpen] = useState(false);
      const [cashForm, setCashForm] = useState({});

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [apiKeyInput, setApiKeyInput] = useState(localStorage.getItem('gemini_api_key') || '');

      const [isImportModalOpen, setIsImportModalOpen] = useState(false);
      const [importState, setImportState] = useState({ status: 'idle', message: '' }); 
      const [reconData, setReconData] = useState({ toAdd: [], duplicates: [], orphans: [] });

      const [selectedAsset, setSelectedAsset] = useState(null);
      const [manualPriceInput, setManualPriceInput] = useState('');
      const [isUpdatingPrices, setIsUpdatingPrices] = useState(false);

      const [inventorySort, setInventorySort] = useState('pnl_desc');
      const [historySort, setHistorySort] = useState('date_desc');

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        setLoading(true);
        const unsubTx = db.collection('users').doc(user.uid).collection('transactions').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a, b) => new Date(a.date) - new Date(b.date));
          setTransactions(data);
        });
        const unsubCash = db.collection('users').doc(user.uid).collection('cashFlows').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setCashFlows(data);
          setLoading(false);
        });
        const unsubPrice = db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').onSnapshot((doc) => {
          if (doc.exists) setMarketPrices(doc.data());
        });
        return () => { unsubTx(); unsubCash(); unsubPrice(); };
      }, [user]);

      const portfolio = useMemo(() => {
        let holdings = {};
        let sys = { 
            totalDeposits: 0, 
            totalWithdrawals: 0, 
            availableCash: 0, 
            totalRealized: 0, 
            totalUnrealized: 0, 
            totalMarketValue: 0,
            totalInventoryCost: 0,
            realizedLogs: [], // 收集所有已實現損益紀錄
            splitCache: {} // 記錄分割前取出的成本，準備給分割後用
        };
        
        let categoryStats = {
          TW_STOCK: { value: 0, color: ASSET_COLORS.TW_STOCK, label: ASSET_LABELS.TW_STOCK },
          US_STOCK: { value: 0, color: ASSET_COLORS.US_STOCK, label: ASSET_LABELS.US_STOCK },
          TW_ETF: { value: 0, color: ASSET_COLORS.TW_ETF, label: ASSET_LABELS.TW_ETF },
          FUND: { value: 0, color: ASSET_COLORS.FUND, label: ASSET_LABELS.FUND },
        };

        // 處理現金流
        cashFlows.forEach(cf => {
          const amt = parseFloat(cf.amount) || 0;
          if (cf.type === 'deposit') { sys.totalDeposits += amt; sys.availableCash += amt; }
          else if (cf.type === 'withdraw') { sys.totalWithdrawals += amt; sys.availableCash -= amt; }
          else if (cf.type === 'dividend') { sys.availableCash += amt; sys.totalRealized += amt; }
        });
        sys.netPrincipal = sys.totalDeposits - sys.totalWithdrawals;

        // 處理交易紀錄 (核心引擎升級：支援 分割 / 一般除息)
        transactions.forEach(tx => {
          let sym = tx.symbol || tx.name;
          if (!holdings[sym]) { 
            holdings[sym] = { 
                symbol: sym, name: tx.name, assetType: tx.assetType || 'TW_STOCK', 
                qty: 0, totalCost: 0, avgCost: 0, realizedProfit: 0, realizedTotalCost: 0, buyQueue: [] 
            }; 
          }
          let h = holdings[sym];
          let qty = parseFloat(tx.shares) || 0;
          let netAmount = parseFloat(tx.netAmount) || 0;
          let fee = parseFloat(tx.fee) || 0;
          let tax = parseFloat(tx.tax) || 0;
          const logDate = tx.date || '';

          if (tx.type === 'buy') {
            h.qty += qty; h.totalCost += netAmount; h.avgCost = h.totalCost / h.qty;
            sys.availableCash -= netAmount;
            h.buyQueue.push({ qty, netAmount });
          } else if (tx.type === 'dividend_reinvest') {
            h.qty += qty; h.avgCost = h.totalCost / h.qty;
            h.buyQueue.push({ qty, netAmount: 0 }); 
          } else if (tx.type === 'split_in') { // 分割後增股 (完美承接剛才 split_out 拿出來的成本)
            let carryCost = sys.splitCache[sym] || 0;
            sys.splitCache[sym] = 0; 
            h.qty += qty; h.totalCost += carryCost; h.avgCost = h.totalCost / h.qty;
            h.buyQueue.push({ qty, netAmount: carryCost });
          } else if (tx.type === 'sell' || tx.type === 'split_out') {
            let remainingToSell = qty; let realizedCost = 0;
            while (remainingToSell > 0 && h.buyQueue.length > 0) {
              let b = h.buyQueue[0];
              if (b.qty <= remainingToSell) { realizedCost += b.netAmount; remainingToSell -= b.qty; h.buyQueue.shift(); } 
              else { realizedCost += (b.netAmount / b.qty) * remainingToSell; b.qty -= remainingToSell; b.netAmount -= (b.netAmount / (b.qty + remainingToSell)) * remainingToSell; remainingToSell = 0; }
            }
            
            if (tx.type === 'sell') {
                let profit = netAmount - realizedCost;
                h.realizedProfit += profit; 
                h.realizedTotalCost += realizedCost;
                sys.totalRealized += profit; 
                sys.availableCash += netAmount;
                
                sys.realizedLogs.push({
                    id: tx.id, date: logDate, symbol: h.symbol, name: h.name,
                    profit: profit, buyCost: realizedCost, sellAmount: netAmount, fee: fee, tax: tax, action: '賣出'
                });
            } else if (tx.type === 'split_out') { // 分割前減股 (不認列損益，僅把成本拿出來給 split_in 攤平用)
                sys.splitCache[sym] = (sys.splitCache[sym] || 0) + realizedCost;
            }
            
            h.qty -= qty; h.totalCost -= realizedCost;
            if (h.qty <= 0.0001) { h.qty = 0; h.totalCost = 0; h.avgCost = 0; h.buyQueue = []; }
          } else if (tx.type === 'dividend_cash') {
              // 一般除息 (領取現金股利，股數不變)
              h.realizedProfit += netAmount;
              sys.totalRealized += netAmount;
              sys.availableCash += netAmount;
              sys.realizedLogs.push({
                  id: tx.id, date: logDate, symbol: h.symbol, name: h.name,
                  profit: netAmount, buyCost: 0, sellAmount: netAmount, fee: fee, tax: tax, action: '一般除息'
              });
          }
        });

        const allAssets = Object.values(holdings).filter(h => h.qty > 0 || h.realizedProfit !== 0); 
        
        // 結算所有資產 (總市值 = 總庫存現值)
        allAssets.forEach(h => {
          if (h.qty > 0) {
            let currentPrice = marketPrices[h.symbol] || h.avgCost;
            let marketValue = h.qty * currentPrice;
            let unrealized = marketValue - h.totalCost;
            h.currentPrice = currentPrice; 
            h.marketValue = marketValue; 
            h.unrealized = unrealized;
            
            h.roi = h.totalCost > 0 ? (unrealized / h.totalCost) * 100 : 0;
            
            sys.totalMarketValue += marketValue; 
            sys.totalUnrealized += unrealized;
            sys.totalInventoryCost += h.totalCost;
            
            if(categoryStats[h.assetType]) categoryStats[h.assetType].value += marketValue;
          } else { 
              h.currentPrice = 0; h.marketValue = 0; h.unrealized = 0; h.roi = 0; 
          }
          h.historicalRoi = h.realizedTotalCost > 0 ? (h.realizedProfit / h.realizedTotalCost) * 100 : 0;
        });

        sys.totalPnl = sys.totalRealized + sys.totalUnrealized;
        sys.unrealizedRoi = sys.totalInventoryCost > 0 ? (sys.totalUnrealized / sys.totalInventoryCost) * 100 : 0;

        let currentHoldings = allAssets.filter(h => h.qty > 0);
        
        // 庫存排序邏輯
        currentHoldings.sort((a, b) => {
            if (inventorySort === 'pnl_desc') return b.unrealized - a.unrealized;
            if (inventorySort === 'pnl_asc') return a.unrealized - b.unrealized;
            if (inventorySort === 'qty_desc') return b.qty - a.qty;
            if (inventorySort === 'symbol_asc') return a.symbol.localeCompare(b.symbol);
            return b.marketValue - a.marketValue; // default
        });
        
        const groupedHoldings = currentHoldings.reduce((acc, h) => {
            if (!acc[h.assetType]) acc[h.assetType] = [];
            acc[h.assetType].push(h);
            return acc;
        }, {});

        return { holdings: currentHoldings, groupedHoldings, allAssets, sys, categoryStats };
      }, [transactions, cashFlows, marketPrices, inventorySort]);

      // 已實現損益分類邏輯
      const realizedData = useMemo(() => {
          let summary = {
              total: { profit: 0, buyCost: 0, sellAmount: 0, fee: 0, tax: 0, items: [] },
              thisYear: { profit: 0, buyCost: 0, sellAmount: 0, fee: 0, tax: 0, items: [] },
              thisMonth: { profit: 0, buyCost: 0, sellAmount: 0, fee: 0, tax: 0, items: [] }
          };
          
          const now = new Date();
          const currentYear = now.getFullYear().toString();
          const currentMonth = (now.getMonth() + 1).toString().padStart(2, '0');
          const currentYm = `${currentYear}-${currentMonth}`;

          portfolio.sys.realizedLogs.forEach(log => {
              // 總體
              summary.total.profit += log.profit; summary.total.buyCost += log.buyCost; summary.total.sellAmount += log.sellAmount; summary.total.fee += log.fee; summary.total.tax += log.tax;
              summary.total.items.push(log);
              
              const logDate = log.date || ''; // 防止無 date 造成白屏
              const logYear = logDate.substring(0, 4);
              const logYm = logDate.substring(0, 7);
              
              // 本年
              if (logYear === currentYear) {
                  summary.thisYear.profit += log.profit; summary.thisYear.buyCost += log.buyCost; summary.thisYear.sellAmount += log.sellAmount; summary.thisYear.fee += log.fee; summary.thisYear.tax += log.tax;
                  summary.thisYear.items.push(log);
              }
              // 本月
              if (logYm === currentYm) {
                  summary.thisMonth.profit += log.profit; summary.thisMonth.buyCost += log.buyCost; summary.thisMonth.sellAmount += log.sellAmount; summary.thisMonth.fee += log.fee; summary.thisMonth.tax += log.tax;
                  summary.thisMonth.items.push(log);
              }
          });
          
          summary.total.items.sort((a,b) => new Date(b.date) - new Date(a.date));
          summary.thisYear.items.sort((a,b) => new Date(b.date) - new Date(a.date));
          summary.thisMonth.items.sort((a,b) => new Date(b.date) - new Date(a.date));

          return summary;
      }, [portfolio.sys.realizedLogs]);

      const DonutChart = ({ categoryStats, totalAssets }) => {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);
        useEffect(() => {
          if (!canvasRef.current || totalAssets === 0) return;
          if (chartInstance.current) chartInstance.current.destroy();
          const validCats = Object.values(categoryStats).filter(c => c.value > 0);
          const ctx = canvasRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: validCats.map(c => c.label), datasets: [{ data: validCats.map(c => c.value), backgroundColor: validCats.map(c => c.color), borderWidth: 0 }] },
            options: { cutout: '75%', plugins: { legend: { display: false }, tooltip: { enabled: true } }, animation: { duration: 500 } }
          });
          return () => chartInstance.current?.destroy();
        }, [categoryStats, totalAssets]);
        
        if(totalAssets === 0) return <div className="w-32 h-32 rounded-full border-[10px] border-slate-100 mx-auto"></div>;
        return (
          <div className="relative w-40 h-40 mx-auto flex-shrink-0">
            <canvas ref={canvasRef}></canvas>
            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
              <span className="text-[10px] text-slate-400 font-bold mb-0.5 tracking-widest">總市值</span>
              <span className="text-lg font-bold text-slate-800 leading-none">{fmtM(totalAssets)}</span>
            </div>
          </div>
        );
      };

      const handleUpdatePrices = async () => {
          setIsUpdatingPrices(true);
          const newPrices = { ...marketPrices };
          
          for (let h of portfolio.holdings) {
              if (h.assetType === 'FUND') continue; // 基金由手動輸入
              try {
                  let querySymbol = h.symbol;
                  if (['TW_STOCK', 'TW_ETF'].includes(h.assetType) && /^[0-9A-Za-z]+$/.test(querySymbol) && !querySymbol.includes('.')) {
                      querySymbol += '.TW';
                  }
                  
                  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${querySymbol}?interval=1d&range=1d`;
                  const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                  
                  const res = await fetch(proxyUrl);
                  if (res.ok) {
                      const data = await res.json();
                      const price = data.chart?.result?.[0]?.meta?.regularMarketPrice;
                      if (price) {
                          newPrices[h.symbol] = price;
                      }
                  }
              } catch (err) {
                  console.log(`Failed to update price for ${h.symbol}`);
              }
          }
          
          await db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').set(newPrices, { merge: true });
          setIsUpdatingPrices(false);
      };

      // 自動記憶與防呆機制
      const handleSymbolBlur = async (e) => {
          const sym = e.target.value.trim().toUpperCase();
          if (!sym) return; 
          
          // 1. 歷史記憶優先 (防呆)
          const pastTx = transactions.find(t => (t.symbol === sym) && t.name);
          if (pastTx) {
              if (tradeForm.name && tradeForm.name !== pastTx.name) {
                  alert(`⚠️ 系統提示：\n\n您輸入的代號 ${sym} 在歷史紀錄中名為「${pastTx.name}」。\n為避免資料分裂，系統已自動為您帶入歷史名稱！`);
              }
              setTradeForm(prev => ({...prev, name: pastTx.name, assetType: pastTx.assetType}));
              return; // 已找到歷史紀錄，跳過 API 查詢
          }

          // 2. 靜態字典
          if (STOCK_DICTIONARY[sym]) {
              setTradeForm(prev => ({...prev, name: STOCK_DICTIONARY[sym].name, assetType: STOCK_DICTIONARY[sym].category}));
              return;
          }
          
          // 3. API 自動查詢
          try {
              let query = sym;
              if (/^[0-9]+$/.test(sym)) query += '.TW';
              
              const url = `https://query2.finance.yahoo.com/v1/finance/search?q=${query}`;
              const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
              
              const res = await fetch(proxyUrl);
              const data = await res.json();
              if (data.quotes && data.quotes.length > 0) {
                  const foundName = data.quotes[0].shortname || data.quotes[0].longname;
                  const typeDisp = data.quotes[0].exchange;
                  
                  let assetType = tradeForm.assetType;
                  if (typeDisp === 'TAI' || typeDisp === 'TWO') assetType = foundName.includes('ETF') ? 'TW_ETF' : 'TW_STOCK';
                  else if (['NYQ', 'NMS', 'NGM', 'BATS'].includes(typeDisp)) assetType = 'US_STOCK';
                  
                  if (foundName) {
                      setTradeForm(prev => ({...prev, name: foundName, assetType}));
                  }
              } else {
                  setTradeForm(prev => ({...prev, name: sym}));
              }
          } catch (err) {
              setTradeForm(prev => ({...prev, name: sym}));
          }
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setImportState({ status: 'processing', message: '正在分析檔案...' });

        try {
          let parsedTxs = [];
          if (file.name.endsWith('.csv')) {
            setImportState({ status: 'processing', message: '正在解析 CSV 檔案...' });
            const text = await file.text();
            const lines = text.split('\n').filter(l => l.trim());
            
            // 判斷是否為特殊複委託對帳單
            if (lines[0].includes('代號') && lines[0].includes('原幣應收付金額')) {
                const h = parseCSVLine(lines[0]);
                const symIdx = h.indexOf('代號');
                const nameIdx = h.indexOf('股票名稱');
                const dateIdx = h.indexOf('交易日期');
                const typeIdx = h.indexOf('買賣別');
                const qtyIdx = h.indexOf('股數');
                const priceIdx = h.indexOf('成交價');
                const feeIdx = h.indexOf('手續費');
                const otherFeeIdx = h.indexOf('其他費用');
                const netIdx = h.indexOf('原幣應收付金額');

                for (let i=1; i<lines.length; i++) {
                    const cols = parseCSVLine(lines[i]);
                    if (!cols[symIdx]) continue;

                    let typeStr = cols[typeIdx] || '';
                    let type = '';
                    
                    // 智慧轉換五大交易類型
                    if (typeStr.includes('買')) type = 'buy';
                    else if (typeStr.includes('賣')) type = 'sell';
                    else if (typeStr.includes('一般除息')) type = 'dividend_cash';
                    else if (typeStr.includes('分割後')) type = 'split_in';
                    else if (typeStr.includes('分割前')) type = 'split_out';
                    else continue; 

                    let shares = Math.abs(parseFloat(cols[qtyIdx])) || 0;
                    let price = parseFloat(cols[priceIdx]) || 0;
                    let fee = parseFloat(cols[feeIdx]) || 0;
                    let tax = parseFloat(cols[otherFeeIdx]) || 0;
                    let netAmount = Math.abs(parseFloat(cols[netIdx])) || 0;
                    
                    // 特殊防呆 (避免檔案缺漏資料)
                    if (netAmount === 0 && shares > 0 && price > 0 && type !== 'split_in' && type !== 'split_out') {
                        netAmount = shares * price;
                    }
                    if (type === 'dividend_cash') shares = 0; // 現金股息不增減股數

                    let date = cols[dateIdx].replace(/\//g, '-');

                    parsedTxs.push({
                        name: cols[nameIdx] || cols[symIdx],
                        symbol: cols[symIdx],
                        date: date,
                        shares: shares,
                        price: price,
                        fee: fee,
                        tax: tax,
                        netAmount: netAmount,
                        type: type,
                        assetType: 'US_STOCK',
                        strategy: '複委託匯入'
                    });
                }
            } else {
                // 台股格式
                const headerIdx = lines.findIndex(l => l.includes('股名') && l.includes('日期'));
                if (headerIdx === -1) throw new Error('找不到正確的標題列 (股名,日期...)');
                for (let i = headerIdx + 1; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i]);
                    if (cols.length >= 9 && cols[0]) {
                        const typeStr = cols[4];
                        let type = typeStr.includes('買') ? 'buy' : 'sell';
                        if (typeStr.includes('息')) type = 'dividend_cash';

                        const date = cols[1].replace(/\//g, '-');
                        const name = cols[0];
                        let assetType = name.includes('基金') ? 'FUND' : 'TW_STOCK';
                        
                        parsedTxs.push({
                            name: name, symbol: '', date: date,
                            shares: parseFloat(cols[2]) || 0,
                            netAmount: Math.abs(parseFloat(cols[3].replace(/,/g,''))) || 0,
                            type: type, price: parseFloat(cols[5]) || 0,
                            fee: parseFloat(cols[7]) || 0, tax: parseFloat(cols[8]) || 0,
                            assetType: assetType, strategy: 'CSV 對帳單匯入'
                        });
                    }
                }
            }
          } else { throw new Error('不支援的檔案格式，請上傳 CSV'); }

          if(parsedTxs.length === 0) throw new Error('檔案中未能解析出任何交易紀錄。');

          const dbHashes = transactions.map(getTxHash);
          let minDate = '9999-99-99', maxDate = '0000-00-00';
          parsedTxs.forEach(tx => {
             if(tx.date < minDate) minDate = tx.date;
             if(tx.date > maxDate) maxDate = tx.date;
          });

          let toAdd = [], duplicates = [];
          parsedTxs.forEach(tx => {
             if(dbHashes.includes(getTxHash(tx))) duplicates.push(tx);
             else toAdd.push(tx);
          });

          setReconData({ toAdd, duplicates, orphans: [] });
          setImportState({ status: 'review', message: '比對完成，請確認匯入結果。' });

        } catch (error) {
          setImportState({ status: 'error', message: error.message || '檔案解析過程中發生錯誤。' });
        }
      };

      const confirmImport = async () => {
        setImportState({ status: 'processing', message: `正在寫入 ${reconData.toAdd.length} 筆資料...` });
        for (let tx of reconData.toAdd) {
            tx.createdAt = new Date().toISOString();
            await db.collection('users').doc(user.uid).collection('transactions').add(tx);
        }
        setImportState({ status: 'success', message: `匯入成功！已安全加入庫存。` });

      const handleLogin = async () => { try { await auth.signInWithPopup(googleProvider); } catch (e) { alert("登入失敗"); } };
      
      const openTradeModal = (tx = null, defaultStrategy = '波段操作') => {

        }
        setIsTradeModalOpen(true);
      };

      const handleTradeChange = (e) => {
        const { name, value } = e.target;
        let newData = { ...tradeForm, [name]: value };
        
        if (newData.isFundMode) {
          const amount = parseFloat(newData.amount) || 0; const price = parseFloat(newData.price) || 0;
          if (amount > 0 && price > 0) { newData.shares = (amount / price).toFixed(5); newData.netAmount = amount.toFixed(2); } 
          else { newData.shares = ''; newData.netAmount = ''; }
        } else {
          // 動態計算淨收付金額 (根據選擇的五大交易別)
          const price = parseFloat(newData.price) || 0; const shares = parseFloat(newData.shares) || 0;
          const fee = parseFloat(newData.fee) || 0; const tax = parseFloat(newData.tax) || 0;
          
          if (newData.type === 'dividend_cash') {
              newData.netAmount = (price * shares - fee - tax).toFixed(2); // 當成總配息輸入
          } else if (newData.type === 'split_in' || newData.type === 'split_out') {
              newData.netAmount = '0.00';
              newData.price = '0';
              newData.fee = '0';
              newData.tax = '0';
          } else if (price > 0 && shares > 0) { 
              newData.netAmount = newData.type === 'buy' ? (price * shares + fee + tax).toFixed(2) : (price * shares - fee - tax).toFixed(2); 
          } else { 
              newData.netAmount = ''; 
          }
        }
        setTradeForm(newData);
      };

      const handleTradeSubmit = async (e) => {
        e.preventDefault();
        let payload = { 
          ...tradeForm, symbol: tradeForm.symbol?.toUpperCase() || tradeForm.name, 
          price: parseFloat(tradeForm.price)||0, shares: parseFloat(tradeForm.shares)||0, 
          fee: parseFloat(tradeForm.fee)||0, tax: parseFloat(tradeForm.tax)||0, netAmount: parseFloat(tradeForm.netAmount)||0 
        };
        if (payload.isFundMode) payload.assetType = 'FUND';

        if (editingTradeId) await db.collection('users').doc(user.uid).collection('transactions').doc(editingTradeId).update(payload);
        else { payload.createdAt = new Date().toISOString(); await db.collection('users').doc(user.uid).collection('transactions').add(payload); }
        setIsTradeModalOpen(false);
      };

      const exportRealizedCSV = (dataItems, periodName) => {
          let csv = '\uFEFF'; 
          csv += '交易日期,資產分類,股票代號,股票名稱,交易類型,買進成本,淨收款金額,手續費,交易稅,已實現損益\n';
          dataItems.forEach(d => {
              csv += `${d.date},已實現,${d.symbol},${d.name},${d.action},${d.buyCost.toFixed(2)},${d.sellAmount.toFixed(2)},${d.fee.toFixed(2)},${d.tax.toFixed(2)},${d.profit.toFixed(2)}\n`;
          });
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `已實現損益_${periodName}.csv`;
          a.click();
      };

      const getTypeMeta = (type) => {
          switch(type) {
              case 'buy': return { label: '買', style: 'bg-red-50 text-red-600 border-red-100' };
              case 'sell': return { label: '賣', style: 'bg-emerald-50 text-emerald-600 border-emerald-100' };

              case 'split_in': return { label: '增', style: 'bg-indigo-50 text-indigo-600 border-indigo-100' };
              case 'split_out': return { label: '減', style: 'bg-amber-50 text-amber-600 border-amber-100' };
              case 'dividend_reinvest': return { label: '配', style: 'bg-blue-50 text-blue-600 border-blue-100' };
              default: return { label: '易', style: 'bg-slate-50 text-slate-600 border-slate-100' };
          }
      };

      if (loading) return <div className="flex h-screen items-center justify-center bg-[#F4F7F9] text-[#7F8C8D] font-bold">載入中...</div>;
      if (!user) {
        return (
          <div className="flex h-screen items-center justify-center bg-[#F4F7F9] p-6">
            <div className="w-full max-w-sm text-center bento-card p-10 shadow-xl">
              <div className="w-20 h-20 bg-[#2C3E50] text-white rounded-[1.5rem] mx-auto flex items-center justify-center mb-6 shadow-lg"><IconBank /></div>
              <h1 className="text-3xl font-extrabold mb-2 text-[#2C3E50] tracking-tight">資產大台</h1>
              <p className="text-[#7F8C8D] mb-8 font-medium">冷色系極簡，防呆資金流</p>
              <button onClick={handleLogin} className="w-full bg-[#2C3E50] text-white px-6 py-4 rounded-xl font-bold shadow-md hover:bg-[#1a252f] transition-all">安全登入系統</button>
            </div>
          </div>
        );
      }

      const TAB_ORDER = ['FUND', 'TW_ETF', 'TW_STOCK', 'US_STOCK'];

      let sortedHistory = [...transactions];
      if (historySort === 'date_desc') sortedHistory.sort((a, b) => new Date(b.date) - new Date(a.date));
      else if (historySort === 'date_asc') sortedHistory.sort((a, b) => new Date(a.date) - new Date(b.date));
      else if (historySort === 'symbol_asc') sortedHistory.sort((a, b) => (a.symbol||a.name).localeCompare(b.symbol||b.name));
      else if (historySort === 'symbol_desc') sortedHistory.sort((a, b) => (b.symbol||b.name).localeCompare(a.symbol||a.name));
      else if (historySort === 'shares_desc') sortedHistory.sort((a, b) => parseFloat(b.shares) - parseFloat(a.shares));

      return (
        <div className="min-h-screen max-w-5xl mx-auto md:pt-6">
          
          <nav className="bg-white/90 backdrop-blur-md sticky top-0 z-20 md:rounded-2xl md:mb-6 border-b md:border border-slate-100 shadow-sm px-3 py-3 flex justify-between items-center overflow-x-auto no-scrollbar">
            <div className="flex items-center gap-3 pr-4 flex-shrink-0">
              <span className="text-[#2C3E50]"><IconBank /></span>
              <h1 className="font-extrabold text-xl text-[#2C3E50] tracking-tight hidden sm:block">Asset<span className="text-[#0D9488]">Track</span></h1>
            </div>
            <div className="flex bg-slate-100/80 p-1 rounded-xl flex-shrink-0 gap-1">
              <button onClick={()=>setActiveTab('dashboard')} className={`nav-btn px-3 py-1.5 flex items-center gap-1.5 text-xs sm:text-sm font-bold ${activeTab==='dashboard'?'active':'text-[#7F8C8D]'}`}><IconGrid /> 總覽</button>
              <button onClick={()=>setActiveTab('realized')} className={`nav-btn px-3 py-1.5 flex items-center gap-1.5 text-xs sm:text-sm font-bold ${activeTab==='realized'?'active':'text-[#7F8C8D]'}`}><IconPieChart /> 已實現</button>
              <button onClick={()=>setActiveTab('history')} className={`nav-btn px-3 py-1.5 flex items-center gap-1.5 text-xs sm:text-sm font-bold ${activeTab==='history'?'active':'text-[#7F8C8D]'}`}><IconList /> 對帳</button>
            </div>
            <div className="flex gap-2 items-center pl-4 flex-shrink-0">
              <button onClick={()=>setIsSettingsOpen(true)} className="text-[#7F8C8D] hover:text-[#2C3E50] p-2 transition-colors hidden sm:block" title="設定"><IconSettings /></button>
              <button onClick={()=>{setCashForm({type:'deposit', date:new Date().toISOString().split('T')[0], amount:''}); setIsCashModalOpen(true);}} className="hidden md:flex items-center gap-1.5 bg-white border border-slate-200 text-[#2C3E50] px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-slate-50 transition-colors"><IconWallet /> 資金出入</button>
              <button onClick={()=>auth.signOut()} className="bg-slate-100 text-[#7F8C8D] w-8 h-8 rounded-xl flex items-center justify-center font-bold hover:bg-slate-200 transition-colors hidden sm:flex" title="登出"><IconLogout /></button>

          </nav>

          <main className="p-4 space-y-6">
            
            {/* 視圖：總覽 (Dashboard) */}
            {activeTab === 'dashboard' && (
              <>
                <div className="bento-card p-6">
                  <div className="flex justify-between items-end mb-4">
                    <div>
                      <p className="text-xs font-bold text-[#7F8C8D] uppercase tracking-wider mb-1">庫存總市值 (以目前市場現價計算)</p>
                      <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-[#2C3E50]">${fmtM(portfolio.sys.totalMarketValue)}</h2>
                    </div>
                    <div className="text-right">
                      <p className="text-[10px] font-bold text-[#7F8C8D] mb-1">庫存總成本 (您投入的資金)</p>
                      <p className="font-bold text-[#2C3E50]">${fmtM(portfolio.sys.totalInventoryCost)}</p>
                    </div>
                  </div>
                  
                  <div className="w-full h-3 rounded-full flex overflow-hidden mb-4 bg-slate-100">
                    {Object.values(portfolio.categoryStats).map((cat, i) => {
                      if (cat.value === 0) return null;
                      const pct = portfolio.sys.totalMarketValue > 0 ? (cat.value / portfolio.sys.totalMarketValue) * 100 : 0;
                      return <div key={i} style={{width: `${pct}%`, backgroundColor: cat.color}} className="transition-all duration-500"></div>;

                  </div>
                  <div className="flex flex-wrap gap-x-5 gap-y-2 text-xs font-bold text-[#7F8C8D]">
                    {Object.values(portfolio.categoryStats).map((cat, i) => {

                <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-white">
                  <h3 className="font-extrabold text-lg text-[#2C3E50]">{editingTradeId ? '編輯交易日誌' : '新增交易日誌'}</h3>
                  <button onClick={() => setIsTradeModalOpen(false)} className="bg-slate-100 hover:bg-slate-200 text-[#7F8C8D] w-8 h-8 rounded-full font-bold flex items-center justify-center transition-colors"><IconX /></button>
                </div>
                
                <form onSubmit={handleTradeSubmit} className="p-6 space-y-5 overflow-y-auto bg-slate-50/50">
                  <div className="flex bg-slate-200/60 p-1.5 rounded-xl">
                    <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-all ${!tradeForm.isFundMode ? 'bg-white shadow-sm text-[#2C3E50]' : 'text-[#7F8C8D]'}`}>
                      <input type="radio" checked={!tradeForm.isFundMode} onChange={()=>setTradeForm({...tradeForm, isFundMode: false, assetType: 'TW_STOCK', type: 'buy', price:'', shares:'', amount:'', netAmount:''})} className="hidden"/>股票 / ETF
                    </label>
                    <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-all ${tradeForm.isFundMode ? 'bg-white shadow-sm text-[#2C3E50]' : 'text-[#7F8C8D]'}`}>
                      <input type="radio" checked={tradeForm.isFundMode} onChange={()=>setTradeForm({...tradeForm, isFundMode: true, assetType: 'FUND', type: 'buy', price:'', shares:'', amount:'', netAmount:''})} className="hidden"/>共同基金
                    </label>
                  </div>

                  {tradeForm.strategy === '期初建倉 (舊庫存)' && (
                      <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-700 font-bold">
                          💡 提示：建立舊庫存時，請直接輸入「總股數」與「歷史平均成本」，系統會自動將其加總入庫。
                      </div>
                  )}

                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                    <div className="flex gap-2">
                       {!tradeForm.isFundMode && (
                         <select value={tradeForm.assetType} name="assetType" onChange={handleTradeChange} className="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-bold text-[#2C3E50]">
                           <option value="TW_STOCK">台股</option><option value="US_STOCK">美股</option><option value="TW_ETF">ETF</option>
                         </select>
                       )}
                       <select value={tradeForm.type} name="type" onChange={handleTradeChange} className="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-bold text-[#2C3E50]">
                         <option value="buy">{tradeForm.isFundMode?'申購 (買進)':'買進 (增股)'}</option>
                         <option value="sell">{tradeForm.isFundMode?'贖回 (賣出)':'賣出 (減股)'}</option>
                         {!tradeForm.isFundMode && <option value="dividend_cash">一般除息 (領取現金)</option>}
                         {!tradeForm.isFundMode && <option value="split_in">分割後 (無成本增股)</option>}
                         {!tradeForm.isFundMode && <option value="split_out">分割前 (減去舊股)</option>}
                         {tradeForm.isFundMode && <option value="dividend_reinvest">配息滾入 (加單位)</option>}
                       </select>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      {tradeForm.isFundMode ? (
                        <div className="col-span-2">
                          <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">基金名稱</label>
                          <input required type="text" name="name" placeholder="如: 安聯台灣大壩" value={tradeForm.name||''} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-[#2C3E50]"/>
                        </div>
                      ) : (
                        <>
                          <div>
                            <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">股票代號</label>
                            <input required type="text" name="symbol" placeholder="輸入後點空白處自動檢查" value={tradeForm.symbol||''} onChange={handleTradeChange} onBlur={handleSymbolBlur} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none uppercase font-bold text-[#2C3E50]"/>
                          </div>
                          <div>
                            <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">股票名稱 (會自動抓取/記憶)</label>
                            <input type="text" name="name" placeholder="如: 台積電" value={tradeForm.name||''} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-[#2C3E50]"/>
                          </div>
                        </>
                      )}
                      
                      <div className="col-span-2">
                        <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">交易日期</label>
                        <input required type="date" name="date" value={tradeForm.date||''} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-mono text-[#2C3E50]"/>
                      </div>

                      {tradeForm.isFundMode ? (
                        <>
                          <div className="col-span-2">
                            <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">投入/贖回總資金</label>
                            <input required type="number" step="0.01" name="amount" placeholder="例如: 10000" value={tradeForm.amount||''} onChange={handleTradeChange} className="w-full p-3 bg-white border border-blue-300 focus:border-[#3B82F6] focus:ring-1 focus:ring-[#3B82F6] rounded-xl outline-none font-mono text-lg font-bold text-blue-600 shadow-inner"/>
                          </div>
                          <div>
                            <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">當日淨值</label>
                            <input required type="number" step="0.0001" name="price" placeholder="0.0000" value={tradeForm.price||''} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-mono text-[#2C3E50]"/>
                          </div>
                          <div>
                            <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">獲得單位數 (系統推算)</label>
                            <input readOnly type="text" name="shares" value={tradeForm.shares||'0.0000'} className="w-full p-3 bg-slate-100 border border-transparent rounded-xl outline-none font-mono text-[#7F8C8D] font-bold"/>
                          </div>
                        </>
                      ) : (
                        <>
                          <div>
                              <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">
                                  {tradeForm.type === 'dividend_cash' ? '每股配息' : (tradeForm.type === 'split_in' || tradeForm.type === 'split_out' ? '單價 (分割填 0 即可)' : '成交單價 (平均成本)')}
                              </label>
                              <input required type="number" step="0.0001" name="price" placeholder="0.00" value={tradeForm.price||''} onChange={handleTradeChange} disabled={tradeForm.type === 'split_in' || tradeForm.type === 'split_out'} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-mono text-[#2C3E50] disabled:bg-slate-200 disabled:text-slate-400"/>
                          </div>
                          <div>
                              <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">
                                  {tradeForm.type === 'dividend_cash' ? '持股數 (可不填)' : '成交股數'}
                              </label>
                              <input type="number" step="0.0001" name="shares" placeholder="支援小數點" value={tradeForm.shares||''} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-mono text-[#2C3E50]"/>
                          </div>
                          
                          {(tradeForm.type === 'buy' || tradeForm.type === 'sell' || tradeForm.type === 'dividend_cash') && (
                            <>
                              <div><label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">手續費</label><input type="number" step="0.01" name="fee" value={tradeForm.fee||'0'} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-[#2C3E50]"/></div>
                              <div><label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">交易稅</label><input type="number" step="0.01" name="tax" value={tradeForm.tax||'0'} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-[#2C3E50]"/></div>
                            </>
                          )}
                          
                          <div className="col-span-2 bg-blue-50/50 border border-blue-100 p-3 rounded-xl flex justify-between items-center mt-2">
                            <span className="text-sm font-bold text-blue-700">
                                {tradeForm.type === 'dividend_cash' ? '配息總收款淨額 (可手動修改)' : '帳戶淨收付金額 (試算)'}
                            </span>
                            <input required type="number" step="0.01" name="netAmount" value={tradeForm.netAmount||''} onChange={(e) => setTradeForm({...tradeForm, netAmount: e.target.value})} disabled={tradeForm.type === 'split_in' || tradeForm.type === 'split_out'} className="w-32 text-right bg-white p-2 rounded-lg border border-blue-200 font-extrabold text-lg text-blue-800 outline-none focus:border-blue-400 disabled:bg-blue-100/50 disabled:border-transparent"/>
                          </div>
                        </>
                      )}
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                    <h4 className="font-bold text-[#2C3E50] text-sm">交易覆盤筆記</h4>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">策略歸屬</label>
                        <select name="strategy" value={tradeForm.strategy||''} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-bold text-[#2C3E50]">
                          {STRATEGY_TAGS.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                      </div>
                      {tradeForm.type === 'buy' && (
                        <div>
                          <label className="block text-[11px] font-bold text-[#7F8C8D] mb-1">進場理由</label>
                          <select name="reason" value={tradeForm.reason||''} onChange={handleTradeChange} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm text-[#2C3E50]">
                            <option value="">選擇主要理由...</option>{BUY_REASONS.map(r => <option key={r} value={r}>{r}</option>)}
                          </select>
                        </div>
                      )}
                      <div className="col-span-2">
                        <textarea name="notes" placeholder="寫下當時的情緒或備註..." value={tradeForm.notes||''} onChange={handleTradeChange} rows="2" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none resize-none text-sm text-[#2C3E50]"></textarea>
                      </div>
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-[#2C3E50] hover:bg-black text-white font-bold py-4 rounded-xl shadow-lg transition-all text-lg mt-2">儲存紀錄</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Cash Flow */}
          {isCashModalOpen && (
            <div className="fixed inset-0 bg-[#2C3E50]/60 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-4">
              <div className="bg-white w-full max-w-sm rounded-[2rem] overflow-hidden flex flex-col shadow-2xl">
                <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center">
                  <h3 className="font-extrabold text-lg text-[#2C3E50]">資金流水帳</h3>
                  <button onClick={() => setIsCashModalOpen(false)} className="bg-slate-100 text-[#7F8C8D] hover:bg-slate-200 w-8 h-8 rounded-full font-bold flex items-center justify-center transition-colors"><IconX /></button>
                </div>
                <form onSubmit={async(e)=>{
                  e.preventDefault();
                  await db.collection('users').doc(user.uid).collection('cashFlows').add({...cashForm, amount: parseFloat(cashForm.amount)||0});
                  setIsCashModalOpen(false);
                }} className="p-6 space-y-5 bg-slate-50/50">
                  <div className="flex bg-slate-200/60 p-1.5 rounded-xl">
                    <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer ${cashForm.type==='deposit'?'bg-white shadow-sm text-blue-600':'text-[#7F8C8D]'}`}><input type="radio" checked={cashForm.type==='deposit'} onChange={()=>setCashForm({...cashForm, type:'deposit'})} className="hidden"/>入金</label>
                    <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer ${cashForm.type==='withdraw'?'bg-white shadow-sm text-[#2C3E50]':'text-[#7F8C8D]'}`}><input type="radio" checked={cashForm.type==='withdraw'} onChange={()=>setCashForm({...cashForm, type:'withdraw'})} className="hidden"/>出金</label>
                    <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer ${cashForm.type==='dividend'?'bg-white shadow-sm text-emerald-600':'text-[#7F8C8D]'}`}><input type="radio" checked={cashForm.type==='dividend'} onChange={()=>setCashForm({...cashForm, type:'dividend'})} className="hidden"/>領股息</label>
                  </div>
                  <input required type="date" value={cashForm.date||''} onChange={e=>setCashForm({...cashForm, date: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl outline-none font-mono text-[#2C3E50]"/>
                  <input required type="number" step="1" placeholder="金額 (直接輸入數字)" value={cashForm.amount||''} onChange={e=>setCashForm({...cashForm, amount: e.target.value})} className="w-full p-3 bg-white border border-blue-300 rounded-xl outline-none font-mono text-2xl font-bold text-blue-600 focus:ring-1 focus:ring-blue-500 shadow-inner"/>
                  <input type="text" placeholder="備註 (如: 0050配息)" value={cashForm.notes||''} onChange={e=>setCashForm({...cashForm, notes: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl outline-none text-sm text-[#2C3E50]"/>
                  <button type="submit" className="w-full bg-[#2C3E50] text-white font-bold py-4 rounded-xl shadow-lg mt-2 text-lg hover:bg-black transition-colors">新增資金紀錄</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Settings */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-[#2C3E50]/60 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-4">
              <div className="bg-white w-full max-w-sm rounded-[2rem] overflow-hidden flex flex-col shadow-2xl">
                <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center">
                  <h3 className="font-extrabold text-lg text-[#2C3E50]">系統設定</h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="bg-slate-100 text-[#7F8C8D] hover:bg-slate-200 w-8 h-8 rounded-full font-bold flex items-center justify-center"><IconX /></button>
                </div>
                <div className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-[#7F8C8D] mb-1">Gemini AI API Key</label>
                    <p className="text-[10px] text-slate-500 mb-2">由於部署在外部網站，若要使用「圖片對帳單識別」功能，請填寫您的 Gemini API 金鑰 (金鑰僅存於您的瀏覽器本地)。</p>
                    <input type="text" placeholder="AIzaSy..." value={apiKeyInput} onChange={e=>setApiKeyInput(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-mono"/>
                  </div>
                  <button onClick={()=>{localStorage.setItem('gemini_api_key', apiKeyInput); setIsSettingsOpen(false);}} className="w-full bg-[#3B82F6] text-white font-bold py-3.5 rounded-xl shadow-md">儲存設定</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Smart Import */}
          {isImportModalOpen && (
            <div className="fixed inset-0 bg-[#2C3E50]/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-4">
              <div className="bg-white w-full max-w-2xl rounded-[2rem] overflow-hidden flex flex-col max-h-[90vh] shadow-2xl">
                <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center">
                  <h3 className="font-extrabold text-lg text-[#2C3E50] flex items-center gap-2"><IconUpload /> 智能匯入對帳單</h3>
                  <button onClick={() => {if(importState.status !== 'processing') setIsImportModalOpen(false)}} className="bg-slate-100 text-[#7F8C8D] hover:bg-slate-200 w-8 h-8 rounded-full font-bold flex items-center justify-center"><IconX /></button>
                </div>
                
                <div className="p-6 overflow-y-auto">
                  {importState.status === 'idle' && (
                    <>
                      <p className="text-sm text-[#7F8C8D] mb-4 text-center">支援券商對帳單 (美股CSV/台股CSV) 或 交易截圖 (JPG/PNG)。<br/>系統會自動解析並進行資料庫比對！</p>
                      <label className="drop-zone rounded-2xl p-10 flex flex-col items-center justify-center cursor-pointer group mb-4">
                        <input type="file" accept=".csv, image/jpeg, image/png" className="hidden" onChange={handleFileUpload} />
                        <div className="text-slate-400 group-hover:text-blue-500 mb-3 transition-colors"><IconImage /></div>
                        <span className="font-bold text-[#2C3E50] mb-1">點擊或拖曳檔案至此</span>
                      </label>
                      <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-700">
                        <strong>提醒：</strong> 若使用圖片識別功能，請先確保已於「設定」輸入有效的 API 金鑰。
                      </div>
                    </>
                  )}

                  {importState.status === 'processing' && (
                    <div className="py-16 flex flex-col items-center justify-center">
                      <div className="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                      <p className="font-bold text-[#2C3E50] animate-pulse">{importState.message}</p>
                    </div>
                  )}

                  {importState.status === 'review' && (
                    <div className="space-y-4">
                      <div className="bg-slate-50 p-4 rounded-xl text-sm font-bold text-[#2C3E50] text-center border border-slate-100">
                        對帳比對完成！請確認以下結果：
                      </div>

                      <div className="border border-[#10b981] rounded-xl overflow-hidden">
                        <div className="bg-[#10b981]/10 px-4 py-2 font-bold text-[#059669] flex justify-between">
                          <span>🟢 準備新增 (新紀錄)</span><span>{reconData.toAdd.length} 筆</span>
                        </div>
                        {reconData.toAdd.length > 0 && (
                          <div className="max-h-40 overflow-y-auto p-2 bg-white text-xs divide-y divide-slate-50">
                            {reconData.toAdd.map((tx, idx) => (
                              <div key={idx} className="py-2 px-2 flex justify-between text-slate-600">
                                <span>{tx.date} | {tx.type==='buy'?'買':'賣'} {tx.name||tx.symbol}</span>
                                <span className="font-mono">{tx.shares}股 @ ${tx.price}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {reconData.orphans.length > 0 && (
                        <div className="border border-[#f59e0b] rounded-xl overflow-hidden">
                          <div className="bg-[#f59e0b]/10 px-4 py-2 font-bold text-[#d97706] flex justify-between">
                            <span>🟡 幽靈提醒 (對帳單沒寫，但資料庫有)</span><span>{reconData.orphans.length} 筆</span>
                          </div>
                          <div className="max-h-40 overflow-y-auto p-2 bg-white text-xs divide-y divide-slate-50">
                            <p className="px-2 py-1 text-slate-400 italic mb-1">注意：這些是你過去「手動記的帳」，但在這次匯入的日期範圍內，對帳單上找不到它們！</p>
                            {reconData.orphans.map((tx, idx) => (
                              <div key={idx} className="py-2 px-2 flex justify-between text-slate-600">
                                <span>{tx.date} | {tx.type==='buy'?'買':'賣'} {tx.name||tx.symbol}</span>
                                <span className="font-mono text-amber-600">可能為手滑多記</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {reconData.duplicates.length > 0 && (
                        <div className="border border-slate-200 rounded-xl overflow-hidden">
                          <div className="bg-slate-100 px-4 py-2 font-bold text-slate-500 flex justify-between">
                            <span>⚪ 略過重複 (資料庫已存在)</span><span>{reconData.duplicates.length} 筆</span>
                          </div>
                        </div>
                      )}

                      <div className="flex gap-2 pt-4">
                        <button onClick={()=>setImportState({status:'idle',message:''})} className="flex-1 bg-slate-100 text-[#2C3E50] font-bold py-3.5 rounded-xl hover:bg-slate-200">取消重來</button>
                        <button onClick={confirmImport} disabled={reconData.toAdd.length === 0} className={`flex-1 font-bold py-3.5 rounded-xl text-white ${reconData.toAdd.length > 0 ? 'bg-[#3B82F6] hover:bg-blue-600 shadow-md' : 'bg-blue-300 cursor-not-allowed'}`}>
                          {reconData.toAdd.length > 0 ? '確認匯入' : '無新資料可匯入'}
                        </button>
                      </div>
                    </div>
                  )}

                  {(importState.status === 'success' || importState.status === 'error') && (
                    <div className="py-8 flex flex-col items-center text-center">
                      <div className={`w-12 h-12 rounded-full flex items-center justify-center mb-4 text-white ${importState.status === 'success' ? 'bg-[#10b981]' : 'bg-[#ef4444]'}`}>
                        {importState.status === 'success' ? <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 6L9 17l-5-5"/></svg> : <IconX />}
                      </div>
                      <p className="font-bold text-lg text-[#2C3E50] mb-2">{importState.status === 'success' ? '匯入完成' : '發生錯誤'}</p>
                      <p className="text-sm text-[#7F8C8D] mb-6">{importState.message}</p>
                      <button onClick={()=>{setImportState({status:'idle', message:''}); setIsImportModalOpen(false);}} className="w-full bg-slate-100 text-[#2C3E50] font-bold py-3.5 rounded-xl hover:bg-slate-200 transition-colors">關閉視窗</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
