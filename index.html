<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>專業資產帳務系統</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 核心 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-color: #F4F5F7;
      --card-bg: #FFFFFF;
      --text-main: #333333;
      --text-muted: #8E8E93;
      --up-color: #E53935; /* 台股紅漲 */
      --down-color: #4CAF50; /* 台股綠跌 */
      --primary-teal: #16A085; /* 主題綠 */
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); color: var(--text-main); -webkit-font-smoothing: antialiased; padding-bottom: 80px; }
    
    /* 隱藏捲軸但保持可滑動 */
    ::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .broker-card { background: var(--card-bg); border-radius: 16px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04); padding: 20px; margin-bottom: 16px; }
    
    /* 頂部頁籤樣式 */
    .top-tab { color: var(--text-muted); font-weight: 500; font-size: 16px; padding: 8px 12px; position: relative; white-space: nowrap; transition: color 0.2s; }
    .top-tab.active { color: var(--primary-teal); font-weight: 600; }
    .top-tab.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; background-color: var(--primary-teal); }

    /* 圓環圖表色系 */
    .color-1 { background-color: #3498DB; }
    .color-2 { background-color: #5DADE2; }
    .color-3 { background-color: #1ABC9C; }
    .color-4 { background-color: #48C9B0; }
    .color-5 { background-color: #9B59B6; }
    .color-6 { background-color: #E67E22; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 1. Firebase 初始化 ---
    const firebaseConfig = {
      apiKey: "AIzaSyBrLbe2Qx_k-icTv61SQNBw7n4hIcYBCiE",
      authDomain: "my-stock-tracker-f3065.firebaseapp.com",
      projectId: "my-stock-tracker-f3065",
      storageBucket: "my-stock-tracker-f3065.firebasestorage.app",
      messagingSenderId: "802802972309",
      appId: "1:802802972309:web:70c2eadc6b040689834d9c"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // 格式化工具 (台灣標準：紅漲綠跌)
    const fmtM = (num) => Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    const getColorClass = (num) => num > 0 ? 'text-[#E53935]' : num < 0 ? 'text-[#4CAF50]' : 'text-gray-500';
    const CHART_COLORS = ['#3498DB', '#5DADE2', '#1ABC9C', '#48C9B0', '#9B59B6', '#E67E22', '#F1C40F', '#E74C3C'];

    // --- 主元件 ---
    function App() {
      const [user, setUser] = useState(null);
      const [transactions, setTransactions] = useState([]);
      const [cashFlows, setCashFlows] = useState([]);
      const [marketPrices, setMarketPrices] = useState({});
      const [loading, setLoading] = useState(true);
      const [isFetchingPrices, setIsFetchingPrices] = useState(false);
      
      // 導航狀態
      const [bottomNav, setBottomNav] = useState('account'); // account, history, add, cash
      const [dashTab, setDashTab] = useState('ALL'); // ALL, TW_STOCK, US_STOCK, TW_ETF, FUND

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [formData, setFormData] = useState({});

      // --- 資料抓取 ---
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        setLoading(true);
        const unsubTx = db.collection('users').doc(user.uid).collection('transactions').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a, b) => new Date(a.date) - new Date(b.date));
          setTransactions(data);
        });
        const unsubCash = db.collection('users').doc(user.uid).collection('cashFlows').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setCashFlows(data);
          setLoading(false);
        });
        const unsubPrice = db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').onSnapshot((doc) => {
          if (doc.exists) setMarketPrices(doc.data());
        });
        return () => { unsubTx(); unsubCash(); unsubPrice(); };
      }, [user]);

      // --- 自動化更新股價 API (Yahoo Finance via AllOrigins) ---
      const fetchLivePrices = async () => {
        if (!user || portfolio.holdings.length === 0) return;
        setIsFetchingPrices(true);
        let updatedPrices = { ...marketPrices };
        
        for (let h of portfolio.holdings) {
          let yfSymbol = h.symbol;
          // 台股加上 .TW
          if ((h.category === 'TW_STOCK' || h.category === 'TW_ETF') && /^\d{4,6}$/.test(yfSymbol)) {
            yfSymbol += '.TW';
          }
          try {
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${yfSymbol}?interval=1d&range=1d`;
            const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
            const res = await fetch(proxy);
            const data = await res.json();
            const parsed = JSON.parse(data.contents);
            const price = parsed.chart.result[0].meta.regularMarketPrice;
            if (price) updatedPrices[h.symbol] = price;
          } catch (e) {
            console.log(`Failed to fetch ${yfSymbol}`);
          }
        }
        await db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').set(updatedPrices, { merge: true });
        setIsFetchingPrices(false);
        alert("今日行情已更新完畢！");
      };

      // --- 核心財務引擎 ---
      const portfolio = useMemo(() => {
        let holdings = {};
        let sys = { totalDeposits: 0, totalWithdrawals: 0, availableCash: 0 };
        
        let categories = {
          TW_STOCK: { marketValue: 0, cost: 0, unrealized: 0, items: [], label: '台股' },
          US_STOCK: { marketValue: 0, cost: 0, unrealized: 0, items: [], label: '海外股' },
          TW_ETF: { marketValue: 0, cost: 0, unrealized: 0, items: [], label: 'ETF' },
          FUND: { marketValue: 0, cost: 0, unrealized: 0, items: [], label: '基金' },
        };

        cashFlows.forEach(cf => {
          const amt = parseFloat(cf.amount) || 0;
          if (cf.type === 'deposit') { sys.totalDeposits += amt; sys.availableCash += amt; }
          else if (cf.type === 'withdraw') { sys.totalWithdrawals += amt; sys.availableCash -= amt; }
          else if (cf.type === 'dividend') { sys.availableCash += amt; }
        });

        transactions.forEach(tx => {
          let cat = tx.category || 'TW_STOCK';
          let sym = tx.symbol || tx.name;
          if (!holdings[sym]) holdings[sym] = { symbol: sym, name: tx.name, category: cat, qty: 0, totalCost: 0, avgCost: 0, buyQueue: [] };
          let h = holdings[sym];
          let qty = parseFloat(tx.shares) || 0;
          let netAmount = parseFloat(tx.netAmount) || 0;

          if (tx.type === 'buy') {
            h.qty += qty; h.totalCost += netAmount; h.avgCost = h.totalCost / h.qty;
            sys.availableCash -= netAmount;
            h.buyQueue.push({ qty, netAmount });
          } else if (tx.type === 'dividend_reinvest') {
            h.qty += qty; h.avgCost = h.totalCost / h.qty;
            h.buyQueue.push({ qty, netAmount: 0 }); 
          } else if (tx.type === 'sell') {
            let remainingToSell = qty; let realizedCost = 0;
            while (remainingToSell > 0 && h.buyQueue.length > 0) {
              let b = h.buyQueue[0];
              if (b.qty <= remainingToSell) { realizedCost += b.netAmount; remainingToSell -= b.qty; h.buyQueue.shift(); } 
              else { realizedCost += (b.netAmount / b.qty) * remainingToSell; b.qty -= remainingToSell; b.netAmount -= (b.netAmount / (b.qty + remainingToSell)) * remainingToSell; remainingToSell = 0; }
            }
            sys.availableCash += netAmount;
            h.qty -= qty; h.totalCost -= realizedCost;
            if (h.qty <= 0.0001) { h.qty = 0; h.totalCost = 0; h.avgCost = 0; h.buyQueue = []; }
          }
        });

        const activeHoldings = Object.values(holdings).filter(h => h.qty > 0);
        let totalMarketValue = 0; let totalCost = 0; let totalUnrealized = 0;

        activeHoldings.forEach(h => {
          let currentPrice = marketPrices[h.symbol] || h.avgCost;
          let marketValue = h.qty * currentPrice;
          let unrealized = marketValue - h.totalCost;
          
          h.currentPrice = currentPrice; h.marketValue = marketValue; h.unrealized = unrealized;
          h.roi = h.totalCost > 0 ? (unrealized / h.totalCost) * 100 : 0;

          totalMarketValue += marketValue;
          totalCost += h.totalCost;
          totalUnrealized += unrealized;

          if(categories[h.category]) {
            categories[h.category].marketValue += marketValue;
            categories[h.category].cost += h.totalCost;
            categories[h.category].unrealized += unrealized;
            categories[h.category].items.push(h);
          }
        });

        sys.totalMarketValue = totalMarketValue;
        sys.totalCost = totalCost;
        sys.totalUnrealized = totalUnrealized;
        sys.totalROI = totalCost > 0 ? (totalUnrealized / totalCost) * 100 : 0;
        
        // 分類排序 (佔比大到小)
        Object.keys(categories).forEach(k => {
          categories[k].items.sort((a,b) => b.marketValue - a.marketValue);
        });

        return { holdings: activeHoldings, sys, categories };
      }, [transactions, cashFlows, marketPrices]);


      // --- 圖表元件 ---
      const DonutChart = ({ items, totalValue }) => {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);
        useEffect(() => {
          if (!canvasRef.current || items.length === 0) return;
          if (chartInstance.current) chartInstance.current.destroy();
          
          // 若超過5個，剩下的歸類為其他
          let sorted = [...items].sort((a,b)=>b.marketValue - a.marketValue);
          let topItems = sorted.slice(0, 4);
          let otherValue = sorted.slice(4).reduce((sum, item) => sum + item.marketValue, 0);
          
          let labels = topItems.map(i => i.name || i.symbol);
          let data = topItems.map(i => i.marketValue);
          if (otherValue > 0) { labels.push('其他'); data.push(otherValue); }

          const ctx = canvasRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: labels, datasets: [{ data: data, backgroundColor: CHART_COLORS, borderWidth: 0 }] },
            options: { cutout: '75%', plugins: { legend: { display: false }, tooltip: { enabled: false } }, animation: { duration: 0 } }
          });
          return () => chartInstance.current?.destroy();
        }, [items]);
        
        if(items.length === 0) return <div className="w-32 h-32 rounded-full border-8 border-gray-100 mx-auto"></div>;

        return (
          <div className="relative w-32 h-32 mx-auto flex-shrink-0">
            <canvas ref={canvasRef}></canvas>
            {/* 圖表中心文字 */}
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <span className="text-[10px] text-gray-400 font-bold mb-0.5">TWD</span>
              <span className="text-lg font-bold text-gray-800 leading-none">{fmtM(totalValue)}</span>
              <span className={`text-[10px] font-bold mt-1 ${getColorClass(portfolio.sys.totalUnrealized)}`}>
                {portfolio.sys.totalUnrealized > 0 ? '+' : ''}{totalValue > 0 ? ((portfolio.sys.totalUnrealized/totalValue)*100).toFixed(2) : '0.00'}%
              </span>
            </div>
          </div>
        );
      };

      // --- 渲染畫面 ---
      if (loading) return <div className="flex h-screen items-center justify-center text-gray-400 font-bold">系統載入中...</div>;
      if (!user) {
        return (
          <div className="flex h-screen items-center justify-center bg-white p-6">
            <div className="w-full max-w-sm text-center">
              <div className="w-20 h-20 bg-[#16A085] text-white rounded-3xl mx-auto flex items-center justify-center mb-6 shadow-lg text-4xl">📊</div>
              <h1 className="text-3xl font-bold mb-2 tracking-tight text-gray-800">資產帳務系統</h1>
              <p className="text-gray-500 mb-10 font-medium">還原專業券商體驗，精準計算庫存損益</p>
              <button onClick={() => auth.signInWithPopup(googleProvider)} className="w-full bg-[#16A085] text-white px-6 py-4 rounded-full font-bold shadow-md active:scale-95 transition-transform">Google 帳號登入</button>
            </div>
          </div>
        );
      }

      // 決定當前顯示的資料分類
      const renderData = dashTab === 'ALL' 
        ? { marketValue: portfolio.sys.totalMarketValue, cost: portfolio.sys.totalCost, unrealized: portfolio.sys.totalUnrealized, items: portfolio.holdings }
        : portfolio.categories[dashTab];

      return (
        <div className="min-h-screen pb-20">
          
          {/* 頂部功能與頁籤 (僅在帳務總覽顯示) */}
          {bottomNav === 'account' && (
            <div className="bg-white sticky top-0 z-10 shadow-[0_2px_10px_rgba(0,0,0,0.03)]">
              <div className="flex justify-center items-center py-4 relative">
                <h1 className="text-lg font-bold text-gray-800">帳務</h1>
                <button onClick={fetchLivePrices} disabled={isFetchingPrices} className="absolute right-4 text-[#16A085] p-2 bg-[#16A085]/10 rounded-full text-xs font-bold flex items-center gap-1">
                  {isFetchingPrices ? '更新中...' : '↻ 更新淨值'}
                </button>
              </div>
              <div className="flex overflow-x-auto no-scrollbar px-4 border-b border-gray-100">
                <button onClick={()=>setDashTab('ALL')} className={`top-tab ${dashTab==='ALL'?'active':''}`}>總覽</button>
                <button onClick={()=>setDashTab('TW_STOCK')} className={`top-tab ${dashTab==='TW_STOCK'?'active':''}`}>台股</button>
                <button onClick={()=>setDashTab('US_STOCK')} className={`top-tab ${dashTab==='US_STOCK'?'active':''}`}>海外股票</button>
                <button onClick={()=>setDashTab('TW_ETF')} className={`top-tab ${dashTab==='TW_ETF'?'active':''}`}>ETF</button>
                <button onClick={()=>setDashTab('FUND')} className={`top-tab ${dashTab==='FUND'?'active':''}`}>基金</button>
              </div>
            </div>
          )}

          <main className="p-4 max-w-lg mx-auto">
            {/* 視圖：帳務總覽 (Dashboard) */}
            {bottomNav === 'account' && (
              <>
                {/* 總覽專屬：水位進度條卡片 */}
                {dashTab === 'ALL' && (
                  <div className="broker-card">
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-gray-500 font-medium">庫存總現值 (TWD) <span className="text-xs ml-1 border border-gray-300 rounded-full px-1.5 py-0.5">👁</span></span>
                      <span className="text-[10px] text-gray-400">依昨收匯率計算</span>
                    </div>
                    <div className="flex items-baseline gap-2 mb-4">
                      <h2 className="text-3xl font-extrabold text-gray-900">{fmtM(portfolio.sys.totalMarketValue)}</h2>
                      <span className={`font-bold ${getColorClass(portfolio.sys.totalROI)}`}>
                        ({portfolio.sys.totalROI > 0 ? '+' : ''}{portfolio.sys.totalROI.toFixed(2)}%)
                      </span>
                    </div>
                    
                    <div className="flex justify-between items-end mb-3">
                      <div>
                        <p className="text-xs text-gray-500 mb-0.5">總成本</p>
                        <p className="font-bold text-gray-800 text-lg">{fmtM(portfolio.sys.totalCost)}</p>
                      </div>
                      <div className="text-right">
                        <p className="text-xs text-gray-500 mb-0.5 flex items-center gap-1 justify-end">不含息參考報酬 <span className="w-3 h-3 border border-gray-300 rounded-full text-[8px] flex items-center justify-center">i</span></p>
                        <p className={`font-bold text-lg ${getColorClass(portfolio.sys.totalUnrealized)}`}>
                          {portfolio.sys.totalUnrealized > 0 ? '+' : ''}{fmtM(portfolio.sys.totalUnrealized)}
                        </p>
                      </div>
                    </div>

                    {/* 資產分布進度條 */}
                    <div className="w-full h-3 rounded-full flex overflow-hidden mb-3">
                      {Object.entries(portfolio.categories).map(([k, v], i) => {
                        if (v.marketValue === 0) return null;
                        const pct = (v.marketValue / portfolio.sys.totalMarketValue) * 100;
                        return <div key={k} style={{width: `${pct}%`, backgroundColor: CHART_COLORS[i]}}></div>;
                      })}
                    </div>
                    <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs font-bold text-gray-600">
                      {Object.entries(portfolio.categories).map(([k, v], i) => {
                        if (v.marketValue === 0) return null;
                        return <div key={k} className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{backgroundColor: CHART_COLORS[i]}}></span> {v.label} {((v.marketValue/portfolio.sys.totalMarketValue)*100).toFixed(2)}%</div>
                      })}
                      <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-blue-100"></span> 現金 {fmtM(portfolio.sys.availableCash)}</div>
                    </div>
                  </div>
                )}

                {/* 分類圓餅圖卡片 (台股、美股、基金等) */}
                {(dashTab !== 'ALL' || renderData.items.length > 0) && (
                  <div className="broker-card relative overflow-hidden">
                    <div className="flex justify-between items-center mb-6">
                      <h3 className="font-bold text-lg text-gray-800">{dashTab === 'ALL' ? '全資產分佈' : renderData.label}</h3>
                      {dashTab !== 'ALL' && <button className="text-[#16A085] text-sm font-bold">看{renderData.label}明細 ></button>}
                    </div>
                    
                    <div className="flex items-center gap-2 mb-4">
                      <span className="text-gray-600 text-sm font-medium">庫存現值比例</span>
                      <span className="text-[#16A085] text-sm font-bold flex items-center">總資產 <svg className="w-4 h-4 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg></span>
                    </div>

                    <div className="flex flex-row items-center gap-4 mb-6">
                      {/* 左側：甜甜圈圖 */}
                      <DonutChart items={renderData.items} totalValue={renderData.marketValue} />
                      
                      {/* 右側：自訂圖例 */}
                      <div className="flex-1 space-y-2">
                        {renderData.items.slice(0, 4).sort((a,b)=>b.marketValue-a.marketValue).map((item, idx) => (
                          <div key={idx} className="flex items-center gap-2 text-sm">
                            <span className="w-2 h-2 rounded-full flex-shrink-0" style={{backgroundColor: CHART_COLORS[idx]}}></span>
                            <span className="text-gray-500 font-mono w-10">{((item.marketValue/renderData.marketValue)*100).toFixed(1)}%</span>
                            <span className="text-gray-700 font-bold truncate max-w-[80px]">{item.name || item.symbol}</span>
                          </div>
                        ))}
                        {renderData.items.length > 4 && (
                           <div className="flex items-center gap-2 text-sm">
                            <span className="w-2 h-2 rounded-full flex-shrink-0" style={{backgroundColor: CHART_COLORS[4]}}></span>
                            <span className="text-gray-500 font-mono w-10">
                              {((renderData.items.slice(4).reduce((sum,i)=>sum+i.marketValue,0)/renderData.marketValue)*100).toFixed(1)}%
                            </span>
                            <span className="text-gray-700 font-bold">其他</span>
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="flex justify-between items-end border-t border-gray-100 pt-4">
                      <div>
                        <p className="text-xs text-gray-500 mb-0.5">總成本</p>
                        <p className="font-bold text-gray-800 text-lg">{fmtM(renderData.cost)}</p>
                      </div>
                      <div className="text-right">
                        <p className="text-xs text-gray-500 mb-0.5 flex items-center gap-1 justify-end">不含息參考報酬 <span className="w-3 h-3 border border-gray-300 rounded-full text-[8px] flex items-center justify-center">i</span></p>
                        <p className={`font-bold text-lg ${getColorClass(renderData.unrealized)}`}>
                          {renderData.unrealized > 0 ? '+' : ''}{fmtM(renderData.unrealized)}
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {/* 庫存明細列表 (可手動修改淨值) */}
                <div className="broker-card p-0 overflow-hidden mt-4">
                  <div className="px-5 py-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                    <h3 className="font-bold text-gray-800">各別庫存明細</h3>
                    <span className="text-xs text-gray-400">可點擊右側手動修改淨值</span>
                  </div>
                  <div className="divide-y divide-gray-100">
                    {renderData.items.map((h, i) => (
                      <div key={i} className="p-4 flex justify-between items-center">
                        <div className="flex-1">
                          <div className="font-bold text-gray-900">{h.name || h.symbol}</div>
                          <div className="text-xs text-gray-500 font-mono mt-0.5">{h.shares || h.qty} {h.category==='FUND'?'單位':'股'} • 均價 {h.avgCost.toFixed(2)}</div>
                        </div>
                        <div className="text-right flex flex-col items-end gap-1">
                          {/* 可編輯的現價欄位 */}
                          <input type="number" step="0.01" value={h.currentPrice||''} 
                            onChange={(e) => {
                              const val = parseFloat(e.target.value);
                              if(!isNaN(val)) db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').set({[h.symbol]: val}, {merge:true});
                            }} 
                            className="w-20 text-right font-bold text-gray-800 bg-gray-100 px-2 py-1 rounded outline-none focus:bg-white focus:ring-1 focus:ring-[#16A085] transition-all" 
                          />
                          <div className={`text-sm font-bold ${getColorClass(h.unrealized)}`}>
                            {h.unrealized > 0 ? '+' : ''}{fmtM(h.unrealized)}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </>
            )}

            {/* 視圖：交易明細 */}
            {bottomNav === 'history' && (
              <div className="broker-card p-0">
                <div className="px-5 py-4 border-b border-gray-100 bg-gray-50"><h3 className="font-bold text-gray-800">所有交易明細</h3></div>
                <div className="divide-y divide-gray-100">
                  {transactions.slice().reverse().map(tx => (
                    <div key={tx.id} className="p-4 flex gap-4 items-center">
                      <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-xs flex-shrink-0 ${tx.type === 'buy' ? 'bg-[#E53935]/10 text-[#E53935]' : tx.type === 'dividend_reinvest' ? 'bg-blue-100 text-blue-600' : 'bg-[#4CAF50]/10 text-[#4CAF50]'}`}>
                        {tx.type === 'buy' ? '買/申' : tx.type === 'dividend_reinvest' ? '配息' : '賣/贖'}
                      </div>
                      <div className="flex-1">
                        <div className="font-bold text-gray-900">{tx.name || tx.symbol}</div>
                        <div className="text-xs text-gray-500 font-mono">{tx.date} • {tx.price} x {tx.shares}</div>
                      </div>
                      <div className="text-right">
                        <div className="font-bold text-gray-900">${fmtM(tx.netAmount)}</div>
                        <button onClick={()=>{ if(window.confirm('確定刪除？')) db.collection('users').doc(user.uid).collection('transactions').doc(tx.id).delete(); }} className="text-red-400 text-xs mt-1">刪除</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            
            {/* 視圖：出入金 */}
            {bottomNav === 'cash' && (
              <div className="broker-card p-0">
                <div className="px-5 py-4 border-b border-gray-100 bg-gray-50"><h3 className="font-bold text-gray-800">資金流水帳</h3></div>
                <div className="divide-y divide-gray-100">
                  {cashFlows.slice().reverse().map(cf => (
                    <div key={cf.id} className="p-4 flex justify-between items-center">
                      <div>
                        <div className={`font-bold text-sm ${cf.type==='deposit'?'text-blue-600':cf.type==='withdraw'?'text-gray-800':'text-[#4CAF50]'}`}>
                          {cf.type==='deposit'?'入金儲值':cf.type==='withdraw'?'提領出金':'領取股息'}
                        </div>
                        <div className="text-xs text-gray-500 font-mono mt-0.5">{cf.date} {cf.notes&& `• ${cf.notes}`}</div>
                      </div>
                      <div className="font-bold text-gray-900">${fmtM(cf.amount)}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* 底部導航列 (Bottom Navigation) */}
          <nav className="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center pb-safe pt-2 px-2 z-20 shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
            <button onClick={()=>setBottomNav('history')} className={`flex flex-col items-center p-2 w-16 ${bottomNav==='history'?'text-[#16A085]':'text-gray-400'}`}>
              <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
              <span className="text-[10px] font-medium">明細</span>
            </button>
            <button onClick={()=>setBottomNav('cash')} className={`flex flex-col items-center p-2 w-16 ${bottomNav==='cash'?'text-[#16A085]':'text-gray-400'}`}>
               <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
              <span className="text-[10px] font-medium">資金</span>
            </button>
            <div className="relative -top-5">
              <button onClick={()=>{setFormData({assetType:'TW_STOCK', type:'buy', date:new Date().toISOString().split('T')[0]}); setIsModalOpen(true);}} className="w-14 h-14 bg-[#16A085] rounded-full text-white flex items-center justify-center shadow-lg shadow-[#16A085]/30 active:scale-95 transition-transform border-4 border-white">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
              </button>
            </div>
            <button onClick={()=>setBottomNav('account')} className={`flex flex-col items-center p-2 w-16 ${bottomNav==='account'?'text-[#16A085]':'text-gray-400'}`}>
              <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
              <span className="text-[10px] font-medium">帳務</span>
            </button>
            <button onClick={()=>auth.signOut()} className={`flex flex-col items-center p-2 w-16 text-gray-400 hover:text-gray-600`}>
              <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
              <span className="text-[10px] font-medium">登出</span>
            </button>
          </nav>

          {/* --- 彈出視窗：新增交易 --- */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center z-50">
              <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-10">
                  <h3 className="font-bold text-lg text-gray-800">記一筆紀錄</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600 font-bold p-1">✕</button>
                </div>
                
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  if(formData.mode === 'cash') {
                    await db.collection('users').doc(user.uid).collection('cashFlows').add({...formData, amount: parseFloat(formData.amount)||0});
                  } else {
                    let price = parseFloat(formData.price)||0, shares = parseFloat(formData.shares)||0;
                    let fee = parseFloat(formData.fee)||0, tax = parseFloat(formData.tax)||0;
                    let net = formData.type === 'dividend_reinvest' ? 0 : formData.type === 'buy' ? (price*shares + fee + tax) : (price*shares - fee - tax);
                    await db.collection('users').doc(user.uid).collection('transactions').add({ ...formData, price, shares, fee, tax, netAmount: net, symbol: formData.symbol?.toUpperCase() || formData.name });
                  }
                  setIsModalOpen(false);
                }} className="p-6 space-y-5 overflow-y-auto bg-gray-50">
                  
                  {/* 表單模式切換 */}
                  <div className="flex bg-gray-200/50 p-1 rounded-xl">
                    <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer ${formData.mode !== 'cash' ? 'bg-white shadow text-[#16A085]' : 'text-gray-500'}`}>
                      <input type="radio" checked={formData.mode !== 'cash'} onChange={()=>setFormData({...formData, mode:'trade', assetType:'TW_STOCK'})} className="hidden"/> 買賣股票/基金
                    </label>
                    <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer ${formData.mode === 'cash' ? 'bg-white shadow text-[#16A085]' : 'text-gray-500'}`}>
                      <input type="radio" checked={formData.mode === 'cash'} onChange={()=>setFormData({...formData, mode:'cash', type:'deposit'})} className="hidden"/> 資金出入金
                    </label>
                  </div>

                  {formData.mode !== 'cash' ? (
                    <>
                      <div className="flex gap-2">
                         <select required value={formData.assetType} onChange={e=>setFormData({...formData, assetType: e.target.value})} className="flex-1 p-3 bg-white border border-gray-200 rounded-xl outline-none text-sm font-bold text-gray-700">
                           <option value="TW_STOCK">台股</option><option value="US_STOCK">美股</option><option value="TW_ETF">ETF</option><option value="FUND">共同基金</option>
                         </select>
                         <select required value={formData.type} onChange={e=>setFormData({...formData, type: e.target.value})} className="flex-1 p-3 bg-white border border-gray-200 rounded-xl outline-none text-sm font-bold text-gray-700">
                           <option value="buy">買進/申購</option><option value="sell">賣出/贖回</option>
                           {formData.assetType === 'FUND' && <option value="dividend_reinvest">配息再投資(加單位)</option>}
                         </select>
                      </div>
                      
                      <div className="grid grid-cols-2 gap-4">
                        <div className={formData.assetType==='FUND'?'col-span-2':''}>
                          <input required type="text" placeholder={formData.assetType==='FUND'?'基金名稱':'股票代號'} value={formData.assetType==='FUND'?formData.name:formData.symbol} onChange={(e)=>{ if(formData.assetType==='FUND') setFormData({...formData, name: e.target.value, symbol: e.target.value}); else setFormData({...formData, symbol: e.target.value.toUpperCase()}); }} className="w-full p-3 border border-gray-200 rounded-xl outline-none font-bold uppercase"/>
                        </div>
                        {formData.assetType !== 'FUND' && (
                          <input type="text" placeholder="標的名稱 (選填)" value={formData.name||''} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full p-3 border border-gray-200 rounded-xl outline-none"/>
                        )}
                        <input required type="date" value={formData.date} onChange={e=>setFormData({...formData, date: e.target.value})} className="col-span-2 w-full p-3 border border-gray-200 rounded-xl outline-none font-mono"/>
                        <input required type="number" step="0.0001" placeholder={formData.assetType==='FUND'?'成交淨值':'成交單價'} value={formData.price||''} onChange={e=>setFormData({...formData, price: e.target.value})} className="w-full p-3 border border-gray-200 rounded-xl outline-none font-mono"/>
                        <input required type="number" step="0.00001" placeholder={formData.assetType==='FUND'?'單位數':'成交股數'} value={formData.shares||''} onChange={e=>setFormData({...formData, shares: e.target.value})} className="w-full p-3 border border-gray-200 rounded-xl outline-none font-mono"/>
                        {formData.type !== 'dividend_reinvest' && (
                          <>
                            <input type="number" step="1" placeholder={formData.assetType==='FUND'?'申購/手續費':'手續費'} value={formData.fee||''} onChange={e=>setFormData({...formData, fee: e.target.value})} className="w-full p-3 border border-gray-200 rounded-xl outline-none"/>
                            <input type="number" step="1" placeholder={formData.assetType==='FUND'?'信託保管/贖回費':'交易稅'} value={formData.tax||''} onChange={e=>setFormData({...formData, tax: e.target.value})} className="w-full p-3 border border-gray-200 rounded-xl outline-none"/>
                          </>
                        )}
                      </div>
                    </>
                  ) : (
                    <>
                      <select required value={formData.type} onChange={e=>setFormData({...formData, type: e.target.value})} className="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none text-sm font-bold text-gray-700">
                        <option value="deposit">💰 銀行轉入證券戶 (入金)</option><option value="withdraw">🏧 從證券戶提領 (出金)</option><option value="dividend">💵 領取現金股息</option>
                      </select>
                      <input required type="date" value={formData.date} onChange={e=>setFormData({...formData, date: e.target.value})} className="w-full p-3 border border-gray-200 rounded-xl outline-none font-mono"/>
                      <input required type="number" step="1" placeholder="金額 (TWD)" value={formData.amount||''} onChange={e=>setFormData({...formData, amount: e.target.value})} className="w-full p-3 border border-gray-200 rounded-xl outline-none font-mono text-xl font-bold"/>
                      <input type="text" placeholder="備註 (如: 0050配息)" value={formData.notes||''} onChange={e=>setFormData({...formData, notes: e.target.value})} className="w-full p-3 border border-gray-200 rounded-xl outline-none"/>
                    </>
                  )}
                  
                  <button type="submit" className="w-full bg-[#16A085] text-white font-bold py-4 rounded-xl shadow-md active:scale-95 transition-transform mt-4 text-lg">
                    確認送出
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
