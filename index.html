<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡資產管理系統 - 三水桶架構</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 核心 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-color: #F7F9FC;
      --card-bg: #FFFFFF;
      --text-main: #1D1D1F;
      --text-muted: #86868B;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #D1D1D6; border-radius: 4px; }
    
    .glass-card { background: var(--card-bg); border-radius: 20px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); border: 1px solid rgba(0, 0, 0, 0.04); transition: all 0.2s ease; }
    .nav-item { transition: all 0.2s ease; border-radius: 12px; }
    .nav-item.active { background-color: var(--text-main); color: #FFF; font-weight: 600; }
    .nav-item:not(.active):hover { background-color: #E5E5EA; color: var(--text-main); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 1. Firebase 初始化 ---
    const firebaseConfig = {
      apiKey: "AIzaSyBrLbe2Qx_k-icTv61SQNBw7n4hIcYBCiE",
      authDomain: "my-stock-tracker-f3065.firebaseapp.com",
      projectId: "my-stock-tracker-f3065",
      storageBucket: "my-stock-tracker-f3065.firebasestorage.app",
      messagingSenderId: "802802972309",
      appId: "1:802802972309:web:70c2eadc6b040689834d9c"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // --- 2. 基礎資料設定 ---
    const BUY_REASONS = ['技術面突破', '基本面財報', '籌碼面優勢', '攤平/向下建倉', '定期定額', '情緒衝動/FOMO'];
    
    // 內建常用圖示
    const Icons = {
      Dashboard: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>,
      Trade: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 20V10m0 0l-3 3m3-3l3 3M12 4v2"/></svg>,
      Analytics: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 20V10m-6 10V4M6 20v-4"/></svg>,
      Wallet: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2v-5zm0 0h-4a2 2 0 010-4h4"/></svg>,
    };

    // 格式化工具 (修復白畫面核心：必須在全域或元件內明確定義)
    const fmtM = (num) => Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const getColorClass = (num) => num > 0 ? 'text-[#FF3B30]' : num < 0 ? 'text-[#34C759]' : 'text-gray-500';

    // --- 3. 系統主元件 ---
    function App() {
      const [user, setUser] = useState(null);
      const [transactions, setTransactions] = useState([]);
      const [cashFlows, setCashFlows] = useState([]);
      const [marketPrices, setMarketPrices] = useState({});
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');

      // 表單狀態
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalType, setModalType] = useState('trade'); // 'trade' | 'cash'
      const [formData, setFormData] = useState({});

      // --- 資料抓取與認證 ---
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        setLoading(true);
        const unsubTx = db.collection('users').doc(user.uid).collection('transactions').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a, b) => new Date(a.date) - new Date(b.date));
          setTransactions(data);
        });
        const unsubCash = db.collection('users').doc(user.uid).collection('cashFlows').onSnapshot((snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setCashFlows(data);
          setLoading(false);
        });
        const unsubPrice = db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').onSnapshot((doc) => {
          if (doc.exists) setMarketPrices(doc.data());
        });
        return () => { unsubTx(); unsubCash(); unsubPrice(); };
      }, [user]);

      // --- 核心財務引擎 (三水桶邏輯 + 基金 FIFO) ---
      const portfolio = useMemo(() => {
        let holdings = {};
        let sys = {
          totalDeposits: 0, totalWithdrawals: 0, 
          availableCash: 0, // 水桶1：現金
          stockMarketValue: 0, fundMarketValue: 0, // 水桶2：資產市值
          totalRealized: 0, totalUnrealized: 0,
        };

        // 1. 計算現金流水帳 (處理本金與配息)
        cashFlows.forEach(cf => {
          const amt = parseFloat(cf.amount) || 0;
          if (cf.type === 'deposit') { sys.totalDeposits += amt; sys.availableCash += amt; }
          else if (cf.type === 'withdraw') { sys.totalWithdrawals += amt; sys.availableCash -= amt; }
          else if (cf.type === 'dividend') { sys.availableCash += amt; sys.totalRealized += amt; } // 現金配息算已實現
        });

        // 定義三水桶第一桶：淨本金
        sys.netPrincipal = sys.totalDeposits - sys.totalWithdrawals;

        // 2. 結算股票與基金
        transactions.forEach(tx => {
          let assetType = tx.assetType || 'stock'; // 預設股票
          let sym = tx.symbol || tx.name; // 基金可能只有名稱
          
          if (!holdings[sym]) {
            holdings[sym] = { symbol: sym, name: tx.name, assetType: assetType, qty: 0, totalCost: 0, avgCost: 0, realizedProfit: 0, buyQueue: [] };
          }
          let h = holdings[sym];
          let qty = parseFloat(tx.shares) || 0; // shares 欄位兼用為單位數
          let netAmount = parseFloat(tx.netAmount) || 0;
          let txDate = new Date(tx.date);

          if (tx.type === 'buy') {
            h.qty += qty;
            h.totalCost += netAmount;
            h.avgCost = h.totalCost / h.qty;
            sys.availableCash -= netAmount; // 買進扣除現金
            h.buyQueue.push({ qty, netAmount });
          } else if (tx.type === 'dividend_reinvest') {
            // 基金特有：配息再投資 (單位數增加，不扣現金，總成本不變，拉低均價)
            h.qty += qty;
            h.avgCost = h.totalCost / h.qty;
            h.buyQueue.push({ qty, netAmount: 0 }); 
          } else if (tx.type === 'sell') {
            // FIFO 扣除成本
            let remainingToSell = qty;
            let realizedCost = 0;

            while (remainingToSell > 0 && h.buyQueue.length > 0) {
              let b = h.buyQueue[0];
              if (b.qty <= remainingToSell) {
                realizedCost += b.netAmount;
                remainingToSell -= b.qty;
                h.buyQueue.shift();
              } else {
                realizedCost += (b.netAmount / b.qty) * remainingToSell;
                b.qty -= remainingToSell;
                b.netAmount -= (b.netAmount / (b.qty + remainingToSell)) * remainingToSell;
                remainingToSell = 0;
              }
            }

            let profit = netAmount - realizedCost;
            h.realizedProfit += profit;
            sys.totalRealized += profit;
            sys.availableCash += netAmount; // 賣出獲得現金

            h.qty -= qty;
            h.totalCost -= realizedCost;
            if (h.qty <= 0.0001) { h.qty = 0; h.totalCost = 0; h.avgCost = 0; h.buyQueue = []; }
          }
        });

        // 3. 計算未實現與各水桶現值
        const activeHoldings = Object.values(holdings).filter(h => h.qty > 0);
        
        activeHoldings.forEach(h => {
          let currentPrice = marketPrices[h.symbol] || h.avgCost; // 現價或淨值
          let marketValue = h.qty * currentPrice;
          let unrealized = marketValue - h.totalCost;
          
          h.currentPrice = currentPrice;
          h.marketValue = marketValue;
          h.unrealized = unrealized;
          h.roi = h.totalCost > 0 ? (unrealized / h.totalCost) * 100 : 0;

          if(h.assetType === 'fund') sys.fundMarketValue += marketValue;
          else sys.stockMarketValue += marketValue;
          
          sys.totalUnrealized += unrealized;
        });

        // 三水桶統合
        sys.totalAssets = sys.availableCash + sys.stockMarketValue + sys.fundMarketValue;
        sys.totalPnl = sys.totalAssets - sys.netPrincipal; // 唯一真理公式驗算

        // 產生圓餅圖資料
        sys.allocation = {
          labels: ['現金餘額', ...activeHoldings.map(h=>h.name||h.symbol)],
          data: [sys.availableCash, ...activeHoldings.map(h=>h.marketValue)]
        };

        return { holdings: activeHoldings, sys, allHoldings: Object.values(holdings) };
      }, [transactions, cashFlows, marketPrices]);


      // --- 元件：圓餅圖 ---
      const PieChart = ({ allocation }) => {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);
        useEffect(() => {
          if (!canvasRef.current || !allocation.data.length) return;
          if (chartInstance.current) chartInstance.current.destroy();
          
          const ctx = canvasRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: allocation.labels,
              datasets: [{
                data: allocation.data,
                backgroundColor: ['#007AFF', '#FF3B30', '#FF9500', '#34C759', '#5856D6', '#AF52DE', '#FF2D55'],
                borderWidth: 0,
              }]
            },
            options: { cutout: '70%', plugins: { legend: { display: false } } }
          });
          return () => chartInstance.current?.destroy();
        }, [allocation]);
        return <canvas ref={canvasRef} className="max-h-[220px] mx-auto"></canvas>;
      };


      // --- UI 主畫面 ---
      if (loading) return <div className="flex h-screen items-center justify-center bg-[#F7F9FC] font-bold text-gray-400">系統載入中...</div>;
      
      if (!user) {
        return (
          <div className="flex h-screen items-center justify-center bg-[#F7F9FC]">
            <div className="glass-card p-10 text-center max-w-sm w-full mx-4 shadow-xl">
              <div className="w-20 h-20 bg-[#1D1D1F] text-white rounded-3xl mx-auto flex items-center justify-center mb-6 shadow-lg text-3xl">🏦</div>
              <h1 className="text-2xl font-extrabold mb-2 tracking-tight">三水桶資產管理</h1>
              <p className="text-[#86868B] text-sm mb-8 leading-relaxed">嚴格區分本金與獲利<br/>完美支援股票與共同基金</p>
              <button onClick={() => auth.signInWithPopup(googleProvider).catch(()=>alert("登入失敗"))} 
                className="w-full bg-[#007AFF] hover:bg-[#0056b3] text-white px-6 py-4 rounded-xl font-bold transition-all shadow-md">
                Google 授權登入
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden bg-[#F7F9FC]">
          
          {/* 左側導航 */}
          <nav className="w-full md:w-64 bg-white border-r border-gray-100 flex-shrink-0 flex flex-col justify-between fixed bottom-0 md:relative z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] md:shadow-none">
            <div className="p-4 md:p-6 flex flex-row md:flex-col gap-2 md:gap-4 overflow-x-auto md:overflow-visible">
              <div className="hidden md:flex items-center gap-3 mb-8 px-2">
                <div className="w-8 h-8 bg-[#1D1D1F] text-white rounded-lg flex items-center justify-center text-sm font-bold">桶</div>
                <span className="font-extrabold text-lg tracking-tight">資產金庫</span>
              </div>
              
              <button onClick={() => setActiveTab('dashboard')} className={`nav-item flex items-center gap-3 px-4 py-3 min-w-[100px] justify-center md:justify-start ${activeTab === 'dashboard' ? 'active' : 'text-[#86868B]'}`}>
                <Icons.Dashboard /> <span className="text-sm">總覽儀表板</span>
              </button>
              <button onClick={() => setActiveTab('trade')} className={`nav-item flex items-center gap-3 px-4 py-3 min-w-[100px] justify-center md:justify-start ${activeTab === 'trade' ? 'active' : 'text-[#86868B]'}`}>
                <Icons.Trade /> <span className="text-sm">歷史交易</span>
              </button>
            </div>
            
            <div className="hidden md:block p-6 border-t border-gray-100">
              <button onClick={() => auth.signOut()} className="text-sm text-[#86868B] hover:text-[#1D1D1F] font-bold w-full text-left px-2">登出帳號</button>
            </div>
          </nav>

          {/* 右側主內容區 */}
          <main className="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8">
            <header className="flex justify-between items-center mb-8">
              <h2 className="text-2xl font-extrabold tracking-tight">
                {activeTab === 'dashboard' ? '三水桶資金分析' : '歷史明細'}
              </h2>
              <div className="flex gap-2">
                <button onClick={() => {setModalType('cash'); setFormData({type:'deposit', date:new Date().toISOString().split('T')[0], amount:''}); setIsModalOpen(true);}} className="bg-white border border-gray-200 text-[#1D1D1F] px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-gray-50 transition-all flex items-center gap-2">
                  <Icons.Wallet /> 出入金/配息
                </button>
                <button onClick={() => {setModalType('trade'); setFormData({assetType:'stock', type:'buy', date:new Date().toISOString().split('T')[0], symbol:'', name:'', shares:'', price:'', fee:'0', tax:'0'}); setIsModalOpen(true);}} className="bg-[#1D1D1F] text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md hover:bg-black transition-all flex items-center gap-2">
                  + 記一筆交易
                </button>
              </div>
            </header>

            {/* --- 分頁：首頁 Dashboard --- */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6 max-w-5xl">
                
                {/* 瀑布圖堆疊卡片：三水桶核心 */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="glass-card p-6 bg-blue-50/50 border-blue-100/50 relative overflow-hidden">
                    <div className="absolute -right-4 -bottom-4 text-6xl opacity-10">💵</div>
                    <p className="text-xs text-blue-600 font-bold uppercase tracking-wider mb-2">你的真金白銀</p>
                    <p className="text-sm text-slate-500 mb-1">淨投入本金</p>
                    <h3 className="text-3xl font-extrabold tracking-tight text-[#1D1D1F]">${fmtM(portfolio.sys.netPrincipal)}</h3>
                  </div>
                  
                  <div className="flex items-center justify-center md:hidden text-gray-400 font-bold text-xl">+</div>
                  
                  <div className={`glass-card p-6 relative overflow-hidden ${portfolio.sys.totalPnl >= 0 ? 'bg-[#34C759]/5 border-[#34C759]/20' : 'bg-[#FF3B30]/5 border-[#FF3B30]/20'}`}>
                    <div className="absolute -right-4 -bottom-4 text-6xl opacity-10">📈</div>
                    <p className={`text-xs font-bold uppercase tracking-wider mb-2 ${portfolio.sys.totalPnl >= 0 ? 'text-[#34C759]' : 'text-[#FF3B30]'}`}>市場幫你賺的</p>
                    <p className="text-sm text-slate-500 mb-1">生涯總損益</p>
                    <h3 className={`text-3xl font-extrabold tracking-tight ${getColorClass(portfolio.sys.totalPnl)}`}>
                      {portfolio.sys.totalPnl > 0 ? '+' : ''}${fmtM(portfolio.sys.totalPnl)}
                    </h3>
                  </div>

                  <div className="flex items-center justify-center md:hidden text-gray-400 font-bold text-xl">=</div>

                  <div className="glass-card p-6 bg-[#1D1D1F] text-white relative overflow-hidden">
                    <div className="absolute -right-4 -bottom-4 text-6xl opacity-10">🏦</div>
                    <p className="text-xs text-gray-400 font-bold uppercase tracking-wider mb-2">Total Assets</p>
                    <p className="text-sm text-gray-300 mb-1">目前總資產</p>
                    <h3 className="text-3xl font-extrabold tracking-tight">${fmtM(portfolio.sys.totalAssets)}</h3>
                  </div>
                </div>

                {/* 總資產細項拆解 */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* 左側：資產配置圓餅圖 */}
                  <div className="glass-card p-6 md:col-span-1 flex flex-col">
                    <h3 className="font-bold text-lg mb-6 text-center">總資產分佈</h3>
                    <div className="flex-1 flex items-center justify-center mb-6">
                      <PieChart allocation={portfolio.sys.allocation} />
                    </div>
                    <div className="space-y-3 border-t border-gray-100 pt-4">
                      <div className="flex justify-between items-center"><span className="text-[#86868B] text-sm">現金餘額</span><span className="font-bold text-[#007AFF]">${fmtM(portfolio.sys.availableCash)}</span></div>
                      <div className="flex justify-between items-center"><span className="text-[#86868B] text-sm">股票市值</span><span className="font-bold">${fmtM(portfolio.sys.stockMarketValue)}</span></div>
                      <div className="flex justify-between items-center"><span className="text-[#86868B] text-sm">基金市值</span><span className="font-bold">${fmtM(portfolio.sys.fundMarketValue)}</span></div>
                    </div>
                  </div>

                  {/* 右側：持股/基金庫存 */}
                  <div className="glass-card p-0 md:col-span-2 overflow-hidden flex flex-col">
                    <div className="px-6 py-4 border-b border-gray-100 bg-[#F8F9FA] flex justify-between items-center">
                      <h3 className="font-bold text-lg">投資部位清單</h3>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto">
                      <table className="w-full text-left text-sm whitespace-nowrap">
                        <thead className="text-[11px] text-[#86868B] uppercase tracking-wider sticky top-0 bg-white shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
                          <tr>
                            <th className="px-6 py-3 font-bold">標的與類型</th>
                            <th className="px-6 py-3 font-bold text-right">均價 / 數量(單位)</th>
                            <th className="px-6 py-3 font-bold text-right">手動輸入現價/淨值</th>
                            <th className="px-6 py-3 font-bold text-right">未實現損益 (ROI)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-50">
                          {portfolio.holdings.length === 0 ? <tr><td colSpan="4" className="text-center py-12 text-[#86868B]">尚無部位</td></tr> : null}
                          {portfolio.holdings.map((h, i) => (
                            <tr key={i} className="hover:bg-[#F8F9FA] transition-colors group">
                              <td className="px-6 py-4">
                                <div className="font-extrabold text-base">{h.name || h.symbol}</div>
                                <div className="text-[10px] font-bold mt-0.5 inline-block px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">
                                  {h.assetType === 'fund' ? '共同基金' : '股票/ETF'}
                                </div>
                              </td>
                              <td className="px-6 py-4 text-right">
                                <div className="font-bold text-[#1D1D1F]">${h.avgCost.toFixed(4)}</div>
                                <div className="text-xs text-[#86868B] mt-0.5">{h.qty.toFixed(4)}</div>
                              </td>
                              <td className="px-6 py-4 text-right">
                                <input type="number" step="0.0001" value={h.currentPrice||''} onChange={(e) => {
                                    const val = parseFloat(e.target.value);
                                    if(!isNaN(val)) db.collection('users').doc(user.uid).collection('settings').doc('marketPrices').set({[h.symbol]: val}, {merge:true});
                                  }} 
                                  className="w-24 px-2 py-1.5 text-right bg-gray-50 border border-gray-200 rounded-md focus:ring-2 focus:ring-[#007AFF] outline-none font-mono text-sm transition-all hover:bg-white shadow-inner" placeholder="填寫淨值"/>
                              </td>
                              <td className="px-6 py-4 text-right">
                                <div className={`font-extrabold text-base ${getColorClass(h.unrealized)}`}>{h.unrealized > 0 ? '+' : ''}{fmtM(h.unrealized)}</div>
                                <div className={`text-[11px] font-bold mt-1 inline-block px-1.5 py-0.5 rounded ${h.roi > 0 ? 'bg-[#FF3B30]/10 text-[#FF3B30]' : 'bg-[#34C759]/10 text-[#34C759]'}`}>
                                  {h.roi > 0 ? '+' : ''}{h.roi.toFixed(2)}%
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* --- 分頁：交易日誌 --- */}
            {activeTab === 'trade' && (
              <div className="glass-card overflow-hidden max-w-5xl">
                <div className="px-6 py-4 border-b border-gray-100 bg-[#F8F9FA]">
                  <h3 className="font-bold text-lg">所有交易明細</h3>
                </div>
                <div className="divide-y divide-gray-50">
                  {transactions.slice().reverse().map(tx => (
                    <div key={tx.id} className="p-6 hover:bg-[#F8F9FA] transition-colors flex flex-col md:flex-row gap-6 items-start md:items-center group">
                      
                      <div className="flex items-center gap-4 min-w-[200px]">
                        <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold text-sm ${tx.type === 'buy' ? 'bg-[#FF3B30]/10 text-[#FF3B30]' : tx.type === 'dividend_reinvest' ? 'bg-[#007AFF]/10 text-[#007AFF]' : 'bg-[#34C759]/10 text-[#34C759]'}`}>
                          {tx.type === 'buy' ? '買/申' : tx.type === 'dividend_reinvest' ? '配息' : '賣/贖'}
                        </div>
                        <div>
                          <div className="font-extrabold text-lg flex items-center gap-2">
                            {tx.name || tx.symbol} 
                            <span className="text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">{tx.assetType === 'fund'?'基金':'股票'}</span>
                          </div>
                          <div className="text-xs text-[#86868B]">{tx.date}</div>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4 text-sm flex-1">
                        <div><span className="text-[#86868B]">{tx.assetType==='fund'?'淨值':'單價'}:</span> <span className="font-bold text-mono">${tx.price}</span></div>
                        <div><span className="text-[#86868B]">{tx.assetType==='fund'?'單位數':'股數'}:</span> <span className="font-bold text-mono">{tx.shares}</span></div>
                        <div className="col-span-2 pt-2 border-t border-gray-100"><span className="text-[#86868B]">淨收付金額:</span> <span className={`font-extrabold text-lg ${tx.type==='dividend_reinvest'?'text-[#007AFF]':''}`}>{tx.type==='dividend_reinvest' ? '0 (獲得免費單位)' : '$'+fmtM(tx.netAmount)}</span></div>
                      </div>

                      <div className="flex flex-col items-end gap-2 min-w-[100px]">
                        <button onClick={()=>{ if(window.confirm('確定刪除？這會影響三水桶計算。')) db.collection('users').doc(user.uid).collection('transactions').doc(tx.id).delete(); }} 
                          className="text-[#86868B] hover:text-[#FF3B30] text-sm opacity-0 group-hover:opacity-100 transition-opacity">
                          刪除紀錄
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* --- Modal：共用輸入表單 --- */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-[#1D1D1F]/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="glass-card w-full max-w-md overflow-hidden flex flex-col max-h-[90vh] shadow-2xl">
                <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-[#F8F9FA]">
                  <h3 className="font-extrabold text-lg">{modalType === 'trade' ? '📝 紀錄一筆交易' : '💰 水桶出入金/配息'}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-[#86868B] hover:text-[#1D1D1F] text-xl font-bold leading-none bg-gray-200 w-8 h-8 rounded-full">✕</button>
                </div>
                
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  if(modalType === 'trade') {
                    let price = parseFloat(formData.price)||0, shares = parseFloat(formData.shares)||0;
                    let fee = parseFloat(formData.fee)||0, tax = parseFloat(formData.tax)||0;
                    let net = 0;
                    
                    if (formData.type === 'dividend_reinvest') net = 0; // 配息再投資不扣現金
                    else if (formData.type === 'buy') net = (price*shares + fee + tax);
                    else net = (price*shares - fee - tax); // sell

                    let payload = { ...formData, price, shares, fee, tax, netAmount: net, symbol: formData.symbol?.toUpperCase() || formData.name };
                    await db.collection('users').doc(user.uid).collection('transactions').add(payload);
                  } else {
                    await db.collection('users').doc(user.uid).collection('cashFlows').add({...formData, amount: parseFloat(formData.amount)||0});
                  }
                  setIsModalOpen(false);
                }} className="p-6 space-y-5 overflow-y-auto bg-white">

                  {modalType === 'trade' ? (
                    <>
                      {/* 資產類別切換 */}
                      <div className="flex bg-gray-100 p-1.5 rounded-xl">
                        <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-colors ${formData.assetType === 'stock' ? 'bg-white shadow text-[#1D1D1F]' : 'text-[#86868B]'}`}>
                          <input type="radio" checked={formData.assetType === 'stock'} onChange={()=>{setFormData({...formData, assetType:'stock', type:'buy'})}} className="hidden"/> 📈 股票/ETF
                        </label>
                        <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-colors ${formData.assetType === 'fund' ? 'bg-white shadow text-[#1D1D1F]' : 'text-[#86868B]'}`}>
                          <input type="radio" checked={formData.assetType === 'fund'} onChange={()=>{setFormData({...formData, assetType:'fund', type:'buy'})}} className="hidden"/> 🏦 共同基金
                        </label>
                      </div>

                      {/* 買賣別切換 */}
                      <div className="flex gap-2">
                        <label className={`flex-1 text-center py-2 text-sm font-bold border-2 rounded-xl cursor-pointer transition-colors ${formData.type === 'buy' ? 'border-[#FF3B30] bg-[#FF3B30]/5 text-[#FF3B30]' : 'border-gray-100 text-gray-400'}`}>
                          <input type="radio" checked={formData.type === 'buy'} onChange={()=>setFormData({...formData, type:'buy'})} className="hidden"/> {formData.assetType==='fund'?'申購':'買進'}
                        </label>
                        <label className={`flex-1 text-center py-2 text-sm font-bold border-2 rounded-xl cursor-pointer transition-colors ${formData.type === 'sell' ? 'border-[#34C759] bg-[#34C759]/5 text-[#34C759]' : 'border-gray-100 text-gray-400'}`}>
                          <input type="radio" checked={formData.type === 'sell'} onChange={()=>setFormData({...formData, type:'sell'})} className="hidden"/> {formData.assetType==='fund'?'贖回':'賣出'}
                        </label>
                        {formData.assetType === 'fund' && (
                          <label className={`flex-1 text-center py-2 text-[11px] font-bold border-2 rounded-xl cursor-pointer transition-colors flex flex-col justify-center leading-tight ${formData.type === 'dividend_reinvest' ? 'border-[#007AFF] bg-[#007AFF]/5 text-[#007AFF]' : 'border-gray-100 text-gray-400'}`}>
                            <input type="radio" checked={formData.type === 'dividend_reinvest'} onChange={()=>setFormData({...formData, type:'dividend_reinvest'})} className="hidden"/> 配息滾入<br/>(加單位)
                          </label>
                        )}
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div className={formData.assetType==='fund'?'col-span-2':''}>
                          <label className="block text-xs font-bold text-[#86868B] mb-1">{formData.assetType==='fund'?'基金名稱':'股票代號'}</label>
                          <input required type="text" value={formData.assetType==='fund'?formData.name:formData.symbol} onChange={(e)=>{
                            if(formData.assetType==='fund') setFormData({...formData, name: e.target.value, symbol: e.target.value});
                            else setFormData({...formData, symbol: e.target.value.toUpperCase()});
                          }} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#007AFF] outline-none font-bold uppercase"/>
                        </div>
                        
                        {formData.assetType === 'stock' && (
                          <div>
                            <label className="block text-xs font-bold text-[#86868B] mb-1">股票名稱 (選填)</label>
                            <input type="text" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#007AFF] outline-none"/>
                          </div>
                        )}
                        
                        <div className="col-span-2">
                          <label className="block text-xs font-bold text-[#86868B] mb-1">交易日期</label>
                          <input required type="date" value={formData.date} onChange={e=>setFormData({...formData, date: e.target.value})} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#007AFF] outline-none font-mono"/>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-[#86868B] mb-1">{formData.assetType==='fund'?'成交淨值':'成交單價'}</label>
                          <input required type="number" step="0.0001" value={formData.price} onChange={e=>setFormData({...formData, price: e.target.value})} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#007AFF] outline-none font-mono text-lg"/>
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-[#86868B] mb-1">{formData.assetType==='fund'?'單位數 (小數點後5位)':'成交股數'}</label>
                          <input required type="number" step="0.00001" value={formData.shares} onChange={e=>setFormData({...formData, shares: e.target.value})} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#007AFF] outline-none font-mono text-lg text-[#007AFF]"/>
                        </div>

                        {/* 費用區塊動態顯示 */}
                        {formData.type !== 'dividend_reinvest' && (
                          <>
                            <div>
                              <label className="block text-xs font-bold text-[#86868B] mb-1">{formData.assetType==='fund'?'申購手續費 (前端)':'券商手續費'}</label>
                              <input type="number" step="1" value={formData.fee} onChange={e=>setFormData({...formData, fee: e.target.value})} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#007AFF] outline-none"/>
                            </div>
                            <div>
                              <label className="block text-xs font-bold text-[#86868B] mb-1">{formData.assetType==='fund'?'信託保管/贖回費 (後端)':'交易稅'}</label>
                              <input type="number" step="1" value={formData.tax} onChange={e=>setFormData({...formData, tax: e.target.value})} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#007AFF] outline-none"/>
                            </div>
                          </>
                        )}
                      </div>
                      
                      {/* 動態顯示試算淨額 */}
                      <div className="bg-blue-50 border border-blue-100 p-3 rounded-xl flex justify-between items-center mt-2">
                        <span className="text-sm font-bold text-blue-800">帳戶淨收付金額 (試算)</span>
                        <span className="font-extrabold text-xl text-blue-900">
                          {formData.type === 'dividend_reinvest' ? '$0' : 
                            '$' + fmtM((parseFloat(formData.price)||0)*(parseFloat(formData.shares)||0) + 
                            (formData.type==='buy'?1:-1)*((parseFloat(formData.fee)||0)+(parseFloat(formData.tax)||0)))
                          }
                        </span>
                      </div>
                      {formData.type === 'dividend_reinvest' && <p className="text-[10px] text-gray-500 text-center">配息滾入不扣帳戶現金，純粹增加持有單位數以降低均價。</p>}
                    </>
                  ) : (
                    <>
                      {/* 出入金表單 */}
                      <div className="flex bg-gray-100 p-1.5 rounded-xl">
                        <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-colors ${formData.type === 'deposit' ? 'bg-white shadow text-[#007AFF]' : 'text-[#86868B]'}`}>
                          <input type="radio" checked={formData.type === 'deposit'} onChange={()=>setFormData({...formData, type:'deposit'})} className="hidden"/> 入金儲值
                        </label>
                        <label className={`flex-1 text-center py-2 text-sm font-bold rounded-lg cursor-pointer transition-colors ${formData.type === 'withdraw' ? 'bg-white shadow text-[#1D1D1F]' : 'text-[#86868B]'}`}>
                          <input type="radio" checked={formData.type === 'withdraw'} onChange={()=>setFormData({...formData, type:'withdraw'})} className="hidden"/> 提領出金
                        </label>
                        <label className={`flex-1 text-center py-2 text-[11px] flex flex-col justify-center leading-tight font-bold rounded-lg cursor-pointer transition-colors ${formData.type === 'dividend' ? 'bg-white shadow text-[#34C759]' : 'text-[#86868B]'}`}>
                          <input type="radio" checked={formData.type === 'dividend'} onChange={()=>setFormData({...formData, type:'dividend'})} className="hidden"/> 領現金配息<br/>(不影響本金)
                        </label>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-[#86868B] mb-1">日期</label>
                        <input required type="date" value={formData.date} onChange={e=>setFormData({...formData, date: e.target.value})} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none font-mono"/>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-[#86868B] mb-1">金額</label>
                        <input required type="number" step="1" value={formData.amount} onChange={e=>setFormData({...formData, amount: e.target.value})} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none font-mono text-2xl font-bold text-[#007AFF]"/>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-[#86868B] mb-1">備註</label>
                        <input type="text" placeholder="薪水轉入、0050配息..." value={formData.notes||''} onChange={e=>setFormData({...formData, notes: e.target.value})} className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none"/>
                      </div>
                    </>
                  )}
                  
                  <button type="submit" className="w-full bg-[#1D1D1F] hover:bg-[#000000] text-white font-bold py-4 rounded-xl transition-all shadow-lg text-lg">
                    確認送出
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
